<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>My Team — OLH Tracker</title>
<style>
  :root{
    --navy:#1B2A58; --ink:#2B2620; --muted:#6F6963; --faint:#908A82;
    --border:#E4DED2; --bg:#FBF8F3; --card:#ffffff;
    --amber-bg:#FFF8E1; --amber-ink:#7C4A03; --amber-border:#F0DFAE;
    --red-bg:#FDECEA; --red-ink:#7F1D1D; --red-border:#F3C6C2;
    --green-bg:#EAF6EE; --green-ink:#1E5B34; --green-border:#C6E6D2;
    --blue-bg:#EAF1FB; --blue-ink:#1B3E7C; --blue-border:#C6D8F3;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  a{color:var(--navy)}
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 20px; background:var(--navy); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:50; flex-wrap:wrap;
  }
  header.top h1{ margin:0; font:400 22px/1.2 Georgia,"Times New Roman",serif; color:#fff; letter-spacing:-.01em; }
  .who{ font-size:12px; color:#C7BFB2; }
  header.top .nav{ display:flex; gap:8px; flex-wrap:wrap; }
  header.top a.home{
    display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 13px;
    border:1px solid rgba(255,255,255,.28); border-radius:4px; background:transparent;
    color:#C7BFB2; font-size:13px; font-weight:500; text-decoration:none; white-space:nowrap;
  }
  header.top a.home:hover{ background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.45); color:#fff; }

  main{ max-width:1060px; margin:0 auto; padding:22px 20px 80px; }
  #banners{ margin-bottom:16px; }
  .banner{ padding:12px 16px; border-radius:8px; font-size:13.5px; margin-bottom:8px; }
  .banner.error{ background:var(--red-bg); color:var(--red-ink); border:1px solid var(--red-border); }
  .banner.ok{ background:var(--green-bg); color:var(--green-ink); border:1px solid var(--green-border); }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px 22px; margin-bottom:18px; }
  .card h2{ margin:0 0 14px; font:400 18px/1.2 Georgia,"Times New Roman",serif; color:var(--navy); }

  .toolbar{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
  .toolbar label{ display:block; font-size:11px; font-weight:600; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em; }
  .toolbar select{ padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:13.5px; background:#fff; color:var(--ink); min-width:220px; }

  .linklike{ color:var(--navy); text-decoration:none; font-size:13px; font-weight:600; }
  .linklike:hover{ text-decoration:underline; }

  .roster{ display:flex; flex-direction:column; gap:8px; }
  .roster-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 16px; border:1px solid var(--border); border-radius:10px; background:var(--card); text-decoration:none; color:inherit; }
  .roster-row:hover{ border-color:var(--navy); background:#FCFAF6; }
  .roster-name{ font-weight:600; color:var(--ink); }
  .roster-meta{ font-size:12.5px; color:var(--muted); }
  .roster-arrow{ color:var(--faint); font-size:16px; }

  .empty{ color:var(--muted); font-size:13px; padding:14px 2px; }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>My Team</h1>
    <div class="who" id="whoLine">Loading…</div>
  </div>
  <div class="nav">
    <a class="home" href="/team-daily-summaries">Daily Summaries</a>
    <a class="home" href="/team-1on1s">One-on-Ones</a>
    <a class="home" href="/">All Views</a>
  </div>
</header>

<main>
  <div id="banners"></div>
  <div id="content">Loading…</div>
</main>

<script>
(function () {
  'use strict';

  var API = '/api';
  var SESSION_KEY = 'olh.session.v1';

  function getSession() {
    try { var v = localStorage.getItem(SESSION_KEY); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function authHeaders(extra) {
    var h = Object.assign({ Accept: 'application/json' }, extra || {});
    var s = getSession();
    var tok = s && s.token;
    if (tok) { h.Authorization = 'Bearer ' + tok; h['X-OLH-Token'] = 'Bearer ' + tok; }
    return h;
  }
  function authedFetchHeaders(extra) {
    if (!getSession() || !getSession().token) {
      throw new Error('You are not signed in. Sign in at the OLH Tracker home page, then reload this page.');
    }
    return authHeaders(extra);
  }
  function apiGet(path) {
    return fetch(API + path, { headers: authedFetchHeaders() }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (body) {
        if (res.status === 401) { var e = new Error((body && body.error) || 'Your session has expired.'); e.status = 401; throw e; }
        if (!res.ok || !body) throw new Error((body && body.error) || (path + ' failed (' + res.status + ')'));
        return body;
      });
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* A manager needs EITHER team rollup permission to reach this page -- see
     team-roster.js for why it is an either/or rather than a third permission. */
  function isTeamManager(can) {
    return can.indexOf('page.teamdaily') >= 0 || can.indexOf('page.team1on1') >= 0;
  }

  var state = {
    user: null, can: [], loading: true, error: '',
    roster: [], isAdmin: false, viewingAll: false, viewingManager: null,
    managers: [], viewAs: '' // '' = my own team, 'all' = everyone flat, else a Users record id
  };

  /* Admin-only. '' (own team) and 'all' (flat) are always offered; every
     name from A.managersFrom (netlify/lib/olh-auth.js) is a "view as manager"
     option -- exactly the roster that person would see on this same page. */
  function viewAsHtml() {
    if (!state.isAdmin) return '';
    var opts = '<option value=""' + (state.viewAs === '' ? ' selected' : '') + '>My own team</option>' +
      state.managers.map(function (m) {
        return '<option value="' + esc(m.userId) + '"' + (state.viewAs === m.userId ? ' selected' : '') + '>' +
          esc(m.name || m.userId) + '</option>';
      }).join('') +
      '<option value="all"' + (state.viewAs === 'all' ? ' selected' : '') + '>Everyone (flat)</option>';
    return '<div class="card"><div class="toolbar">' +
      '<div><label for="fViewAs">View as (Admin)</label><select id="fViewAs">' + opts + '</select></div>' +
    '</div></div>';
  }

  function rosterHtml() {
    var active = state.roster.filter(function (r) { return r.active !== false && r.email; });
    var heading = state.viewingManager
      ? esc(state.viewingManager.name) + '\u2019s Direct Reports — ' + active.length
      : (state.viewAs === 'all' ? 'Everyone — ' + active.length : 'Direct Reports — ' + active.length);
    if (!active.length) {
      var whose = state.viewingManager ? esc(state.viewingManager.name) : 'you';
      return '<div class="card"><div class="empty">No direct reports are linked to ' + whose + ' yet. ' +
        'The Manager field on the Users table is what scopes this page.</div></div>';
    }
    var rows = active.map(function (r) {
      return '<a class="roster-row" href="/team-associate?email=' + encodeURIComponent(r.email) + '">' +
        '<span><span class="roster-name">' + esc(r.name || r.email) + '</span>' +
          (r.division ? ' <span class="roster-meta">· ' + esc(r.division) + '</span>' : '') +
        '</span><span class="roster-arrow">&rarr;</span></a>';
    }).join('');
    return '<div class="card"><h2>' + heading + '</h2><div class="roster">' + rows + '</div></div>';
  }

  function render() {
    var who = document.getElementById('whoLine');
    who.textContent = state.user
      ? (state.user.name || state.user.email) + (state.user.division ? ' · ' + state.user.division : '')
      : 'Not signed in';

    var banners = '';
    if (state.error) banners += '<div class="banner error">' + esc(state.error) + '</div>';
    document.getElementById('banners').innerHTML = banners;

    var el = document.getElementById('content');
    if (state.loading) { el.innerHTML = '<div class="empty">Loading…</div>'; return; }
    if (state.error && !state.user) { el.innerHTML = ''; return; }

    if (!isTeamManager(state.can)) {
      el.innerHTML = '<div class="card"><div class="empty">Your role does not have access to My Team. ' +
        'Ask an admin to grant Team Daily Summaries or Team One-on-Ones on the Roles &amp; Permissions grid.</div></div>';
      return;
    }

    el.innerHTML = '<div class="card"><h2>Click into an associate</h2>' +
      '<div class="empty" style="padding:0">Each associate\u2019s page has their closed-case performance for the last 7 and ' +
      '30 days, a recap of their daily summaries, and their one-on-one history.</div></div>' +
      viewAsHtml() + rosterHtml();
    wire();
  }

  function wire() {
    var sel = document.getElementById('fViewAs');
    if (sel) sel.addEventListener('change', function () { state.viewAs = sel.value; reload(); });
  }

  function load() {
    var qs = state.viewAs === 'all' ? '?all=1'
      : state.viewAs ? '?managerId=' + encodeURIComponent(state.viewAs)
      : '';
    return apiGet('/team-roster' + qs).then(function (data) {
      state.roster = Array.isArray(data.roster) ? data.roster : [];
      state.isAdmin = !!data.isAdmin;
      state.viewingAll = !!data.viewingAll;
      state.viewingManager = data.viewingManager || null;
      state.managers = Array.isArray(data.managers) ? data.managers : [];
    });
  }
  function loadSession() {
    return apiGet('/session').then(function (data) {
      state.user = data.user || null;
      state.can = data.can || [];
    });
  }
  function reload() {
    state.loading = true; state.error = '';
    render();
    load().then(function () { state.loading = false; render(); })
      .catch(function (err) {
        state.loading = false;
        state.error = 'Could not load that view: ' + (err && err.message ? err.message : String(err));
        render();
      });
  }

  /* ---- Boot ------------------------------------------------------------ */
  var session = getSession();
  if (!session || !session.token) {
    document.getElementById('content').innerHTML =
      '<div class="empty">You are not signed in. <a href="/">Sign in at the OLH Tracker home page</a>, then reload this page.</div>';
    document.getElementById('whoLine').textContent = 'Not signed in';
  } else {
    loadSession()
      .then(function () { if (isTeamManager(state.can)) return load(); })
      .then(function () { state.loading = false; render(); })
      .catch(function (err) {
        state.loading = false;
        if (err && err.status === 401) {
          state.error = 'Your session has expired. Sign in again at the OLH Tracker home page, then reload this page.';
        } else {
          state.error = 'Could not load this page: ' + (err && err.message ? err.message : String(err));
        }
        render();
      });
  }
})();
</script>
</body>
</html>
