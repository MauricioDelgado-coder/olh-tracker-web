<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Case Aging Exception — OLH Tracker</title>
<style>
  :root{
    --navy:#1B2A58; --ink:#2B2620; --muted:#6F6963; --faint:#908A82;
    --border:#E4DED2; --bg:#FBF8F3; --card:#ffffff;
    --amber-bg:#FFF8E1; --amber-ink:#7C4A03; --amber-border:#F0DFAE;
    --red-bg:#FDECEA; --red-ink:#7F1D1D; --red-border:#F3C6C2;
    --green-bg:#EAF6EE; --green-ink:#1E5B34; --green-border:#C6E6D2;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  a{color:var(--navy)}
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 20px; background:var(--navy); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:50; flex-wrap:wrap;
  }
  header.top h1{
    margin:0; font:400 22px/1.2 Georgia,"Times New Roman",serif; color:#fff;
    letter-spacing:-.01em;
  }
  .who{ font-size:12px; color:#C7BFB2; }
  header.top a.home{
    display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 13px;
    border:1px solid rgba(255,255,255,.28); border-radius:4px; background:transparent;
    color:#C7BFB2; font-size:13px; font-weight:500; text-decoration:none; white-space:nowrap;
  }
  header.top a.home:hover{ background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.45); color:#fff; }

  main{ max-width:820px; margin:0 auto; padding:22px 20px 80px; }
  #banners{ margin-bottom:16px; }
  .banner{ padding:12px 16px; border-radius:8px; font-size:13.5px; margin-bottom:8px; }
  .banner.error{ background:var(--red-bg); color:var(--red-ink); border:1px solid var(--red-border); }
  .banner.ok{ background:var(--green-bg); color:var(--green-ink); border:1px solid var(--green-border); }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px 22px; margin-bottom:18px; }
  .card h2{ margin:0 0 14px; font:400 18px/1.2 Georgia,"Times New Roman",serif; color:var(--navy); }
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  label{ display:block; font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em; }
  input{ width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; background:#fff; color:var(--ink); }
  input:read-only{ background:var(--bg); color:var(--muted); }
  input:focus, textarea:focus{ outline:2px solid var(--navy); outline-offset:1px; }
  .hint{ font-size:11px; color:var(--faint); margin-top:3px; font-weight:400; text-transform:none; letter-spacing:0; }
  textarea{ width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13.5px; font-family:inherit; resize:vertical; min-height:90px; }

  .actions{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  button{ cursor:pointer; border:none; border-radius:6px; padding:10px 18px; font-size:14px; font-weight:600; }
  button.primary{ background:var(--navy); color:#fff; }
  button.primary:disabled{ background:var(--faint); cursor:not-allowed; }
  #status{ font-size:13px; margin-top:10px; }
  #status.err{ color:var(--red-ink); } #status.ok{ color:var(--green-ink); }

  table.history{ width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  table.history th, table.history td{ text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); }
  table.history th{ font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  table.history td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .badge-status{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px; text-transform:uppercase; }
  .empty{ color:var(--muted); font-size:13px; padding:10px 2px; }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Case Aging Exception</h1>
    <div class="who" id="whoLine">Loading…</div>
  </div>
  <a class="home" href="/">All Views</a>
</header>

<main>
  <div id="banners"></div>
  <div id="content">Loading…</div>
</main>

<script>
(function () {
  'use strict';

  var API = '/api';
  var SESSION_KEY = 'olh.session.v1';

  /* ---- Auth (mirrors bonus.html / game.html's shared OLHAuth session contract) --- */
  function getSession() {
    try { var v = localStorage.getItem(SESSION_KEY); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function authHeaders(extra) {
    var h = Object.assign({ Accept: 'application/json' }, extra || {});
    var s = getSession();
    var tok = s && s.token;
    if (tok) {
      h.Authorization = 'Bearer ' + tok;
      h['X-OLH-Token'] = 'Bearer ' + tok;
    }
    return h;
  }
  function authedFetchHeaders(extra) {
    if (!getSession() || !getSession().token) {
      throw new Error('You are not signed in. Sign in at the OLH Tracker home page, then reload this page.');
    }
    return authHeaders(extra);
  }
  function apiGet(path) {
    return fetch(API + path, { headers: authedFetchHeaders() }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (body) {
        if (res.status === 401) { var e = new Error((body && body.error) || 'Your session has expired.'); e.status = 401; throw e; }
        if (!res.ok || !body) throw new Error((body && body.error) || (path + ' failed (' + res.status + ')'));
        return body;
      });
    });
  }
  function apiPost(path, payload) {
    return fetch(API + path, {
      method: 'POST',
      headers: authedFetchHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (body) {
        if (!res.ok) throw new Error((body && body.error) || (path + ' failed (' + res.status + ')'));
        return body;
      });
    });
  }

  var state = {
    user: null, can: [], loading: true, error: '', requests: [], submitting: false, statusMsg: '', statusOk: false
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function todayISO() {
    var d = new Date();
    var off = d.getTimezoneOffset();
    return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
  }

  function statusColors(status) {
    if (status === 'Approved') return { bg: 'var(--green-bg)', ink: 'var(--green-ink)' };
    if (status === 'Denied') return { bg: 'var(--red-bg)', ink: 'var(--red-ink)' };
    return { bg: 'var(--amber-bg)', ink: 'var(--amber-ink)' }; // Pending
  }

  function historyRows() {
    if (!state.requests.length) return '<div class="empty">No requests submitted yet.</div>';
    var rows = state.requests.map(function (r) {
      var c = statusColors(r.status);
      return '<tr><td>' + esc(r.caseNumber) + '</td><td>' + esc(r.submissionDate) + '</td>' +
        '<td class="num">' + esc(String(r.currentAgeDays)) + '</td>' +
        '<td>' + esc(r.expectedCompletionDate) + '</td>' +
        '<td><span class="badge-status" style="color:' + c.ink + ';background:' + c.bg + '">' + esc(r.status) + '</span></td></tr>';
    }).join('');
    return '<table class="history"><thead><tr><th>Case #</th><th>Submitted</th><th>Age (days)</th><th>New Expected</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function formHtml() {
    return '' +
      '<div class="card no-print">' +
        '<h2>Requested By</h2>' +
        '<div class="grid">' +
          '<div><label>Name</label><input value="' + esc(state.user.name) + '" readonly></div>' +
          '<div><label>Division</label><input value="' + esc(state.user.division || '') + '" readonly></div>' +
        '</div>' +
      '</div>' +
      '<div class="card no-print">' +
        '<h2>Exception Details</h2>' +
        '<div class="grid">' +
          '<div><label for="caseNumber">Case Number</label><input id="caseNumber" type="text" placeholder="e.g. 00123456"></div>' +
          '<div><label for="submissionDate">Submission Date</label><input id="submissionDate" type="date" value="' + todayISO() + '"></div>' +
          '<div><label for="currentAgeDays">Current Age (Days)</label><input id="currentAgeDays" type="number" min="0" step="1" placeholder="e.g. 24"></div>' +
          '<div><label for="expectedCompletionDate">Expected Completion Date</label><input id="expectedCompletionDate" type="date"></div>' +
        '</div>' +
        '<div style="margin-top:14px">' +
          '<label for="agingReasonNotes">Aging Reason Notes</label>' +
          '<textarea id="agingReasonNotes" placeholder="Why is this case aged, and why is the new completion date realistic?"></textarea>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="primary" id="submitBtn"' + (state.submitting ? ' disabled' : '') + '>Submit Request</button>' +
        '</div>' +
        (state.statusMsg ? '<div id="status" class="' + (state.statusOk ? 'ok' : 'err') + '">' + esc(state.statusMsg) + '</div>' : '') +
      '</div>' +
      '<div class="card">' +
        '<h2>Your Requests</h2>' +
        '<div id="historyBox">' + historyRows() + '</div>' +
      '</div>';
  }

  function readForm() {
    var val = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
    return {
      caseNumber: val('caseNumber').trim(),
      submissionDate: val('submissionDate'),
      currentAgeDays: parseInt(val('currentAgeDays'), 10),
      expectedCompletionDate: val('expectedCompletionDate'),
      agingReasonNotes: val('agingReasonNotes').trim()
    };
  }

  function wireForm() {
    var submitBtn = document.getElementById('submitBtn');
    if (submitBtn) submitBtn.addEventListener('click', submitRequest);
  }

  function submitRequest() {
    var f = readForm();
    if (!f.caseNumber) { state.statusOk = false; state.statusMsg = 'Enter a case number.'; refreshFormOnly(); return; }
    if (!f.submissionDate) { state.statusOk = false; state.statusMsg = 'Select a submission date.'; refreshFormOnly(); return; }
    if (!Number.isFinite(f.currentAgeDays) || f.currentAgeDays < 0) {
      state.statusOk = false; state.statusMsg = 'Enter the current case age in days.'; refreshFormOnly(); return;
    }
    if (!f.expectedCompletionDate) { state.statusOk = false; state.statusMsg = 'Select an expected completion date.'; refreshFormOnly(); return; }
    if (!f.agingReasonNotes) { state.statusOk = false; state.statusMsg = 'Explain the aging reason before submitting.'; refreshFormOnly(); return; }

    state.submitting = true; state.statusMsg = ''; refreshFormOnly();
    apiPost('/case-aging', {
      submissionId: 'cae' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      caseNumber: f.caseNumber,
      submissionDate: f.submissionDate,
      currentAgeDays: f.currentAgeDays,
      expectedCompletionDate: f.expectedCompletionDate,
      agingReasonNotes: f.agingReasonNotes
    }).then(function (data) {
      state.submitting = false;
      state.statusOk = true;
      state.statusMsg = data.duplicate
        ? 'This request was already submitted.'
        : 'Submitted for case ' + f.caseNumber + ' — pending manager approval.';
      return loadHistory();
    }).then(function () {
      render();
    }).catch(function (err) {
      state.submitting = false;
      state.statusOk = false;
      state.statusMsg = 'Submit failed: ' + (err && err.message ? err.message : String(err));
      refreshFormOnly();
    });
  }

  function refreshFormOnly() {
    var content = document.getElementById('content');
    if (content) content.innerHTML = formHtml();
    wireForm();
  }

  function loadSession() {
    return apiGet('/session').then(function (data) {
      state.user = data.user || null;
      state.can = data.can || [];
    });
  }
  function loadHistory() {
    return apiGet('/case-aging').then(function (data) {
      state.requests = Array.isArray(data.requests) ? data.requests : [];
    });
  }

  function render() {
    document.getElementById('whoLine').textContent = state.user
      ? (state.user.name + (state.user.division ? ' · ' + state.user.division : ''))
      : 'Not signed in';

    var content = document.getElementById('content');
    if (state.loading) { content.innerHTML = ''; return; }
    if (state.error) {
      content.innerHTML = '<div class="empty">' + esc(state.error) + '</div>';
      return;
    }
    // Mirrors the wording DENY['page.*'] generates server-side (olh-auth.js)
    // so a refusal reads the same whether it came from this page or the API
    // behind it. Admins always have it via DEFAULT_ROLES' ALL_PAGES concat.
    if (state.can.indexOf('page.caseaging') < 0) {
      content.innerHTML = '<div class="empty">Your role does not have access to the Case Aging Exception Request page.</div>';
      return;
    }

    content.innerHTML = formHtml();
    wireForm();
  }

  /* ---- Boot ------------------------------------------------------------ */
  var session = getSession();
  if (!session || !session.token) {
    document.getElementById('content').innerHTML =
      '<div class="empty">You are not signed in. <a href="/">Sign in at the OLH Tracker home page</a>, then reload this page.</div>';
    document.getElementById('whoLine').textContent = 'Not signed in';
  } else {
    loadSession()
      .then(loadHistory)
      .then(function () {
        state.loading = false;
        render();
      })
      .catch(function (err) {
        state.loading = false;
        if (err && err.status === 401) {
          state.error = 'Your session has expired. Sign in again at the OLH Tracker home page, then reload this page.';
        } else {
          state.error = 'Could not load this page: ' + (err && err.message ? err.message : String(err));
        }
        render();
      });
  }
})();
</script>
</body>
</html>
