document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

s New Roman',serif;font-weight:300;font-size:22px;letter-spacing:-.03em;color:#fff\">Workload Visualizer<\u002Fh1>\n    <span style=\"font-size:11.5px;font-weight:500;color:#BFB8AB;white-space:nowrap\">Total potential workload · blanks projected on best-practice cadence<\u002Fspan>\n    <a href=\"index.html\" style=\"margin-left:auto;font-size:12.5px;font-weight:500;color:#BFB8AB\">← All Views<\u002Fa>\n  <\u002Fheader>\n\n  <main style=\"flex:1 1 auto;display:grid;grid-template-columns:minmax(620px,1.55fr) minmax(300px,.85fr);gap:18px;max-width:1480px;width:100%;margin:0 auto;padding:20px 30px 40px;align-items:start\">\n\n    <section style=\"display:flex;flex-direction:column;gap:14px\">\n\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border:1px solid #E4DED2;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(27,42,88,.05)\">\n        <label style=\"display:flex;flex-direction:column;gap:3px\">\n          <span style=\"font-size:11px;font-weight:600;color:#6F6963\">Community<\u002Fspan>\n          <sc-raw-select value=\"{{ fComm }}\" sc-camel-on-change=\"{{ onComm }}\" style=\"height:30px;padding:0 8px;border:1px solid #BFB8AB;border-radius:4px;background:#fff;font-size:12.5px;cursor:pointer\">\n            <sc-for list=\"{{ commOpts }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px\">\n          <span style=\"font-size:11px;font-weight:600;color:#6F6963\">QA Manager<\u002Fspan>\n          <sc-raw-select value=\"{{ fMgr }}\" sc-camel-on-change=\"{{ onMgr }}\" style=\"height:30px;padding:0 8px;border:1px solid #BFB8AB;border-radius:4px;background:#fff;font-size:12.5px;cursor:pointer\">\n            <sc-for list=\"{{ mgrOpts }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <div style=\"display:flex;align-items:center;gap:6px;padding-top:14px\">\n          <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"height:26px;padding:0 11px;border:1px solid {{ m.border }};border-radius:999px;background:{{ m.bg }};color:{{ m.color }};font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background 160ms cubic-bezier(.2,.6,.2,1)\">{{ m.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:6px;padding-top:14px\">\n          <sc-for list=\"{{ walkToggles }}\" as=\"w\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ w.onClick }}\" title=\"{{ w.title }}\" style=\"height:26px;padding:0 11px;border:1px solid {{ w.border }};border-radius:999px;background:{{ w.bg }};color:{{ w.color }};font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background 160ms cubic-bezier(.2,.6,.2,1)\">{{ w.code }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"margin-left:auto;display:flex;align-items:center;gap:6px;padding-top:14px\">\n          <button sc-camel-on-click=\"{{ onPrev }}\" aria-label=\"Previous month\" style=\"width:28px;height:28px;border:1px solid #E4DED2;border-radius:4px;background:#fff;color:#6F6963;font-size:14px;line-height:1;cursor:pointer\" style-hover=\"background:#F1EBE1;color:#303030\">‹<\u002Fbutton>\n          <span style=\"min-width:132px;text-align:center;font-size:14px;font-weight:600;letter-spacing:.012em\">{{ monthLabel }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ onNext }}\" aria-label=\"Next month\" style=\"width:28px;height:28px;border:1px solid #E4DED2;border-radius:4px;background:#fff;color:#6F6963;font-size:14px;line-height:1;cursor:pointer\" style-hover=\"background:#F1EBE1;color:#303030\">›<\u002Fbutton>\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:10px\">\n        <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;flex-direction:column;gap:2px;padding:12px 13px 13px;border:1px solid #E4DED2;border-left:3px solid {{ k.accent }};border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(27,42,88,.05)\">\n            <span style=\"font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#908A82;text-wrap:pretty\">{{ k.label }}<\u002Fspan>\n            <span style=\"font-family:'Reckless','Times New Roman',serif;font-weight:300;font-size:32px;line-height:1.05;letter-spacing:-.035em;color:{{ k.color }};font-variant-numeric:tabular-nums\">{{ k.value }}<\u002Fspan>\n            <span style=\"font-size:11.5px;color:#6F6963;text-wrap:pretty\">{{ k.sub }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #E4DED2;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(27,42,88,.05);overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:repeat(7,1fr);padding:10px 12px 0\">\n          <sc-for list=\"{{ dowNames }}\" as=\"d\" hint-placeholder-count=\"7\"><span style=\"padding-bottom:5px;text-align:center;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#908A82\">{{ d }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 12px 14px\">\n          <sc-for list=\"{{ cells }}\" as=\"c\" hint-placeholder-count=\"35\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" disabled=\"{{ c.disabled }}\" title=\"{{ c.title }}\" style=\"position:relative;display:flex;flex-direction:column;gap:4px;height:96px;padding:7px 8px 8px;border:1px solid {{ c.border }};border-radius:6px;background:{{ c.bg }};cursor:{{ c.cursor }};text-align:left;transition:background 140ms cubic-bezier(.2,.6,.2,1)\">\n              <span style=\"display:flex;align-items:baseline;width:100%\">\n                <span style=\"font-size:10.5px;font-weight:600;color:{{ c.dayColor }};font-variant-numeric:tabular-nums\">{{ c.day }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:{{ c.tagColor }}\">{{ c.tag }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:flex;align-items:baseline;gap:5px\">\n                <span style=\"font-family:'Reckless','Times New Roman',serif;font-weight:300;font-size:26px;line-height:1;letter-spacing:-.03em;color:{{ c.countColor }};font-variant-numeric:tabular-nums\">{{ c.count }}<\u002Fspan>\n                <span style=\"font-size:10px;font-weight:500;color:#908A82\">{{ c.unit }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:flex;gap:2px;width:100%;margin-top:auto\">\n                <sc-for list=\"{{ c.segs }}\" as=\"g\" hint-placeholder-count=\"0\">\n                  <span title=\"{{ g.title }}\" style=\"flex:{{ g.flex }} 1 0;height:5px;border-radius:1px;background:{{ g.color }}\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fspan>\n              <span style=\"width:100%;height:4px;border-radius:2px;background:#F1EBE1\">\n                <span style=\"display:block;width:{{ c.utilPct }}%;height:4px;border-radius:2px;background:{{ c.utilColor }}\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid #F1EBE1;background:#FCFAF6\">\n          <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"4\">\n            <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:#6F6963\"><i style=\"width:12px;height:6px;border-radius:1px;background:{{ l.color }}\"><\u002Fi>{{ l.label }}<\u002Fspan>\n          <\u002Fsc-for>\n          <span style=\"margin-left:auto;font-size:11px;color:#908A82;text-wrap:pretty\">{{ mixNote }} · {{ capNote }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:14px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:11px;padding:16px 18px 18px;border:1px solid #E4DED2;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(27,42,88,.05)\">\n        <div style=\"display:flex;align-items:baseline;gap:9px;flex-wrap:wrap\">\n          <h2 style=\"margin:0;font-family:'Reckless','Times New Roman',serif;font-weight:300;font-size:24px;line-height:1.1;letter-spacing:-.03em;color:#1B2A58\">{{ day.title }}<\u002Fh2>\n          <span style=\"font-size:12px;font-weight:600;color:{{ day.toneColor }}\">{{ day.tone }}<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:12.5px;color:#6F6963;text-wrap:pretty\">{{ day.sub }}<\u002Fspan>\n\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid #E4DED2;border-radius:8px;background:#E4DED2;overflow:hidden\">\n          <sc-for list=\"{{ day.byType }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ t.onClick }}\" title=\"{{ t.title }}\" style=\"display:flex;flex-direction:column;gap:1px;padding:9px 10px 10px;border:0;background:{{ t.bg }};cursor:pointer;text-align:left;transition:background 140ms cubic-bezier(.2,.6,.2,1)\" style-hover=\"background:#F6F2EA\">\n              <span style=\"display:inline-flex;align-items:center;justify-content:center;width:fit-content;height:19px;padding:0 8px;border-radius:999px;background:{{ t.pillBg }};color:{{ t.pillColor }};font-size:10px;font-weight:700;letter-spacing:.06em\">{{ t.code }}<\u002Fspan>\n              <span style=\"font-size:19px;font-weight:600;color:{{ t.color }};font-variant-numeric:tabular-nums\">{{ t.n }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <span style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:#908A82\">Load by QA Manager · as attributed<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:5px;max-height:340px;overflow:auto\">\n          <sc-for list=\"{{ day.people }}\" as=\"p\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ p.onClick }}\" title=\"{{ p.title }}\" style=\"display:grid;grid-template-columns:1fr 88px 46px;align-items:center;gap:9px;padding:2px 4px;border:0;border-radius:4px;background:{{ p.bg }};cursor:pointer;text-align:left;transition:background 140ms cubic-bezier(.2,.6,.2,1)\" style-hover=\"background:#F6F2EA\">\n              <span style=\"font-size:12.5px;font-weight:{{ p.weight }};color:{{ p.nameColor }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fspan>\n              <span style=\"height:7px;border-radius:2px;background:#F1EBE1\"><span style=\"display:block;width:{{ p.pct }}%;height:7px;border-radius:2px;background:{{ p.color }}\"><\u002Fspan><\u002Fspan>\n              <span style=\"text-align:right;font-size:11.5px;font-weight:500;color:#6F6963;font-variant-numeric:tabular-nums\">{{ p.hours }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ day.noPeople }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:12.5px;color:#908A82\">No walks assigned this day.<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:9px;padding:16px 18px 18px;border:1px solid #E4DED2;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(27,42,88,.05)\">\n        <span style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:#908A82\">Heaviest Days Ahead<\u002Fspan>\n        <sc-for list=\"{{ peaks }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ p.onClick }}\" style=\"display:grid;grid-template-columns:1fr 62px 44px;align-items:center;gap:9px;padding:5px 0;border:0;background:transparent;cursor:pointer;text-align:left\">\n            <span style=\"font-size:12.5px;font-weight:500;color:{{ p.nameColor }};white-space:nowrap\">{{ p.label }}<\u002Fspan>\n            <span style=\"height:7px;border-radius:2px;background:#F1EBE1\"><span style=\"display:block;width:{{ p.pct }}%;height:7px;border-radius:2px;background:{{ p.color }}\"><\u002Fspan><\u002Fspan>\n            <span style=\"text-align:right;font-size:11.5px;font-weight:500;color:#6F6963;font-variant-numeric:tabular-nums\">{{ p.n }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <span style=\"font-size:11px;color:#908A82;text-wrap:pretty\">{{ peakNote }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:7px;padding:13px 16px 14px;border:1px solid #E4DED2;border-radius:12px;background:#FCFAF6\">\n        <button sc-camel-on-click=\"{{ onToggleCalc }}\" style=\"display:flex;align-items:center;gap:8px;width:100%;padding:0;border:0;background:transparent;cursor:pointer;text-align:left\">\n          <span style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:#908A82\">How This Is Calculated<\u002Fspan>\n          <span style=\"margin-left:auto;font-size:11.5px;font-weight:600;color:#005DAA;white-space:nowrap\">{{ calcLabel }}<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ showCalc }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-for list=\"{{ notes }}\" as=\"n\" hint-placeholder-count=\"5\">\n            <span style=\"display:flex;gap:8px;font-size:12px;color:#303030;text-wrap:pretty\"><i style=\"flex:0 0 auto;width:4px;height:4px;margin-top:7px;border-radius:50%;background:#BFB8AB\"><\u002Fi>{{ n }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <div style=\"max-width:1480px;width:100%;margin:0 auto;padding:0 30px 40px\">\n    <div style=\"display:flex;flex-direction:column;border:1px solid #E4DED2;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(27,42,88,.05);overflow:hidden\">\n      <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:13px 16px 12px;border-bottom:1px solid #F1EBE1\">\n        <h2 style=\"margin:0;font-family:'Reckless','Times New Roman',serif;font-weight:300;font-size:22px;line-height:1.1;letter-spacing:-.03em;color:#1B2A58\">Walk Detail<\u002Fh2>\n        <span style=\"font-size:12px;font-weight:500;color:#6F6963;text-wrap:pretty\">{{ table.caption }}<\u002Fspan>\n        <sc-if value=\"{{ table.picked }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ table.onClearPick }}\" style=\"height:24px;padding:0 11px;border:1px solid #005DAA;border-radius:999px;background:#EAF2F9;color:#005DAA;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#DCE9F4\">Clear drill-down<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"max-height:420px;overflow:auto\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:12.5px\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-raw-th style=\"position:sticky;top:0;z-index:1;padding:9px 11px;border-bottom:1px solid #D8CFBE;background:#F6F2EA;color:#6F6963;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;text-align:left;white-space:nowrap\">Walk<\u002Fsc-raw-th>\n              <sc-raw-th style=\"position:sticky;top:0;z-index:1;padding:9px 11px;border-bottom:1px solid #D8CFBE;background:#F6F2EA;color:#6F6963;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;text-align:left;white-space:nowrap\">Job #<\u002Fsc-raw-th>\n              <sc-raw-th style=\"position:sticky;top:0;z-index:1;padding:9px 11px;border-bottom:1px solid #D8CFBE;background:#F6F2EA;color:#6F6963;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;text-align:left;white-space:nowrap\">Community<\u002Fsc-raw-th>\n              <sc-raw-th style=\"position:sticky;top:0;z-index:1;padding:9px 11px;border-bottom:1px solid #D8CFBE;background:#F6F2EA;color:#6F6963;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;text-align:left;white-space:nowrap\">Address<\u002Fsc-raw-th>\n              <sc-raw-th style=\"position:sticky;top:0;z-index:1;padding:9px 11px;border-bottom:1px solid #D8CFBE;background:#F6F2EA;color:#6F6963;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;text-align:left;white-space:nowrap\">QA Manager<\u002Fsc-raw-th>\n              <sc-raw-th style=\"position:sticky;top:0;z-index:1;padding:9px 11px;border-bottom:1px solid #D8CFBE;background:#F6F2EA;color:#6F6963;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;text-align:left;white-space:nowrap\">Hours<\u002Fsc-raw-th>\n              <sc-raw-th style=\"position:sticky;top:0;z-index:1;padding:9px 11px;border-bottom:1px solid #D8CFBE;background:#F6F2EA;color:#6F6963;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;text-align:left;white-space:nowrap\">Source<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ table.rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <sc-raw-tr style=\"background:{{ r.bg }}\">\n                <sc-raw-td style=\"padding:7px 11px;border-bottom:1px solid #F1EBE1\">\n                  <span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:20px;padding:0 9px;border-radius:999px;background:{{ r.pillBg }};color:{{ r.pillColor }};font-size:10px;font-weight:700;letter-spacing:.06em\">{{ r.code }}<\u002Fspan>\n                <\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:7px 11px;border-bottom:1px solid #F1EBE1;font-variant-numeric:tabular-nums;white-space:nowrap\">{{ r.job }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:7px 11px;border-bottom:1px solid #F1EBE1;font-weight:500\">{{ r.community }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:7px 11px;border-bottom:1px solid #F1EBE1;color:#6F6963\">{{ r.address }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:7px 11px;border-bottom:1px solid #F1EBE1;color:{{ r.mgrColor }};white-space:nowrap\">{{ r.mgr }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:7px 11px;border-bottom:1px solid #F1EBE1;font-variant-numeric:tabular-nums;white-space:nowrap\">{{ r.hours }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:7px 11px;border-bottom:1px solid #F1EBE1;color:{{ r.srcColor }};white-space:nowrap\">{{ r.src }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <sc-if value=\"{{ table.empty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:34px 18px;text-align:center;color:#908A82;font-size:13px;text-wrap:pretty\">No walks match the current selection.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:1000}}\">\nconst MON = [\"January\",\"February\",\"March\",\"April\",\"May\",\"June\",\"July\",\"August\",\"September\",\"October\",\"November\",\"December\"];\nconst HOURS = { QAI: 2, QAA: 1, CEL: 2, ACC: 1 };\nconst CODES = [\"QAI\", \"QAA\", \"CEL\", \"ACC\"];\nconst COLOR = { QAI: \"#005DAA\", QAA: \"#006368\", CEL: \"#83553C\", ACC: \"#0D773C\" };\nconst TINT = { QAI: \"#A8C8E2\", QAA: \"#9CC3C5\", CEL: \"#C9AC9B\", ACC: \"#9EC7AC\" };\nconst DAILY_CAP = 8;\nconst TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();\n\nconst key = d => d.getFullYear() + \"-\" + String(d.getMonth() + 1).padStart(2, \"0\") + \"-\" + String(d.getDate()).padStart(2, \"0\");\nconst parseKey = s => { const p = String(s).slice(0, 10).split(\"-\"); return new Date(+p[0], +p[1] - 1, +p[2]); };\nconst addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };\nconst isWeekend = d => d.getDay() === 0 || d.getDay() === 6;\n/* Weekend rule, per the requirements: a Saturday result pulls IN to Friday, a\n   Sunday result pushes OUT to Monday. No projected date ever lands on a\n   weekend. */\nconst adjustWeekend = d => d.getDay() === 6 ? addDays(d, -1) : d.getDay() === 0 ? addDays(d, 1) : new Date(d);\n/* `gap` days after `prior`, weekend-adjusted. If the adjustment would land on\n   or before the prior stage, step forward a day at a time (skipping weekends)\n   until the day is after it. */\nconst nextAfter = (prior, gap) => {\n  let d = adjustWeekend(addDays(prior, gap));\n  while (d.getTime() <= prior.getTime() || isWeekend(d)) d = addDays(d, 1);\n  return d;\n};\n// Projected work can't be scheduled into the past — roll it to the next weekday.\nconst nextWeekday = d => { let x = new Date(d); while (isWeekend(x)) x = addDays(x, 1); return x; };\nconst notPast = d => nextWeekday(d.getTime() < TODAY.getTime() ? TODAY : d);\nconst fmtLong = d => d.toLocaleDateString(\"en-US\", { weekday: \"long\", month: \"long\", day: \"numeric\", year: \"numeric\" });\nconst fmtShort = d => d.toLocaleDateString(\"en-US\", { weekday: \"short\", month: \"short\", day: \"numeric\" });\n\nclass Component extends DCLogic {\n  state = {\n    ready: 0, y: 2026, m: 7, day: null,\n    comm: \"\", mgr: \"\", off: {}, mode: \"all\", showCalc: false, pickCode: \"\", pickMgr: \"\"\n  };\n\n  componentDidMount() {\n    const tick = () => { this._walks = null; this._byLen = null; this._unattributed = null; this.setState(s => ({ ready: s.ready + 1 })); };\n    this._t = tick;\n    window.addEventListener(\"olh-data\", tick);\n    window.addEventListener(\"walk-ref\", tick);\n    if (window.OLH_DATA && window.WALK_ROSTER) tick();\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"olh-data\", this._t);\n    window.removeEventListener(\"walk-ref\", this._t);\n  }\n\n  qams() { return (window.WALK_ROSTER || []).filter(p => p.role === \"QAM\"); }\n  person(id) { return (window.WALK_ROSTER || []).find(p => p.id === id) || null; }\n\n  core(productLine) {\n    if (!productLine) return null;\n    const map = window.WALK_PRODUCT_MAP || {};\n    if (map[productLine]) return map[productLine] === \"Removed / Excluded\" ? null : map[productLine];\n    if (!this._byLen) this._byLen = (window.WALK_COMMUNITIES || []).slice().sort((a, b) => b.length - a.length);\n    const low = productLine.toLowerCase();\n    for (const c of this._byLen) if (low.indexOf(c.toLowerCase()) === 0) return c;\n    if (/^ranches/i.test(productLine)) return \"Ranches\";\n    if (/^sanctuary at wellness|^wellness way/i.test(productLine)) return \"Wellness Ridge\";\n    return null;\n  }\n\n  homeQams(community) {\n    return this.qams().filter(m => m.home === community).sort((a, b) => a.name.localeCompare(b.name));\n  }\n\n  /* Every walk, attributed to a QA Manager. Where a date is on record the walk\n     is SCHEDULED; where it is blank the walk is PROJECTED forward on the\n     best-practice cadence (QAA = QAI+7, CEL = QAA+1, ACC = CEL+5, weekdays\n     only) so the calendar shows total potential workload, not just what has\n     been booked. Attribution follows the scheduler: the tracker's manager\n     fields are CONSTRUCTION managers, so load lands on each community's home\n     QAM (round-robin for two). */\n  walks() {\n    if (this._walks) return this._walks;\n    const jobs = (window.OLH_DATA && window.OLH_DATA.jobs) || [];\n    if (!jobs.length || !this.qams().length) return [];\n    const out = [];\n    let unattributed = 0;\n    jobs.forEach((j, idx) => {\n      const f = j.fields;\n      const community = this.core(f[\"Community\"] || \"\");\n      const hasQai = !!f[\"QAI Date\"];\n      let qai = hasQai ? parseKey(f[\"QAI Date\"]) : null;\n      if (!qai && f[\"Projected Completion Date\"]) qai = addDays(parseKey(f[\"Projected Completion Date\"]), -7);\n      if (!qai) return;\n      const pool = community ? this.homeQams(community) : [];\n      const who = pool.length ? pool[idx % pool.length].id : null;\n      if (!who) unattributed++;\n      const push = (code, d, projected) => {\n        if (d) out.push({ code, date: key(d), personId: who, community, job: f[\"Job #\"], address: f[\"Street Address\"] || \"\", projected: !!projected });\n      };\n      push(\"QAI\", hasQai ? qai : adjustWeekend(qai), !hasQai);\n      const hasQaa = !!f[\"QAA Date\"];\n      const qaa = hasQaa ? parseKey(f[\"QAA Date\"]) : nextAfter(qai, 7);\n      push(\"QAA\", qaa, !hasQaa);\n      const hasCel = !!f[\"CEL Date\"];\n      const cel = hasCel ? parseKey(f[\"CEL Date\"]) : nextAfter(qaa, 1);\n      push(\"CEL\", cel, !hasCel);\n      const hasAcc = !!f[\"ACC Date\"];\n      const acc = hasAcc ? parseKey(f[\"ACC Date\"]) : nextAfter(cel, 5);\n      push(\"ACC\", acc, !hasAcc);\n    });\n    this._unattributed = unattributed;\n    this._walks = this.drain(out);\n    return this._walks;\n  }\n\n  /* Projected walks whose cadence already elapsed are a BACKLOG. Anchoring them\n     all to the next weekday would march the whole chain in lockstep and pile\n     hundreds of walks onto three dates — an artifact, not a forecast. Instead\n     drain the backlog across successive weekdays, filling each day only to the\n     division's daily coverage, so it reads as the recovery run it actually is. */\n  drain(all) {\n    const poolHours = this.qams().length * DAILY_CAP;\n    const late = [], ok = [];\n    all.forEach(w => {\n      if (w.projected && parseKey(w.date).getTime() < TODAY.getTime()) late.push(w); else ok.push(w);\n    });\n    if (!late.length || !poolHours) { this._backlog = { n: 0, days: 0, hours: 0 }; return all; }\n    const order = { QAI: 0, QAA: 1, CEL: 2, ACC: 3 };\n    late.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : order[a.code] - order[b.code]));\n    // committed load already on each forward day, so the drain fills around it\n    const load = {};\n    ok.forEach(w => { if (parseKey(w.date).getTime() >= TODAY.getTime()) load[w.date] = (load[w.date] || 0) + HOURS[w.code]; });\n    let cursor = nextWeekday(TODAY), hours = 0, days = 1;\n    late.forEach(w => {\n      let k = key(cursor);\n      while ((load[k] || 0) + HOURS[w.code] > poolHours) {\n        cursor = nextWeekday(addDays(cursor, 1));\n        k = key(cursor);\n        days++;\n      }\n      load[k] = (load[k] || 0) + HOURS[w.code];\n      hours += HOURS[w.code];\n      w.date = k;\n      w.backlog = true;\n    });\n    this._backlog = { n: late.length, days, hours, through: key(cursor) };\n    return ok.concat(late);\n  }\n\n  filtered() {\n    const s = this.state;\n    return this.walks().filter(w => {\n      if (s.comm && w.community !== s.comm) return false;\n      if (s.mgr && w.personId !== s.mgr) return false;\n      if (s.off[w.code]) return false;\n      if (s.mode === \"scheduled\" && w.projected) return false;\n      if (s.mode === \"projected\" && !w.projected) return false;\n      return true;\n    });\n  }\n\n  // which managers the current filter covers\n  pool() {\n    const s = this.state;\n    if (s.mgr) { const p = this.person(s.mgr); return p ? [p] : []; }\n    if (s.comm) { const h = this.homeQams(s.comm); return h.length ? h : this.qams(); }\n    return this.qams();\n  }\n  poolSize() { return this.pool().length || 1; }\n  capacity() { return this.poolSize() * DAILY_CAP; }\n\n  renderVals() {\n    const s = this.state, rows = this.filtered();\n    const byDay = {};\n    rows.forEach(w => {\n      const d = byDay[w.date] || (byDay[w.date] = { n: 0, hours: 0, codes: {}, seg: {}, people: {}, proj: 0 });\n      d.n++; d.hours += HOURS[w.code];\n      d.codes[w.code] = (d.codes[w.code] || 0) + 1;\n      const sk = w.code + (w.projected ? \"-p\" : \"\");\n      d.seg[sk] = (d.seg[sk] || 0) + 1;\n      if (w.projected) d.proj++;\n      if (w.personId) d.people[w.personId] = (d.people[w.personId] || 0) + HOURS[w.code];\n    });\n    const totals = { sched: 0, proj: 0 };\n    this.walks().forEach(w => { totals[w.projected ? \"proj\" : \"sched\"]++; });\n    const bl = this._backlog || { n: 0, days: 0, hours: 0 };\n\n    const cap = this.capacity();\n    const first = new Date(s.y, s.m, 1);\n    const lead = (first.getDay() + 6) % 7;\n    const dim = new Date(s.y, s.m + 1, 0).getDate();\n    const pad = { day: \"\", count: \"\", unit: \"\", tag: \"\", segs: [], disabled: true, cursor: \"default\", bg: \"#FCFAF6\", border: \"#F6F2EA\", dayColor: \"#D8CFBE\", countColor: \"transparent\", tagColor: \"transparent\", utilPct: 0, utilColor: \"transparent\", title: \"\", onClick: () => {} };\n\n    const cells = [];\n    for (let i = 0; i < lead; i++) cells.push(pad);\n    let mTotal = 0, mHours = 0, busiest = null, overDays = 0, workDays = 0;\n    let wdTotal = 0, wdHours = 0, weTotal = 0, mProj = 0, weProj = 0;\n\n    for (let dn = 1; dn <= dim; dn++) {\n      const d = new Date(s.y, s.m, dn);\n      const k = key(d), rec = byDay[k];\n      const n = rec ? rec.n : 0, hrs = rec ? rec.hours : 0;\n      const weekend = isWeekend(d);\n      mTotal += n; mHours += hrs;\n      if (rec) mProj += rec.proj;\n      if (weekend) { weTotal += n; if (rec) weProj += rec.proj; }\n      else { wdTotal += n; wdHours += hrs; workDays++; }\n      /* A day is over capacity when the WORK exceeds the COVERAGE available\n         that day. Individual overload (one manager at 14h while others sit at\n         1h) is an attribution artifact, not a real shortfall — that work can be\n         reassigned, so it reads as imbalance, not over capacity. */\n      const util = cap ? Math.round(hrs / cap * 100) : 0;\n      const over = hrs > cap;\n      const loads = rec ? Object.keys(rec.people).map(id => rec.people[id]) : [];\n      const peak = loads.length ? Math.max.apply(null, loads) : 0;\n      const imbalanced = loads.filter(h => h > DAILY_CAP).length;\n      if (over) overDays++;\n      if (n && (!busiest || n > busiest.n)) busiest = { d, n };\n      const sel = s.day === k;\n      const isToday = k === key(TODAY);\n      const heat = over ? \"#AA1F23\" : util >= 75 ? \"#83553C\" : util > 0 ? \"#0D773C\" : \"#D8CFBE\";\n\n      cells.push({\n        day: String(dn),\n        count: n ? String(n) : weekend ? \"\" : \"0\",\n        unit: n ? (n === 1 ? \"walk\" : \"walks\") : \"\",\n        tag: weekend ? \"WKND\" : over ? \"OVER\" : util >= 75 ? \"TIGHT\" : imbalanced ? \"SKEWED\" : \"\",\n        tagColor: over ? \"#AA1F23\" : util >= 75 ? \"#83553C\" : \"#BFB8AB\",\n        segs: !rec ? [] : CODES.reduce((acc, c) => {\n          if (rec.seg[c]) acc.push({ flex: rec.seg[c], color: COLOR[c], title: c + \" scheduled: \" + rec.seg[c] });\n          if (rec.seg[c + \"-p\"]) acc.push({ flex: rec.seg[c + \"-p\"], color: TINT[c], title: c + \" projected: \" + rec.seg[c + \"-p\"] });\n          return acc;\n        }, []),\n        disabled: !n,\n        cursor: n ? \"pointer\" : \"default\",\n        bg: sel ? \"#EAF2F9\" : weekend ? \"#FCFAF6\" : \"#fff\",\n        border: sel ? \"#005DAA\" : isToday ? \"#83553C\" : over ? \"#E8C3C4\" : \"#F1EBE1\",\n        dayColor: weekend ? \"#BFB8AB\" : \"#908A82\",\n        countColor: n ? \"#303030\" : \"#D8CFBE\",\n        utilPct: Math.min(100, util),\n        utilColor: heat,\n        title: n ? n + \" walks \\u00b7 \" + hrs + \"h of work against \" + cap + \"h coverage (\" + util + \"%)\" +\n          (imbalanced ? \" \\u00b7 \" + imbalanced + \" manager(s) over 8h as attributed \\u2014 reassignable\" : \"\")\n          : \"No walks scheduled\",\n        onClick: () => { if (n) this.setState({ day: k, pickCode: \"\", pickMgr: \"\" }); }\n      });\n    }\n    while (cells.length % 7) cells.push(pad);\n\n    // Weekday-only denominators, so both KPIs match the weekday cells above.\n    const mUtil = cap && workDays ? Math.round(wdHours / (cap * workDays) * 100) : 0;\n\n    // selected day detail — default to the busiest day in view\n    const dayKey = s.day && byDay[s.day] ? s.day : (busiest ? key(busiest.d) : null);\n    const rec = dayKey ? byDay[dayKey] : null;\n    const dHours = rec ? rec.hours : 0;\n    const dUtil = cap ? Math.round(dHours / cap * 100) : 0;\n    /* Every QA Manager in scope is listed, including those with no work that\n       day — an idle manager is exactly who absorbs an overloaded one's walks. */\n    const dayOver = rec ? dHours > cap : false;\n    const ids = this.pool().map(p => p.id);\n    if (rec) Object.keys(rec.people).forEach(id => { if (ids.indexOf(id) < 0) ids.push(id); });\n    const people = ids.map(id => {\n      const p = this.person(id), h = (rec && rec.people[id]) || 0;\n      const c = h === 0 ? \"#BFB8AB\" : h <= DAILY_CAP ? \"#005DAA\" : dayOver ? \"#AA1F23\" : \"#83553C\";\n      const on = s.pickMgr === id;\n      return {\n        id, name: p ? p.name : id, hours: h ? h + \"h\" : \"\\u2014\",\n        pct: Math.min(100, Math.round(h / DAILY_CAP * 100)),\n        color: c, nameColor: on ? \"#005DAA\" : h === 0 ? \"#908A82\" : c === \"#005DAA\" ? \"#303030\" : c,\n        weight: on ? 700 : 500,\n        bg: on ? \"#EAF2F9\" : \"transparent\",\n        title: h ? \"Show \" + (p ? p.name : id) + \"'s walks in the detail table\" : (p ? p.name : id) + \" has no walks this day\",\n        onClick: () => this.setState({ pickMgr: on ? \"\" : id }),\n        raw: h\n      };\n    }).sort((a, b) => b.raw - a.raw || a.name.localeCompare(b.name));\n    const dImbal = people.filter(p => p.raw > DAILY_CAP).length;\n    const dPeak = people.length ? people[0].raw : 0;\n    const dFree = people.filter(p => p.raw === 0).length;\n\n    const peakList = Object.keys(byDay).filter(k => parseKey(k) >= TODAY)\n      .sort((a, b) => byDay[b].n - byDay[a].n || (a < b ? -1 : 1)).slice(0, 6);\n    const peakMax = peakList.length ? byDay[peakList[0]].n : 1;\n\n    const commCounts = {};\n    this.walks().forEach(w => { if (w.community) commCounts[w.community] = (commCounts[w.community] || 0) + 1; });\n\n\n    // Detail table follows every active selection: filters, walk-type tiles, day.\n    const ORD = { QAI: 0, QAA: 1, CEL: 2, ACC: 3 };\n    let dayRows = dayKey ? rows.filter(w => w.date === dayKey) : [];\n    if (s.pickCode) dayRows = dayRows.filter(w => w.code === s.pickCode);\n    if (s.pickMgr) dayRows = dayRows.filter(w => w.personId === s.pickMgr);\n    dayRows.sort((a, b) => ORD[a.code] - ORD[b.code] ||\n      (a.community || \"\").localeCompare(b.community || \"\") || (a.job || \"\").localeCompare(b.job || \"\"));\n    const shown = dayRows.slice(0, 300);\n    return {\n      showCalc: s.showCalc,\n      calcLabel: s.showCalc ? \"Hide\" : \"Show\",\n      onToggleCalc: () => this.setState({ showCalc: !s.showCalc }),\n      table: {\n        caption: dayKey\n          ? shown.length + (dayRows.length > shown.length ? \" of \" + dayRows.length : \"\") + \" walks on \" + fmtLong(parseKey(dayKey)) +\n            (s.comm ? \" \\u00b7 \" + s.comm : \"\") + (s.mgr ? \" \\u00b7 \" + ((this.person(s.mgr) || {}).name || \"\") : \"\") +\n            (s.pickCode ? \" \\u00b7 \" + s.pickCode + \" only\" : \"\") +\n            (s.pickMgr ? \" \\u00b7 \" + ((this.person(s.pickMgr) || {}).name || \"\") : \"\")\n          : \"Select a day in the calendar to list its walks.\",\n        picked: !!(s.pickCode || s.pickMgr),\n        onClearPick: () => this.setState({ pickCode: \"\", pickMgr: \"\" }),\n        empty: shown.length === 0,\n        rows: shown.map((w, i) => {\n          const p = this.person(w.personId);\n          return {\n            code: w.code, pillBg: COLOR[w.code], pillColor: \"#fff\",\n            job: w.job, community: w.community || \"\\u2014\", address: w.address || \"\\u2014\",\n            mgr: p ? p.name : \"Unattributed\",\n            mgrColor: p ? \"#303030\" : \"#AA1F23\",\n            hours: HOURS[w.code] + \"h\",\n        src: w.projected ? (w.backlog ? \"Projected \\u00b7 backlog\" : \"Projected\") : \"Scheduled\",\n        srcColor: w.projected ? \"#83553C\" : \"#0D773C\",\n            bg: i % 2 ? \"#FCFAF6\" : \"#fff\"\n          };\n        })\n      },\n      dowNames: [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\", \"Sun\"],\n      monthLabel: MON[s.m] + \" \" + s.y,\n      onPrev: () => this.setState({ m: s.m === 0 ? 11 : s.m - 1, y: s.m === 0 ? s.y - 1 : s.y, day: null, pickCode: \"\", pickMgr: \"\" }),\n      onNext: () => this.setState({ m: s.m === 11 ? 0 : s.m + 1, y: s.m === 11 ? s.y + 1 : s.y, day: null, pickCode: \"\", pickMgr: \"\" }),\n      cells,\n      fComm: s.comm, fMgr: s.mgr,\n      commOpts: [{ v: \"\", l: \"All communities\" }].concat(\n        Object.keys(commCounts).sort().map(c => ({ v: c, l: c + \"  (\" + commCounts[c] + \")\" }))),\n      mgrOpts: [{ v: \"\", l: \"All QA Managers\" }].concat(\n        this.qams().slice().sort((a, b) => a.name.localeCompare(b.name)).map(p => ({ v: p.id, l: p.name + \" \\u2014 \" + p.home }))),\n      onComm: e => this.setState({ comm: e.target.value, day: null, pickCode: \"\", pickMgr: \"\" }),\n      onMgr: e => this.setState({ mgr: e.target.value, day: null, pickCode: \"\", pickMgr: \"\" }),\n      walkToggles: CODES.map(c => ({\n        code: c,\n        title: s.off[c] ? \"Show \" + c : \"Hide \" + c,\n        bg: s.off[c] ? \"#fff\" : COLOR[c],\n        color: s.off[c] ? \"#908A82\" : \"#fff\",\n        border: s.off[c] ? \"#D8CFBE\" : COLOR[c],\n        onClick: () => this.setState({ off: Object.assign({}, s.off, { [c]: !s.off[c] }), day: null, pickCode: \"\", pickMgr: \"\" })\n      })),\n      kpis: [\n        { label: \"Potential Walks This Month\", value: mTotal, sub: mHours + \"h of work \\u00b7 \" + (mTotal - mProj) + \" scheduled, \" + mProj + \" projected\", accent: \"#005DAA\", color: \"#303030\" },\n        { label: \"Avg Per Weekday\", value: workDays ? (wdTotal / workDays).toFixed(1) : \"0\", sub: wdTotal + \" weekday walks over \" + workDays + \" weekdays\", accent: \"#006368\", color: \"#303030\" },\n        { label: \"Weekday Capacity Used\", value: mUtil + \"%\", sub: cap + \"h available per day\", accent: mUtil >= 100 ? \"#AA1F23\" : \"#83553C\", color: mUtil >= 100 ? \"#AA1F23\" : \"#303030\" },\n        { label: \"Days Over Coverage\", value: overDays, sub: overDays ? \"more work than the team can absorb\" : \"every day fits within team coverage\", accent: overDays ? \"#AA1F23\" : \"#0D773C\", color: overDays ? \"#AA1F23\" : \"#303030\" },\n        { label: \"On Weekends\", value: weTotal, sub: weTotal ? \"all from dates already on record \\u2014 no projection lands on a weekend\" : \"none \\u2014 all walks on weekdays\", accent: weTotal ? \"#83553C\" : \"#0D773C\", color: weTotal ? \"#83553C\" : \"#303030\" }\n      ],\n      legend: CODES.map(c => ({ code: c, color: COLOR[c], label: c }))\n        .concat([{ code: \"proj\", color: \"#C9AC9B\", label: \"Lighter tone = projected\" }]),\n      modes: [[\"all\", \"Scheduled + Projected\"], [\"scheduled\", \"Scheduled Only\"], [\"projected\", \"Projected Only\"]]\n        .map(m => ({\n          label: m[1],\n          bg: s.mode === m[0] ? \"#005DAA\" : \"#fff\",\n          color: s.mode === m[0] ? \"#fff\" : \"#303030\",\n          border: s.mode === m[0] ? \"#005DAA\" : \"#BFB8AB\",\n          onClick: () => this.setState({ mode: m[0], day: null, pickCode: \"\", pickMgr: \"\" })\n        })),\n      mixNote: totals.sched + \" on record \\u00b7 \" + totals.proj + \" projected\" +\n        (bl.n ? \" \\u00b7 \" + bl.n + \" overdue (\" + bl.hours + \"h) drained across \" + bl.days + \" weekdays from \" + fmtShort(TODAY) : \"\"),\n      capNote: cap + \"h/day across \" + (s.mgr ? \"1 QA Manager\" : (s.comm ? this.homeQams(s.comm).length || 1 : this.qams().length) + \" QA Managers\"),\n      day: {\n        title: dayKey ? fmtLong(parseKey(dayKey)) : \"No Walks in View\",\n        tone: dayKey ? (dayOver ? \"Over coverage\" : dUtil >= 75 ? \"Running tight\" : dImbal ? \"Within coverage, unevenly spread\" : \"Within coverage\") : \"\",\n        toneColor: dayOver ? \"#AA1F23\" : dUtil >= 75 ? \"#83553C\" : dImbal ? \"#83553C\" : \"#0D773C\",\n        sub: dayKey\n          ? rec.n + \" walks (\" + (rec.n - rec.proj) + \" scheduled, \" + rec.proj + \" projected) \\u00b7 \" + dHours +\n            \"h of work against \" + cap + \"h coverage (\" + dUtil + \"%) \\u00b7 \" +\n            (this.poolSize() ? (dHours / this.poolSize()).toFixed(1) + \"h each if evenly spread\" : \"\") +\n            (dFree ? \" \\u00b7 \" + dFree + \" QA Managers idle\" : \"\")\n          : \"Adjust the filters or move to another month.\",\n        byType: CODES.map(c => {\n          const has = !!(rec && rec.codes[c]), on = s.pickCode === c;\n          return {\n            code: c, n: has ? rec.codes[c] : 0,\n            pillBg: has ? COLOR[c] : \"#F1EBE1\",\n            pillColor: has ? \"#fff\" : \"#908A82\",\n            color: on ? \"#005DAA\" : has ? \"#303030\" : \"#D8CFBE\",\n            bg: on ? \"#EAF2F9\" : \"#fff\",\n            title: has ? \"Show only \" + c + \" in the detail table\" : \"No \" + c + \" walks this day\",\n            onClick: () => { if (has) this.setState({ pickCode: on ? \"\" : c }); }\n          };\n        }),\n        people, noPeople: people.length === 0\n      },\n      peaks: peakList.map(k => ({\n        label: fmtShort(parseKey(k)),\n        n: byDay[k].n,\n        pct: Math.round(byDay[k].n / peakMax * 100),\n        color: byDay[k].hours > cap ? \"#AA1F23\" : \"#005DAA\",\n        nameColor: dayKey === k ? \"#005DAA\" : \"#303030\",\n        onClick: () => this.setState({ day: k, y: parseKey(k).getFullYear(), m: parseKey(k).getMonth() })\n      })),\n      peakNote: peakList.length ? \"Click a day to inspect it.\" : \"No upcoming walks match these filters.\",\n      notes: [\n        \"Where a walk has a date on record it is counted as scheduled. Where the date is blank the walk is projected forward on best-practice cadence, so this view shows total potential workload rather than only what has been booked.\",\n        \"Projected cadence: QAI is 7 days before projected completion, QAA is 7 days after QAI, CEL is 1+ day after QAA, ACC is 5+ days after CEL \\u2014 each stage on its own day.\",\n        \"Weekend rule, per the requirements: a Saturday result pulls in to Friday, a Sunday result pushes out to Monday. If that adjustment would land on or before the prior stage, the date steps forward a day at a time, skipping weekends. No projected walk is ever dated to a weekend.\",\n        \"Projections are never dated into the past. Overdue work is treated as a backlog and drained across successive weekdays \\u2014 each day filled only to the division's daily coverage \\u2014 rather than stacked onto one date, so the recovery run reads realistically instead of as a false spike.\",\n        \"Projected walks render in a lighter tone in each day's bar, and the mode buttons isolate scheduled or projected load.\",\n        \"Hours per walk: QAI 2, CEL 2, QAA 1, ACC 1. Each QA Manager is capped at 8 hours a day.\",\n        \"The tracker's 60 managers are construction managers and never perform walks, so load is attributed to each community's home QA Manager.\" +\n          (this._unattributed ? \" \" + this._unattributed + \" homesites have no home QA Manager and carry no attribution.\" : \"\"),\n        \"A day is OVER when the day's work exceeds the coverage available \\u2014 total hours against the number of QA Managers in scope times 8 hours. TIGHT var el = bar();\n    var tone = kind === 'error'\n      ? 'background:#fdecea;color:#7f1d1d'\n      : 'background:#fff8e1;color:#7c4a03';\n    el.style.cssText += ';' + tone;\n    el.innerHTML = html;\n  }\n\n  function hide() {\n    var el = document.getElementById(BAR);\n    if (el && el.parentNode) el.parentNode.removeChild(el);\n  }\n\n  function esc(s) {\n    return String(s == null ? '' : s).replace(/[&<>\"]/g, function (c) {\n      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c];\n    });\n  }\n\n  function announce() {\n    // scheduler and workload listen on both; walk-calendar only on olh-data.\n    window.dispatchEvent(new Event('walk-ref'));\n    window.dispatchEvent(new Event('olh-data'));\n  }\n\n  /* Record the load outcome on <body> so it can be inspected without reading\n   * rendered text. Pages like walk-calendar show an empty state until the user\n   * generates a schedule, so \"did live data arrive?\" is not answerable from the\n   * DOM text alone -- and a page that fetched nothing looks identical to one\n   * that fetched 935 records. Also handy in prod: check the attribute rather\n   * than guessing why a page looks thin.\n   */\n  function mark(source, jobCount, detail) {\n    if (!document.body) return;\n    document.body.setAttribute('data-olh-source', source);\n    document.body.setAttribute('data-olh-jobs', String(jobCount));\n    if (detail) document.body.setAttribute('data-olh-detail', detail);\n  }\n\n  function blank() {\n    window.OLH_DATA = {\n      jobs: [], managers: [], today: new Date(),\n      source: 'error', sourceLabel: 'data unavailable'\n    };\n    window.WALK_ROSTER = [];\n    window.WALK_DRIVE = {};\n    window.WALK_PRODUCT_MAP = {};\n    window.WALK_COMMUNITIES = [];\n    window.WALK_UNSCHEDULED = [];\n  }\n\n  async function getJson(path) {\n    var res = await fetch(API + path, { headers: { Accept: 'application/json' } });\n    var body = await res.json().catch(function () { return null; });\n    if (!res.ok || !body) {\n      throw new Error((body && body.error) || (path + ' failed (' + res.status + ')'));\n    }\n    return body;\n  }\n\n  async function boot() {\n    // walk-calendar reads only OLH_DATA.jobs/.managers -- it never touches the\n    // drive matrix or product map, so fetching walk-config there would be a\n    // pointless round trip and its coverage banner would be misleading.\n    var needsRef = !!(window.__OLH_LIVE && window.__OLH_LIVE.walkRef);\n\n    try {\n      var pair = await Promise.all(\n        needsRef ? [getJson('/jobs'), getJson('/walk-config')] : [getJson('/jobs')]\n      );\n      var jobs = pair[0];\n      var cfg = needsRef ? pair[1] : null;\n\n      if (!Array.isArray(jobs.jobs)) throw new Error('/jobs returned no job array');\n      if (needsRef && (!cfg || !cfg.drive || !cfg.roster)) {\n        throw new Error('/walk-config returned no reference data');\n      }\n\n      window.OLH_DATA = {\n        jobs: jobs.jobs,\n        managers: jobs.managers || [],\n        today: new Date(),\n        source: 'airtable',\n        sourceLabel: 'Airtable · ' + jobs.jobs.length.toLocaleString() + ' homesites'\n      };\n      if (cfg) {\n        window.WALK_ROSTER = cfg.roster;\n        window.WALK_DRIVE = cfg.drive;\n        window.WALK_PRODUCT_MAP = cfg.productMap;\n        window.WALK_COMMUNITIES = cfg.communities;\n        window.WALK_UNSCHEDULED = cfg.unscheduled || [];\n      }\n\n      announce();\n      mark('airtable', jobs.jobs.length,\n        cfg ? 'roster=' + cfg.roster.length + ' pairs=' + (cfg.meta && cfg.meta.pairCount) : 'jobs-only');\n\n      if (!cfg) { hide(); return; }\n\n      // Surface the coverage gap rather than letting homesites vanish quietly.\n      var u = window.WALK_UNSCHEDULED;\n      var homeUnknown = (cfg.meta && cfg.meta.rosterHomeUnknown) || 0;\n      var notes = [];\n      if (u.length) {\n        var sites = u.reduce(function (a, x) { return a + (x.homesites || 0); }, 0);\n        var comms = [];\n        u.forEach(function (x) {\n          if (x.baseCommunity && comms.indexOf(x.baseCommunity) === -1) comms.push(x.baseCommunity);\n        });\n        notes.push(\n          '<strong>' + sites + ' homesite' + (sites === 1 ? '' : 's') + ' not scheduled<\u002Fstrong> — ' +\n          comms.length + ' communit' + (comms.length === 1 ? 'y' : 'ies') +\n          ' have no drive times yet: ' + esc(comms.join(', ')) + '.'\n        );\n      }\n      if (homeUnknown) {\n        notes.push(\n          homeUnknown + ' roster member' + (homeUnknown === 1 ? '' : 's') +\n          ' have a home community that is not in the drive matrix, so their day starts unanchored.'\n        );\n      }\n      if (notes.length) show('warn', notes.join(' &nbsp;·&nbsp; '));\n      else hide();\n    } catch (err) {\n      blank();\n      announce();\n      mark('error', 0, (err && err.message) || String(err));\n      show('error',\n        '<strong>Live data unavailable.<\u002Fstrong> ' + esc((err && err.message) || String(err)) +\n        ' &nbsp;·&nbsp; This page shows no data rather than a stale sample. ' +\n        '<a href=\"\" onclick=\"location.reload();return false\" style=\"color:inherit;text-decoration:underline\">Retry<\u002Fa>');\n      if (window.console && console.warn) console.warn('[olh] live load failed:', err);\n    }\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', boot);\n  } else {\n    boot();\n  }\n})();\n\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
