            f['Construction Manager'] || '',
            f['Assigned Concierge'] || ''
          ]);
        });
        var headerRow = ws.getRow(1);
        headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1B2A58' } };
        headerRow.alignment = { vertical: 'middle' };
        ws.views = [{ state: 'frozen', ySplit: 1 }];
        ws.autoFilter = { from: 'A1', to: String.fromCharCode(64 + ws.columns.length) + '1' };

        var buf = await wb.xlsx.writeBuffer();
        var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Walk Schedule ' + state.dateKey + '.xlsx';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      } catch (err) {
        showBanner('error', 'Could not export: ' + esc(err && err.message ? err.message : String(err)));
      } finally {
        btn.disabled = !state.walks.length;
        btn.textContent = prevText;
      }
    })();
  }

  /* ---- Submit --------------------------------------------------------------
     Sequential, not parallel: Airtable's own 5 req/s cap plus the fact that
     /api/update-job re-reads the record's current fields for its conflict
     check means overlapping writes to nearby records could race each other's
     view of "today's load" for a manager who appears in more than one staged
     change. One at a time is slower but never wrong. */
  function submitPending(forceOverride) {
    var entries = Array.from(state.pending.values()).filter(function (p) {
      return !p.status || p.status === 'staged' || p.status === 'error';
    });
    if (!entries.length) return Promise.resolve();

    var btn = document.getElementById('btnSubmit');
    btn.disabled = true;

    var chain = Promise.resolve();
    entries.forEach(function (p) {
      chain = chain.then(function () {
        p.status = 'saving'; p.error = null; renderPendingBar();
        var field = WALK_FIELD[p.walkType].manager;
        var fields = {};
        fields[field] = p.toManagerId ? [p.toManagerId] : [];
        // Materialize a projected QAI/QAA date at the moment someone actually
        // takes the walk -- never on a timer, and never when the walk is being
        // unassigned (no manager means no decision was made, so the date stays
        // calculated and keeps tracking Projected Completion). update-job.js
        // whitelists 'QAI Date'/'QAA Date' as date fields, and its
        // checkSchedulingConflict() already prefers a date arriving in the same
        // request over the record's stored one, so the cap check sees the right
        // day without any server change.
        if (p.projectedDate && p.toManagerId && p.dateField) {
          fields[p.dateField] = p.projectedDate;
        }
        // force is harmless on entries that have no conflict -- the server
        // check would return conflict:false for them anyway -- so it is set
        // for the whole batch rather than resolved per entry. See btnSubmit's
        // click handler for where the person actually reconfirmed this.
        var reqBody = { recordId: p.recordId, fields: fields };
        if (forceOverride) reqBody.force = true;
        return fetch(API + '/update-job', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(reqBody)
        }).then(function (res) {
          return res.json().catch(function () { return null; }).then(function (body) {
            if (!res.ok) {
              p.status = 'error';
              p.error = (body && body.error) || ('HTTP ' + res.status);
            } else {
              p.status = 'done';
              // Reflect the change locally so the board doesn't flicker back
              // to the old assignment before the post-submit refresh lands.
              var job = state.jobs.find(function (j) { return j.id === p.recordId; });
              if (job) {
                job.fields[field] = p.toManagerId ? [p.toManagerId] : [];
                // Mirror the date write too, or buildWalks() would re-derive
                // this walk as projected on the very next render and show a
                // PROJECTED badge on a walk that was just made real.
                if (p.projectedDate && p.toManagerId && p.dateField) {
                  job.fields[p.dateField] = p.projectedDate;
                }
              }
            }
          });
        }).catch(function (err) {
          p.status = 'error';
          p.error = err && err.message ? err.message : 'Network error.';
        }).then(function () { renderPendingBar(); });
      });
    });

    return chain.then(function () {
      var succeeded = entries.filter(function (p) { return p.status === 'done'; });
      var failed = entries.filter(function (p) { return p.status === 'error'; });
      succeeded.forEach(function (p) { state.pending.delete(pendKey(p.recordId, p.walkType)); });

      // Optimistic local state is already updated (see above), but it can
      // only reflect what THIS browser just wrote -- another tab, another
      // person, or the server's own conflict-check side effects are not
      // visible until we re-read. Re-fetch for real rather than trusting the
      // local mutation as final. If the re-fetch itself fails, fall back to
      // the optimistic view rather than leaving the board blank.
      return loadJobs()
        .then(function () { buildWalks(); })
        .catch(function () { buildWalks(); })
        .then(function () {
          btn.disabled = state.can.indexOf('walk.schedule') < 0;
          renderAll();
          if (failed.length) {
            showBanner('error',
              '<strong>' + failed.length + ' change' + (failed.length === 1 ? '' : 's') + ' did not save.</strong> ' +
              'They are still listed below with the reason -- fix and resubmit, or remove them.' +
              (succeeded.length ? ' ' + succeeded.length + ' other change' + (succeeded.length === 1 ? '' : 's') + ' saved.' : ''));
          } else {
            showBanner('info', '<strong>Saved.</strong> ' + succeeded.length + ' walk' + (succeeded.length === 1 ? '' : 's') + ' reassigned.');
          }
        });
    });
  }

  /* ---- Init / wiring ------------------------------------------------------- */
  function setLoading(v) { state.loading = v; renderBoard(); }

  /* ---- Local draft save/restore ---------------------------------------------
     "Save draft" persists the current pending reassignments + deferred set
     to this browser's localStorage, keyed by date -- nothing is sent to
     Airtable. It's a way to save work-in-progress triage without committing
     it (that's what Submit is for). Restored automatically whenever that
     date's walks are (re)loaded, so Load/Refresh always shows the last
     locally saved draft for the date rather than a blank board. */
  function draftStorageKey(dateKey) { return 'olh.game.draft.v1.' + dateKey; }

  function saveDraftToLocal() {
    var dateKey = state.dateKey;
    if (!dateKey) return;
    var pendingArr = Array.from(state.pending.values())
      .filter(function (p) { return !p.status || p.status === 'staged' || p.status === 'error'; })
      .map(function (p) { return { recordId: p.recordId, walkType: p.walkType, toManagerId: p.toManagerId }; });
    var deferredArr = Object.keys(state.deferred);
    if (!pendingArr.length && !deferredArr.length) {
      try { localStorage.removeItem(draftStorageKey(dateKey)); } catch (e) {}
      showBanner('info', 'Nothing to save right now &mdash; cleared any previously saved draft for this date.');
      return;
    }
    try {
      localStorage.setItem(draftStorageKey(dateKey), JSON.stringify({
        savedAt: new Date().toISOString(),
        pending: pendingArr,
        deferred: deferredArr,
        extraCols: state.extraCols.slice()
      }));
      showBanner('info', '<strong>Draft saved on this device.</strong> ' + pendingArr.length + ' pending change' +
        (pendingArr.length === 1 ? '' : 's') + ' and ' + deferredArr.length + ' deferred walk' +
        (deferredArr.length === 1 ? '' : 's') + ' saved locally &mdash; nothing was sent to Airtable.');
    } catch (e) {
      showBanner('error', 'Could not save draft locally: ' + esc(e && e.message ? e.message : String(e)));
    }
  }

  /* Re-applies a locally saved draft (if any) for the just-loaded date on
     top of the freshly-fetched walks. Anything that no longer makes sense
     against the current Airtable data is silently skipped and counted --
     a walk that's been deleted, reassigned by someone else to the same
     manager already, locked since the draft was saved, or (for deferred
     entries) sold since the draft was saved. */
  function restoreDraft(dateKey) {
    var result = { restoredPending: 0, restoredDeferred: 0, skipped: 0 };
    var raw;
    try { raw = localStorage.getItem(draftStorageKey(dateKey)); } catch (e) { raw = null; }
    if (!raw) return result;
    var draft;
    try { draft = JSON.parse(raw); } catch (e) { return result; }

    (draft.extraCols || []).forEach(function (id) {
      if (state.managers.some(function (m) { return m.id === id; }) && state.extraCols.indexOf(id) < 0) {
        state.extraCols.push(id);
      }
    });

    (draft.deferred || []).forEach(function (key) {
      var idx = key.indexOf(':');
      if (idx < 0) { result.skipped++; return; }
      var recordId = key.slice(0, idx), walkType = key.slice(idx + 1);
      var w = state.walks.find(function (x) { return x.recordId === recordId && x.walkType === walkType; });
      if (w && !w.locked && w.unsold) { state.deferred[key] = true; result.restoredDeferred++; }
      else result.skipped++;
    });

    (draft.pending || []).forEach(function (p) {
      var w = state.walks.find(function (x) { return x.recordId === p.recordId && x.walkType === p.walkType; });
      if (!w || w.locked) { result.skipped++; return; }
      var key = pendKey(w.recordId, w.walkType);
      if (state.deferred[key]) return; // deferred wins; don't also stage a change
      if ((w.managerId || null) === (p.toManagerId || null)) return; // already the current manager -- nothing to stage
      state.pending.set(key, {
        recordId: w.recordId, walkType: w.walkType, jobNumber: w.jobNumber,
        fromManagerId: w.managerId || null, fromManagerName: managerName(w.managerId),
        toManagerId: p.toManagerId || null, toManagerName: managerName(p.toManagerId),
        // Re-derived from the LIVE walk, never from the saved draft: between
        // saving and restoring, the sync may have given this walk a real date
        // (or moved PCD), and a stale projected date out of localStorage would
        // then be written over the current one.
        projectedDate: w.projected ? w.raw : null,
        dateField: WALK_FIELD[w.walkType].date,
        status: 'staged', error: null
      });
      result.restoredPending++;
    });

    return result;
  }

  function loadForDate(dateKey) {
    if (state.pending.size || Object.keys(state.deferred).length) {
      var ok = confirm('You have unsaved pending changes or deferred walks for the current date. ' +
        'Loading will discard them from this screen (use Save draft first if you want to keep them). Continue?');
      if (!ok) return Promise.resolve();
      state.pending.clear();
      state.deferred = {};
    }
    state.dateKey = dateKey;
    state.publish = null;
    setLoading(true);
    clearBanner();
    return loadJobs().then(function () {
      buildWalks();
      var restored = restoreDraft(dateKey);
      setLoading(false);
      renderAll();
      if (restored.restoredPending || restored.restoredDeferred) {
        showBanner('info', 'Restored a locally saved draft for this date: ' + restored.restoredPending +
          ' pending change' + (restored.restoredPending === 1 ? '' : 's') + ', ' + restored.restoredDeferred +
          ' deferred walk' + (restored.restoredDeferred === 1 ? '' : 's') +
          (restored.skipped ? ' (' + restored.skipped + ' skipped -- no longer matches today\u2019s schedule)' : '') +
          '. Nothing has been sent to Airtable.');
      }
      // Advisory, fire-and-forget like loadSOTV3Reference -- the board is
      // fully usable before this resolves, it just updates the Publish
      // button/note once it knows whether this day is already locked.
      checkPublishStatus(dateKey).then(function () {
        updatePublishButton();
        updatePublishNote();
      });
    }).catch(function (err) {
      setLoading(false);
      if (err && err.status === 401) {
        showBanner('error', 'Your session has expired. <a href="/">Sign in again</a>, then reload this page.');
      } else {
        showBanner('error', 'Could not load walks: ' + esc(err && err.message ? err.message : String(err)));
      }
    });
  }

  /* Lets a plain vertical mouse wheel pan the board sideways. A standard
     Windows mouse has no horizontal scroll axis at all, so without this the
     only way to reach a manager column off to the right is to grab the
     scrollbar thumb by hand -- which can be scrolled off the bottom of the
     screen entirely once a day's columns run tall. Only takes over when the
     wheel input is dominantly vertical (deltaY > deltaX): a tilt-wheel or
     trackpad's native horizontal scroll, and shift+wheel, both already
     produce a deltaX and are left alone to keep working exactly as the
     browser already handles them. Wired once on #board itself (like
     wireCardActionButtons), since that element is never replaced across
     re-renders -- only its innerHTML is. */
  function wireBoardWheelScroll() {
    var board = document.getElementById('board');
    board.addEventListener('wheel', function (ev) {
      if (Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
      if (board.scrollWidth <= board.clientWidth) return; // nothing to pan
      ev.preventDefault();
      board.scrollLeft += ev.deltaY;
    }, { passive: false });
  }

  /* Unassign/Defer/Restore buttons on each card. Delegated on #board once
     (rather than re-wired every render) since it never moves in the DOM.
     Unassign and Defer reuse handleDrop() (toManagerId=null or DEFERRED)
     so a button click is IDENTICAL to dragging the card onto that column --
     same staging (or, for Defer, same local parking), same undo via the
     pending chip's x or the Restore button, nothing saved until Submit.
     Restore has no handleDrop equivalent since it isn't a column drop --
     it just clears the local deferred flag and lets effectiveManagerId()
     fall back to the walk's real current manager. */
  function wireCardActionButtons() {
    document.getElementById('board').addEventListener('click', function (ev) {
      var minBtn = ev.target.closest && ev.target.closest('[data-role="deferred-min"]');
      if (minBtn) {
        state.deferredMinimized = !state.deferredMinimized;
        renderBoard();
        return;
      }
      var unassignBtn = ev.target.closest && ev.target.closest('[data-unassign-record]');
      if (unassignBtn) {
        var uRecordId = unassignBtn.getAttribute('data-unassign-record');
        var uWalkType = unassignBtn.getAttribute('data-unassign-type');
        var uw = state.walks.find(function (x) { return x.recordId === uRecordId && x.walkType === uWalkType; });
        if (!uw || uw.locked) return;
        handleDrop({ recordId: uRecordId, walkType: uWalkType }, null);
        return;
      }
      var deferBtn = ev.target.closest && ev.target.closest('[data-defer-record]');
      if (deferBtn) {
        var dRecordId = deferBtn.getAttribute('data-defer-record');
        var dWalkType = deferBtn.getAttribute('data-defer-type');
        var dw = state.walks.find(function (x) { return x.recordId === dRecordId && x.walkType === dWalkType; });
        if (!dw || dw.locked) return;
        handleDrop({ recordId: dRecordId, walkType: dWalkType }, DEFERRED);
        return;
      }
      var restoreBtn = ev.target.closest && ev.target.closest('[data-restore-record]');
      if (restoreBtn) {
        var rRecordId = restoreBtn.getAttribute('data-restore-record');
        var rWalkType = restoreBtn.getAttribute('data-restore-type');
        delete state.deferred[pendKey(rRecordId, rWalkType)];
        renderAll();
      }
    });
  }

  function init() {
    var dateInput = document.getElementById('walkDate');
    dateInput.value = todayEastern();
    wireCardActionButtons();
    wireBoardWheelScroll();

    var session = getSession();
    if (!session || !session.token) {
      showBanner('error', 'You are not signed in. <a href="/">Sign in at the OLH Tracker home page</a>, then reload this page.');
      document.getElementById('board').innerHTML = '';
      return;
    }

    // Fire-and-forget, independent of the session/date-load chain below: the
    // board is fully usable without it (meta2 just shows community count
    // only until this resolves), so it shouldn't block or fail page load.
    // This also means Run SOTV3 usually finds sotv3Ref already warm.
    loadSOTV3Reference(dateInput.value).then(function () { renderBoard(); }).catch(function () {});

    loadSession().then(function () {
      if (state.can.indexOf('walk.schedule') < 0) {
        showBanner('warn',
          'Your role can view this page but not reassign walks (needs the "Schedule walks" permission). ' +
          'You can still see the schedule below, but Submit will be disabled.');
      }
      document.getElementById('btnSubmit').disabled = state.can.indexOf('walk.schedule') < 0;
      return loadForDate(dateInput.value);
    }).catch(function (err) {
      if (err && err.status === 401) {
        showBanner('error', 'Your session has expired. <a href="/">Sign in again</a>, then reload this page.');
      } else {
        showBanner('error', 'Could not verify your session: ' + esc(err && err.message ? err.message : String(err)));
      }
      document.getElementById('board').innerHTML = '';
    });

    document.getElementById('btnLoad').addEventListener('click', function () {
      loadForDate(dateInput.value);
    });
    document.getElementById('btnRefresh').addEventListener('click', function () {
      loadForDate(state.dateKey || dateInput.value);
    });
    document.getElementById('btnOptimize').addEventListener('click', function () {
      runSOTV3();
    });
    document.getElementById('btnExportExcel').addEventListener('click', function () {
      exportToExcel();
    });
    document.getElementById('btnPublish').addEventListener('click', function () {
      if (state.publish && state.publish.locked) unlockSchedule(); else publishSchedule();
    });
    document.getElementById('searchBox').addEventListener('input', applySearchHighlight);
    document.getElementById('addColSelect').addEventListener('change', function () {
      var id = this.value;
      if (id && state.extraCols.indexOf(id) < 0) state.extraCols.push(id);
      this.value = '';
      renderAll();
    });
    document.getElementById('btnClear').addEventListener('click', function () {
      var deferredCount = Object.keys(state.deferred).length;
      if (!state.pending.size && !deferredCount) return;
      var parts = [];
      if (state.pending.size) parts.push(state.pending.size + ' pending change(s)');
      if (deferredCount) parts.push(deferredCount + ' deferred walk(s)');
      if (!confirm('Discard ' + parts.join(' and ') + '? Nothing has been saved yet (use Save draft first to keep them locally).')) return;
      state.pending.clear();
      state.deferred = {};
      renderAll();
    });
    document.getElementById('btnSaveDraft').addEventListener('click', function () {
      saveDraftToLocal();
    });
    document.getElementById('btnSubmit').addEventListener('click', function () {
      var entries = Array.from(state.pending.values());
      var actionable = entries.filter(function (p) { return !p.status || p.status === 'staged' || p.status === 'error'; });
      if (!actionable.length) return;

      // Scope the violation check to just the managers this batch actually
      // hands a walk to -- not every column on the board -- so a person is
      // never asked to reconfirm a pre-existing problem they aren't touching.
      var targetManagerIds = actionable.reduce(function (acc, p) {
        if (p.toManagerId && acc.indexOf(p.toManagerId) < 0) acc.push(p.toManagerId);
        return acc;
      }, []);
      var violations = scheduleViolationsFor(targetManagerIds);
      var forceOverride = violations.length > 0;

      var msg = forceOverride
        ? 'This will leave the schedule breaking scheduling rules:\n\n' +
          violations.map(function (v) { return '\u2022 ' + v; }).join('\n') +
          '\n\nSave ' + actionable.length + ' walk reassignment(s) to Airtable anyway? ' +
          'This overrides the normal double-booking/cap check and cannot be undone from this screen.'
        : 'Save ' + actionable.length + ' walk reassignment(s) to Airtable now? This cannot be undone from this screen.';
      if (!confirm(msg)) return;
      submitPending(forceOverride);
    });
  }

  init();
})();
</script>
