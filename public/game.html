<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Walk Reassignment — OLH Tracker</title>
<style>
  :root{
    --navy:#1B2A58; --ink:#2B2620; --muted:#6F6963; --faint:#908A82;
    --border:#E4DED2; --bg:#FBF8F3; --card:#ffffff;
    --amber-bg:#FFF8E1; --amber-ink:#7C4A03; --amber-border:#F0DFAE;
    --red-bg:#FDECEA; --red-ink:#7F1D1D; --red-border:#F3C6C2;
    --green-bg:#EAF6EE; --green-ink:#1E5B34; --green-border:#C6E6D2;
    --lock:#B08900;
    --qai-tile:#F1F6FD; --qaa-tile:#F0FAF3; --cel-tile:#FDF6EA; --acc-tile:#FAF1FA;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  a{color:var(--navy)}
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 20px; background:var(--card); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:50;
  }
  header.top h1{
    margin:0; font:400 20px/1.2 Georgia,"Times New Roman",serif; color:var(--navy);
    letter-spacing:-.01em;
  }
  header.top .sub{font-size:12.5px; color:var(--faint); margin-top:2px}
  .back-link{font-size:13px; color:var(--muted); text-decoration:none; white-space:nowrap}
  .back-link:hover{text-decoration:underline}
  .controls{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:12px 20px; background:var(--card); border-bottom:1px solid var(--border);
  }
  .controls label{font-size:12.5px; color:var(--muted); font-weight:600}
  input[type=date], select{
    font:inherit; padding:6px 9px; border:1px solid var(--border); border-radius:7px;
    background:#fff; color:var(--ink);
  }
  button{
    font:inherit; font-weight:600; padding:7px 14px; border-radius:7px; border:1px solid var(--border);
    background:#fff; color:var(--ink); cursor:pointer;
  }
  button:hover:not(:disabled){background:#F5F1E9}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.primary{background:var(--navy); border-color:var(--navy); color:#fff}
  button.primary:hover:not(:disabled){background:#142146}
  button.danger-text{color:var(--red-ink); border-color:var(--red-border); background:var(--red-bg)}
  .banner{padding:10px 20px; font-size:13px; border-bottom:1px solid transparent}
  .banner.warn{background:var(--amber-bg); color:var(--amber-ink); border-color:var(--amber-border)}
  .banner.error{background:var(--red-bg); color:var(--red-ink); border-color:var(--red-border)}
  .banner.info{background:#EEF1FA; color:var(--navy); border-color:#D9DFF3}
  .banner a{color:inherit; text-decoration:underline}
  main{padding:16px 20px 120px}
  #board{display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:8px}
  .col{
    flex:0 0 260px; background:var(--card); border:1px solid var(--border); border-radius:10px;
    display:flex; flex-direction:column; min-height:120px;
  }
  .col.dragover{border-color:var(--navy); box-shadow:0 0 0 2px rgba(27,42,88,.15) inset}
  /* Unassigned is always the first column (see allColumnIds) -- pinning it
     to the left of the horizontally-scrolling board makes it possible to
     drag from it into a manager column scrolled out of view without losing
     sight of what's still unplaced. It already has an opaque background
     (--card) so scrolled-under cards don't show through. */
  .col.unassigned{position:sticky; left:0; z-index:35; box-shadow:6px 0 10px -6px rgba(27,42,88,.18)}
  .col.unassigned.dragover{box-shadow:6px 0 10px -6px rgba(27,42,88,.18), 0 0 0 2px rgba(27,42,88,.15) inset}
  /* Deferred sits immediately right of Unassigned, also pinned -- it's a
     local triage bucket (see handleDrop), not something saved to Airtable,
     so it needs to stay reachable while dragging cards out of far-right
     manager columns just like Unassigned does. Left offset = Unassigned's
     260px column width + the 14px #board gap. */
  .col.deferred{position:sticky; left:274px; z-index:34; box-shadow:6px 0 10px -6px rgba(27,42,88,.18)}
  .col.deferred.dragover{box-shadow:6px 0 10px -6px rgba(27,42,88,.18), 0 0 0 2px rgba(27,42,88,.15) inset}
  .col.deferred .col-head{background:var(--amber-bg); border-radius:10px 10px 0 0}
  .col-head{
    padding:10px 12px; border-bottom:1px solid var(--border); border-radius:10px 10px 0 0;
  }
  .col-head .name{font-weight:700; font-size:13.5px; color:var(--ink)}
  .col-head .meta2{font-size:11.5px; color:var(--muted); font-weight:600; margin-top:3px}
  .col-head select.sortpick{
    display:block; width:100%; margin-top:7px; font-size:11px; padding:4px 7px; border-radius:6px;
  }
  .col-head .meta{font-size:11.5px; color:var(--faint); margin-top:6px; display:flex; gap:8px; flex-wrap:wrap}
  .col-head .meta .cap-over{color:var(--red-ink); font-weight:700}
  .col-body{padding:8px; display:flex; flex-direction:column; gap:7px; min-height:60px}
  .col-empty{font-size:12px; color:var(--faint); padding:8px 4px; text-align:center}
  .card{
    background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 9px;
    cursor:grab; font-size:12.5px; position:relative;
  }
  .card:active{cursor:grabbing}
  .card.locked{cursor:not-allowed; opacity:.85}
  .card.staged{border-color:var(--navy); box-shadow:0 0 0 1px var(--navy) inset}
  .card .row1{display:flex; justify-content:space-between; gap:6px; align-items:baseline}
  .card .row1 .badges{display:flex; align-items:center; gap:4px}
  .card .job{font-weight:700; color:var(--navy)}
  .card .type{
    font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:999px; letter-spacing:.02em;
  }
  .type-QAI{background:#E7EEFB; color:#1B4FA0}
  .type-QAA{background:#EAF6EE; color:#1E5B34}
  .type-CEL{background:#FBEFE0; color:#8A5A12}
  .type-ACC{background:#F6E8F6; color:#7A2E82}
  .pill-unsold{
    font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; letter-spacing:.02em;
    background:var(--amber-bg); color:var(--amber-ink); border:1px solid var(--amber-border);
  }
  /* Left-edge accent on the card itself. Deliberately separate from
     .type-QAI etc above -- those are also used on the small pill badge
     inside the card, and giving the outer card the same class name would
     tint its whole background instead of just the pill. */
  .card-accent-QAI{border-left:3px solid #1B4FA0}
  .card-accent-QAA{border-left:3px solid #1E5B34}
  .card-accent-CEL{border-left:3px solid #8A5A12}
  .card-accent-ACC{border-left:3px solid #7A2E82}
  /* Light full-tile tint by walk type, on top of the left-edge accent above.
     Kept separate from .card.locked's opacity dimming and .card.staged's
     box-shadow ring -- neither of those sets background, so the tint always
     shows through regardless of those other states. */
  .card-tile-QAI{background:var(--qai-tile)}
  .card-tile-QAA{background:var(--qaa-tile)}
  .card-tile-CEL{background:var(--cel-tile)}
  .card-tile-ACC{background:var(--acc-tile)}
  .card .community{color:var(--muted); margin-top:3px}
  .card .time{color:var(--faint); font-size:11.5px; margin-top:2px}
  .card .lockrow{display:flex; align-items:center; gap:4px; color:var(--lock); font-size:11px; margin-top:4px; font-weight:600}
  .card .stagedfrom{font-size:11px; color:var(--navy); margin-top:4px; font-style:italic}
  .card .warnline{font-size:11px; color:var(--red-ink); margin-top:4px; font-weight:600}
  .card-actions{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap}
  .unassign-btn, .defer-btn, .restore-btn{
    font:inherit; font-size:11px; font-weight:600;
    padding:3px 8px; border-radius:6px; cursor:pointer;
  }
  .unassign-btn{border:1px solid var(--border); background:#fff; color:var(--muted)}
  .unassign-btn:hover{background:var(--red-bg); color:var(--red-ink); border-color:var(--red-border)}
  .defer-btn{border:1px solid var(--amber-border); background:var(--amber-bg); color:var(--amber-ink)}
  .defer-btn:hover{background:#FCEFC7}
  .restore-btn{border:1px solid #D9DFF3; background:#EEF1FA; color:var(--navy)}
  .restore-btn:hover{background:#E1E7F8}
  #pendingBar{
    position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--border);
    padding:12px 20px; display:flex; align-items:center; gap:14px; box-shadow:0 -2px 10px rgba(0,0,0,.06);
    z-index:60;
  }
  #pendingBar .count{font-weight:700}
  #pendingList{flex:1; overflow-x:auto; white-space:nowrap; display:flex; gap:8px}
  .pending-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; background:#F5F1E9;
    border:1px solid var(--border); border-radius:999px; padding:4px 10px; white-space:nowrap;
  }
  .pending-chip button{padding:0 4px; border:none; background:none; font-size:13px; line-height:1; color:var(--muted)}
  .pending-chip.saving{background:#EEF1FA; border-color:#D9DFF3}
  .pending-chip.done{background:var(--green-bg); border-color:var(--green-border); color:var(--green-ink)}
  .pending-chip.error{background:var(--red-bg); border-color:var(--red-border); color:var(--red-ink)}
  #addColWrap{display:flex; align-items:center; gap:6px}
  #searchWrap{display:flex; align-items:center; gap:6px}
  #searchBox{
    font:inherit; padding:6px 10px; border:1px solid var(--border); border-radius:7px;
    background:#fff; color:var(--ink); min-width:220px;
  }
  #timeSlotCards{display:flex; gap:10px; flex-wrap:wrap; padding:0 20px 14px; margin:0 -20px 0}
  .timecard{
    background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 16px;
    min-width:84px; text-align:center; cursor:pointer;
  }
  .timecard:hover{border-color:var(--navy)}
  .timecard .n{font-size:18px; font-weight:700; color:var(--navy); line-height:1.1}
  .timecard .lbl{font-size:11px; color:var(--muted); font-weight:600; margin-top:2px; white-space:nowrap}
  /* Search never hides cards -- it only rings matches and dims the rest, so
     drag-and-drop targets never disappear out from under a search query. */
  .card.search-dim{opacity:.3}
  .card.search-match{box-shadow:0 0 0 2px #B08900 inset; position:relative}
  .loading{padding:40px; text-align:center; color:var(--faint)}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Walk Reassignment</h1>
    <div class="sub">Drag walks between managers, then Submit. Nothing saves until you press Submit.</div>
  </div>
  <a class="back-link" href="/">&larr; All Views</a>
</header>
<div class="controls">
  <label for="walkDate">Date</label>
  <input type="date" id="walkDate">
  <button id="btnLoad">Load</button>
  <button id="btnRefresh" title="Re-fetch from Airtable">Refresh</button>
  <button id="btnOptimize" title="Run the SOTV3 optimizer on the loaded schedule" disabled>Run SOTV3</button>
  <div id="searchWrap">
    <label for="searchBox">Search</label>
    <input type="search" id="searchBox" placeholder="time, walk type, date, job #, community…">
  </div>
  <div id="addColWrap" style="margin-left:auto">
    <label for="addColSelect">Add manager column</label>
    <select id="addColSelect"><option value="">Choose…</option></select>
  </div>
</div>
<div id="banners"></div>
<main>
  <div id="timeSlotCards"></div>
  <div id="board"><div class="loading">Loading…</div></div>
</main>
<div id="pendingBar" style="display:none">
  <div class="count"><span id="pendingCount">0</span> pending change<span id="pendingPlural">s</span></div>
  <div id="pendingList"></div>
  <button id="btnClear">Clear all</button>
  <button id="btnSubmit" class="primary">Submit changes</button>
</div>
<script>
(function () {
  'use strict';

  /* ---- Constants -------------------------------------------------------- */
  var API = '/api';
  var SESSION_KEY = 'olh.session.v1';
  var TZ = 'America/New_York';

  // Mirrors netlify/functions/update-job.js WALK_TYPES / WALK_DURATION_MIN /
  // DAILY_CAP_MIN. Keep in sync by hand if those ever change -- there is no
  // single source of truth shared between the two.
  var WALK_FIELD = {
    QAI: { date: 'QAI Date',  manager: 'QAI Manager', lock: 'QAI Manager Lock', datetime: false, minutes: 120 },
    QAA: { date: 'QAA Date',  manager: 'QAA Manager', lock: 'QAA Manager Lock', datetime: false, minutes: 60  },
    CEL: { date: 'CEL Date',  manager: 'CEL Manager', lock: 'CEL Manager Lock', datetime: true,  minutes: 120 },
    ACC: { date: 'ACC Date',  manager: 'ACC Manager', lock: 'ACC Manager Lock', datetime: true,  minutes: 60  }
  };
  var WALK_TYPES = ['QAI', 'QAA', 'CEL', 'ACC'];
  var DAILY_CAP_MIN = 480;
  var INITIAL_LEG_CAP_MIN = 45; // SOTV3: first walk of a manager's day must be <= this from home
  // Sentinel "column id" for the Deferred bucket -- never a real Airtable
  // manager-link id, so it can share the same effectiveManagerId/allColumnIds
  // machinery as Unassigned (null) and real manager ids without colliding.
  var DEFERRED = '__deferred__';

  /* ---- Auth (mirrors the shared OLHAuth module's session contract) ------ */
  function getSession() {
    try { var v = localStorage.getItem(SESSION_KEY); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function authHeaders(extra) {
    var h = Object.assign({ Accept: 'application/json' }, extra || {});
    var s = getSession();
    var tok = s && s.token;
    if (tok) {
      h.Authorization = 'Bearer ' + tok;
      h['X-OLH-Token'] = 'Bearer ' + tok; // survives Azure's Authorization overwrite
    }
    return h;
  }

  /* ---- State -------------------------------------------------------------
     jobs: raw [{id, fields}] from /api/jobs, unfiltered.
     managers: [{id, name, email, role, active}] from /api/jobs.
     walks: derived per selected date -- rebuilt on load/refresh only.
     pending: Map key "<recordId>:<walkType>" -> {
       recordId, walkType, jobNumber, community, timeLabel,
       fromManagerId, fromManagerName, toManagerId, toManagerName,
       status: 'staged'|'saving'|'done'|'error', error
     }
     extraCols: manager ids added via the "Add manager column" picker that
       have no walk of their own yet, so an empty column exists to drop onto.
     unassignedSort / deferredSort: 'time' | 'type' | 'community' -- display-
       only ordering for the Unassigned / Deferred columns, independent of
       every other column's order.
     deferred: { "<recordId>:<walkType>": true } -- walks manually parked in
       the Deferred bucket via drag or the Defer button. Purely a local
       triage marker: it is never sent to Airtable (there is no such field
       on the Jobs table), and moving a walk into Deferred clears any staged
       pending change for it, so Submit never touches a deferred walk.
  --------------------------------------------------------------------------*/
  var state = {
    jobs: [], managers: [], walks: [], can: [], user: null,
    pending: new Map(), extraCols: [], dateKey: '', loading: false,
    unassignedSort: 'time', deferredSort: 'time', deferred: {}
  };

  /* ---- Small helpers ------------------------------------------------------ */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function todayEastern() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  }
  function easternDateKey(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  }
  function easternTimeLabel(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(d);
  }
  function managerName(id) {
    if (!id) return 'Unassigned';
    var m = state.managers.find(function (x) { return x.id === id; });
    return m ? m.name : '(unknown manager)';
  }
  function pendKey(recordId, walkType) { return recordId + ':' + walkType; }

  function showBanner(kind, html) {
    document.getElementById('banners').innerHTML =
      '<div class="banner ' + kind + '">' + html + '</div>';
  }
  function clearBanner() { document.getElementById('banners').innerHTML = ''; }

  /* ---- Data loading -------------------------------------------------------
     Deliberately talks to the same two endpoints the rest of the suite uses
     (/api/session to check who's signed in and what they can do, /api/jobs
     for the raw records) and nothing else -- no separate backend, no direct
     Airtable calls. Writes go through the existing /api/update-job, whose
     five validation layers (session, permission, field whitelist, type
     coercion, scheduling-conflict check) this page relies on rather than
     re-implementing. */
  function apiGet(path) {
    return fetch(API + path, { headers: authHeaders() }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (body) {
        if (res.status === 401) {
          var e = new Error((body && body.error) || 'Your session has expired.');
          e.status = 401; throw e;
        }
        if (!res.ok || !body) {
          throw new Error((body && body.error) || (path + ' failed (' + res.status + ')'));
        }
        return body;
      });
    });
  }

  function loadSession() {
    return apiGet('/session').then(function (data) {
      state.user = data.user || null;
      state.can = data.can || [];
    });
  }

  function loadJobs() {
    return apiGet('/jobs?refresh=1').then(function (data) {
      state.jobs = Array.isArray(data.jobs) ? data.jobs : [];
      state.managers = Array.isArray(data.managers) ? data.managers : [];
      state.managers.sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
    });
  }

  /**
   * Rebuild state.walks for state.dateKey (a YYYY-MM-DD string, interpreted
   * in Eastern time). Mirrors the walk-review skill's Phase 1 filter:
   *   - skip archived / manually-excluded rows
   *   - QAI/QAA compare the plain date string directly (no timezone -- these
   *     fields carry no clock time on the Jobs record)
   *   - CEL/ACC are UTC datetimes; convert to Eastern before comparing days
   *   - CEL/ACC walks only count if CEL Letter Sent is checked
   */
  function buildWalks() {
    var out = [];
    var dateKey = state.dateKey;
    state.jobs.forEach(function (job) {
      var f = job.fields || {};
      if (f['Manual Archive - Do Not Resync']) return;
      if (f['Record Status'] === 'Closed') return;

      WALK_TYPES.forEach(function (type) {
        var cfg = WALK_FIELD[type];
        var raw = f[cfg.date];
        if (!raw) return;
        var dayKey = cfg.datetime ? easternDateKey(raw) : String(raw).slice(0, 10);
        if (dayKey !== dateKey) return;
        if ((type === 'CEL' || type === 'ACC') && !f['CEL Letter Sent']) return;

        var link = f[cfg.manager];
        var managerId = (Array.isArray(link) && link.length) ? link[0] : null;

        out.push({
          recordId: job.id,
          jobNumber: f['Job #'] || '(no job #)',
          community: f['Community'] || '',
          address: [f['Street Address'], f['City']].filter(Boolean).join(', '),
          walkType: type,
          raw: raw,
          timeLabel: cfg.datetime ? easternTimeLabel(raw) : null,
          managerId: managerId,
          locked: !!f[cfg.lock],
          minutes: cfg.minutes,
          // Same field the no-COE report keys "Sold / committed" vs "Unsold"
          // off of (Homesite_Status__c, synced here as "Homesite Status").
          // 'Available' is the only unsold value; anything else counts sold.
          unsold: f['Homesite Status'] === 'Available'
        });
      });
    });
    // Stable-ish sort: time first (untimed QAI/QAA before timed CEL/ACC reads
    // oddly otherwise), then job number, so re-renders don't reshuffle cards.
    out.sort(function (a, b) {
      var ta = a.raw && WALK_FIELD[a.walkType].datetime ? a.raw : '';
      var tb = b.raw && WALK_FIELD[b.walkType].datetime ? b.raw : '';
      if (ta !== tb) return ta < tb ? -1 : 1;
      return String(a.jobNumber).localeCompare(String(b.jobNumber));
    });
    state.walks = out;
  }

  /* ---- Derived view: effective manager per walk --------------------------
     A walk's "effective" column is its staged destination if one is pending,
     otherwise its original manager (or the Unassigned bucket). Nothing here
     touches state.jobs/state.walks -- this is purely a rendering lens over
     pending, so Clear/undo is instant and never needs a re-fetch. */
  function effectiveManagerId(w) {
    var key = pendKey(w.recordId, w.walkType);
    if (state.deferred[key]) return DEFERRED;
    var p = state.pending.get(key);
    if (p) return p.toManagerId || null;
    return w.managerId || null;
  }

  function columnWalks(managerId) {
    return state.walks.filter(function (w) { return effectiveManagerId(w) === managerId; });
  }

  function columnMinutes(managerId) {
    return columnWalks(managerId).reduce(function (sum, w) { return sum + w.minutes; }, 0);
  }

  /** CEL/ACC walks in this column sharing the exact same clock time -- a
   *  physically-impossible double-booking. Client-side heads-up only; the
   *  server's own check on submit is authoritative. */
  function columnDuplicateTimes(managerId) {
    var seen = {};
    var dups = [];
    columnWalks(managerId).forEach(function (w) {
      if (!WALK_FIELD[w.walkType].datetime) return;
      var k = w.raw;
      if (seen[k]) dups.push(k);
      seen[k] = (seen[k] || 0) + 1;
    });
    return dups;
  }

  /* ---- Community count / drive-time estimate ------------------------------
     Reuses the SOTV3 reference data below (sotv3Ref, managerHome,
     coreCommunity, driveMinutes) rather than fetching or resolving anything
     of its own -- same roster/drive-matrix/product-map, just summarized per
     column instead of run through the optimizer. Resolves each walk's
     Community to a drive-matrix community, then sums the home->first-stop
     leg plus each consecutive stop-to-stop leg in the order the column
     already displays them (time first, then job #). Unknown legs (no
     drive-time row, or no known home community) are skipped rather than
     guessed, and the total is marked "partial" so the UI can show it as a
     lower bound. This is an at-a-glance estimate, not the optimizer's route. */
  function columnCommunityCount(managerId) {
    var seen = {};
    columnWalks(managerId).forEach(function (w) {
      seen[coreCommunity(w.community) || w.community || w.address || '(no community)'] = true;
    });
    return Object.keys(seen).length;
  }

  function columnDriveEstimate(managerId) {
    var walks = columnWalks(managerId); // already time-then-job# ordered
    var total = 0;
    var partial = false;
    var prev = managerHome(managerId);
    if (!prev) partial = true;
    walks.forEach(function (w) {
      var b = coreCommunity(w.community) || w.community || null;
      if (prev && b) {
        var leg = driveMinutes(prev, b);
        if (leg === null) partial = true; else total += leg;
      } else {
        partial = true;
      }
      if (b) prev = b;
    });
    return { minutes: total, partial: partial };
  }

  /* ---- Unassigned/Deferred column sort -------------------------------------
     Display-only: reorders a copy of columnWalks(managerId) for rendering.
     Never touches state.walks, so drag/drop, the Unassign/Defer buttons, cap
     math, and duplicate-time checks (all of which key off the original
     array) are unaffected. Shared by both triage columns (Unassigned's
     managerId is null, Deferred's is the DEFERRED sentinel) since they need
     identical sort behavior, just with independent state (unassignedSort /
     deferredSort) so changing one never reorders the other. */
  function sortedTriageWalks(managerId, mode) {
    var list = columnWalks(managerId).slice();
    function timeKey(w) { return (WALK_FIELD[w.walkType].datetime && w.raw) ? w.raw : ''; }
    function commKey(w) { return coreCommunity(w.community) || w.community || ''; }
    list.sort(function (a, b) {
      if (mode === 'type') {
        var ta = WALK_TYPES.indexOf(a.walkType), tb = WALK_TYPES.indexOf(b.walkType);
        if (ta !== tb) return ta - tb;
      } else if (mode === 'community') {
        var ca = commKey(a).localeCompare(commKey(b));
        if (ca !== 0) return ca;
      }
      var tka = timeKey(a), tkb = timeKey(b);
      if (tka !== tkb) return tka < tkb ? -1 : 1;
      return String(a.jobNumber).localeCompare(String(b.jobNumber));
    });
    return list;
  }

  function triageSortSelectHtml(role, mode, title) {
    function opt(v, label) {
      return '<option value="' + v + '"' + (mode === v ? ' selected' : '') + '>' + esc(label) + '</option>';
    }
    return '' +
      '<select class="sortpick" data-role="' + esc(role) + '-sort" title="' + esc(title) + '">' +
      opt('time', 'Sort: Time') + opt('type', 'Sort: Walk type') + opt('community', 'Sort: Community') +
      '</select>';
  }

  function allColumnIds() {
    var ids = {};
    state.walks.forEach(function (w) { ids[effectiveManagerId(w) || ''] = true; });
    state.extraCols.forEach(function (id) { ids[id] = true; });
    var list = Object.keys(ids).filter(function (id) { return id !== '' && id !== DEFERRED; });
    list.sort(function (a, b) { return managerName(a).localeCompare(managerName(b)); });
    // Unassigned and Deferred are always shown, even with zero walks in them
    // right now -- both are permanent drop targets (Unassign/Defer buttons
    // and drag-and-drop), so they have to be reachable before anything has
    // actually landed in either one yet.
    return ['', DEFERRED].concat(list);
  }

  /* ---- Rendering ----------------------------------------------------------- */
  function cardHtml(w) {
    var eff = effectiveManagerId(w);
    var isDeferred = eff === DEFERRED;
    var key = pendKey(w.recordId, w.walkType);
    var p = state.pending.get(key);
    var staged = !isDeferred && !!p;
    var classes = 'card card-accent-' + w.walkType + ' card-tile-' + w.walkType +
      (w.locked ? ' locked' : '') + (staged ? ' staged' : '');
    var dup = false;
    if (!isDeferred && WALK_FIELD[w.walkType].datetime) {
      dup = columnDuplicateTimes(eff).indexOf(w.raw) >= 0;
    }
    var overCap = !isDeferred && columnMinutes(eff) > DAILY_CAP_MIN;
    var unsoldBadge = w.unsold
      ? '<span class="pill-unsold" title="Homesite Status is Available -- this home is not yet sold">UNSOLD</span>'
      : '';
    // Core community name (e.g. "Ranches") instead of the specific product
    // line Airtable stores (e.g. "Ranches 50GC") -- same resolution the
    // drive-time estimate already uses, so the two never disagree.
    var displayCommunity = coreCommunity(w.community) || w.community || w.address || '(no community)';
    var actions = '';
    if (!w.locked) {
      if (isDeferred) {
        actions = '<button type="button" class="restore-btn" data-restore-record="' +
          esc(w.recordId) + '" data-restore-type="' + w.walkType + '">Restore</button>';
      } else {
        actions =
          (eff ? '<button type="button" class="unassign-btn" data-unassign-record="' +
            esc(w.recordId) + '" data-unassign-type="' + w.walkType + '">Unassign</button>' : '') +
          '<button type="button" class="defer-btn" data-defer-record="' +
            esc(w.recordId) + '" data-defer-type="' + w.walkType + '">Defer</button>';
      }
    }
    return '' +
      '<div class="' + classes + '" draggable="' + (w.locked ? 'false' : 'true') + '" ' +
      'data-record="' + esc(w.recordId) + '" data-type="' + w.walkType + '" data-current="' + esc(eff || '') + '">' +
      '<div class="row1"><span class="job">#' + esc(w.jobNumber) + '</span>' +
      '<span class="badges"><span class="type type-' + w.walkType + '">' + w.walkType + '</span>' + unsoldBadge + '</span></div>' +
      '<div class="community">' + esc(displayCommunity) + '</div>' +
      (w.timeLabel ? '<div class="time">' + esc(w.timeLabel) + ' ET</div>' : '<div class="time">No set time</div>') +
      (w.locked ? '<div class="lockrow">&#128274; Locked &mdash; cannot reassign</div>' : '') +
      (isDeferred ? '<div class="stagedfrom">Deferred &mdash; no change staged</div>' :
        (staged ? '<div class="stagedfrom">was: ' + esc(p.fromManagerName) + '</div>' : '')) +
      (dup ? '<div class="warnline">Same time as another walk on this manager</div>' : '') +
      (overCap && !dup ? '<div class="warnline">Manager over ' + DAILY_CAP_MIN + '-min cap</div>' : '') +
      (actions ? '<div class="card-actions">' + actions + '</div>' : '') +
      '</div>';
  }

  function columnHtml(managerId) {
    var isUnassigned = !managerId;
    var isDeferred = managerId === DEFERRED;
    var isRealManager = !isUnassigned && !isDeferred;
    var name = isDeferred ? 'Deferred' : (isUnassigned ? 'Unassigned' : managerName(managerId));
    var walks = isDeferred ? sortedTriageWalks(DEFERRED, state.deferredSort || 'time')
      : isUnassigned ? sortedTriageWalks(null, state.unassignedSort || 'time')
      : columnWalks(managerId);
    var minutes = columnMinutes(managerId);
    var overCap = isRealManager && minutes > DAILY_CAP_MIN;
    var dupCount = isRealManager ? columnDuplicateTimes(managerId).length : 0;
    var metaBits = [walks.length + ' walk' + (walks.length === 1 ? '' : 's')];
    if (isRealManager) metaBits.push((overCap ? '<span class="cap-over">' : '') + minutes + ' min' + (overCap ? '</span>' : ''));
    if (dupCount) metaBits.push('<span class="cap-over">' + dupCount + ' time clash</span>');
    var body = walks.length
      ? walks.map(cardHtml).join('')
      : '<div class="col-empty">Drop a walk here</div>';

    // Community count + drive-time estimate, directly under the name. Skips
    // the summary line entirely on an empty column (nothing to summarize),
    // skips the drive-time half for Unassigned/Deferred (no manager to
    // drive anywhere), and falls back to community-count-only if sotv3Ref
    // hasn't loaded yet (lazy-loaded -- see loadSOTV3Reference below).
    var meta2 = '';
    if (walks.length) {
      var commCount = columnCommunityCount(managerId);
      var commLabel = commCount + ' communit' + (commCount === 1 ? 'y' : 'ies');
      if (!isRealManager || !sotv3Ref.loaded) {
        meta2 = commLabel;
      } else {
        var est = columnDriveEstimate(managerId);
        meta2 = commLabel + ' &middot; ~' + est.minutes + ' min drive' + (est.partial ? '*' : '');
      }
    }

    var sortControl = isUnassigned
      ? triageSortSelectHtml('unassigned', state.unassignedSort || 'time', 'Sort the Unassigned column')
      : isDeferred
      ? triageSortSelectHtml('deferred', state.deferredSort || 'time', 'Sort the Deferred column')
      : '';

    return '' +
      '<div class="col' + (isUnassigned ? ' unassigned' : '') + (isDeferred ? ' deferred' : '') +
      '" data-manager="' + esc(managerId || '') + '">' +
      '<div class="col-head"><div class="name">' + esc(name) + '</div>' +
      (meta2 ? '<div class="meta2">' + meta2 + '</div>' : '') +
      sortControl +
      '<div class="meta">' + metaBits.join(' &middot; ') + '</div></div>' +
      '<div class="col-body">' + body + '</div>' +
      '</div>';
  }

  /* ---- Time-slot summary strip ---------------------------------------------
     Counts every loaded walk (regardless of which column it's currently in
     -- dragging a card between managers never changes these totals, only
     Load/Refresh does), grouped by clock time, with all untimed QAI/QAA
     walks bucketed together under "No set time". Clicking a card drops its
     label straight into the search box as a shortcut. */
  function timeSlotSummary() {
    var counts = {};
    var order = [];
    state.walks.forEach(function (w) {
      var label = w.timeLabel || 'No set time';
      if (!counts[label]) { counts[label] = 0; order.push({ label: label, raw: w.timeLabel ? w.raw : null }); }
      counts[label]++;
    });
    // Untimed bucket first (matches the board's own time-then-job# sort,
    // where untimed QAI/QAA walks sort ahead of timed CEL/ACC ones), then
    // chronological by raw UTC timestamp.
    order.sort(function (a, b) {
      if (a.raw === null && b.raw === null) return 0;
      if (a.raw === null) return -1;
      if (b.raw === null) return 1;
      return a.raw < b.raw ? -1 : (a.raw > b.raw ? 1 : 0);
    });
    return order.map(function (o) { return { label: o.label, count: counts[o.label] }; });
  }

  function renderTimeSlotCards() {
    var wrap = document.getElementById('timeSlotCards');
    if (!wrap) return;
    var slots = timeSlotSummary();
    if (!slots.length) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = slots.map(function (s) {
      return '<div class="timecard" data-slot="' + esc(s.label) + '" title="Click to search this time slot">' +
        '<div class="n">' + s.count + '</div><div class="lbl">' + esc(s.label) + '</div></div>';
    }).join('');
    wrap.querySelectorAll('.timecard').forEach(function (el) {
      el.addEventListener('click', function () {
        var box = document.getElementById('searchBox');
        if (!box) return;
        box.value = el.getAttribute('data-slot') || '';
        applySearchHighlight();
      });
    });
  }

  function renderBoard() {
    var board = document.getElementById('board');
    if (state.loading) {
      board.innerHTML = '<div class="loading">Loading…</div>';
      var slotWrap = document.getElementById('timeSlotCards');
      if (slotWrap) slotWrap.innerHTML = '';
      return;
    }
    // allColumnIds() always includes Unassigned and Deferred now (both are
    // permanent drop targets), so an empty day is detected off state.walks
    // directly rather than off an empty column list.
    if (!state.walks.length) {
      board.innerHTML = '<div class="loading">No QAI/QAA/CEL/ACC walks found for ' + esc(state.dateKey) + '.</div>';
      renderTimeSlotCards();
      return;
    }
    renderTimeSlotCards();
    var cols = allColumnIds();
    board.innerHTML = cols.map(function (id) { return columnHtml(id || null); }).join('');
    wireDragAndDrop();
    wireTriageSorts();
    applySearchHighlight();
  }

  function renderAddColumnSelect() {
    var sel = document.getElementById('addColSelect');
    var current = allColumnIds().filter(Boolean);
    var opts = ['<option value="">Choose…</option>'].concat(
      state.managers
        .filter(function (m) { return current.indexOf(m.id) < 0; })
        .map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.name) + '</option>'; })
    );
    sel.innerHTML = opts.join('');
  }

  function wireTriageSorts() {
    var roleToStateKey = { unassigned: 'unassignedSort', deferred: 'deferredSort' };
    Object.keys(roleToStateKey).forEach(function (role) {
      var sel = document.querySelector('[data-role="' + role + '-sort"]');
      if (!sel) return;
      sel.addEventListener('change', function () {
        state[roleToStateKey[role]] = this.value;
        renderBoard();
      });
    });
  }

  /* ---- Search / highlight ---------------------------------------------------
     Client-side only and never hides anything -- it rings matches and dims
     the rest, so drag-and-drop targets never disappear out from under a
     query mid-search. Matches against walk type, clock time (or "no set
     time"), job #, community (both the raw Airtable value and its core
     name), and the loaded date -- covers "time, walk type, or date" plus a
     couple of free conveniences. Re-applied after every renderBoard() since
     the board's innerHTML is rebuilt from scratch on each render. */
  function walkMatchesQuery(w, q) {
    var hay = [
      w.walkType,
      w.timeLabel || 'no set time',
      String(w.jobNumber || ''),
      w.community || '',
      coreCommunity(w.community) || '',
      state.dateKey || ''
    ].join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function applySearchHighlight() {
    var box = document.getElementById('searchBox');
    var q = box ? box.value.trim().toLowerCase() : '';
    document.querySelectorAll('#board .card').forEach(function (el) {
      if (!q) { el.classList.remove('search-match', 'search-dim'); return; }
      var recordId = el.getAttribute('data-record');
      var walkType = el.getAttribute('data-type');
      var w = state.walks.find(function (x) { return x.recordId === recordId && x.walkType === walkType; });
      var match = !!w && walkMatchesQuery(w, q);
      el.classList.toggle('search-match', match);
      el.classList.toggle('search-dim', !match);
    });
  }

  function renderPendingBar() {
    var bar = document.getElementById('pendingBar');
    var entries = Array.from(state.pending.values());
    if (!entries.length) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    document.getElementById('pendingCount').textContent = String(entries.length);
    document.getElementById('pendingPlural').textContent = entries.length === 1 ? '' : 's';
    var list = document.getElementById('pendingList');
    list.innerHTML = entries.map(function (p) {
      var key = pendKey(p.recordId, p.walkType);
      var cls = 'pending-chip' + (p.status && p.status !== 'staged' ? ' ' + p.status : '');
      var label = '#' + esc(p.jobNumber) + ' ' + p.walkType + ': ' + esc(p.fromManagerName) + ' &rarr; ' + esc(p.toManagerName);
      var tail = p.status === 'saving' ? ' (saving…)'
        : p.status === 'done' ? ' (saved)'
        : p.status === 'error' ? ' (failed: ' + esc(p.error || 'unknown error') + ')'
        : '';
      var removeBtn = (!p.status || p.status === 'staged' || p.status === 'error')
        ? '<button data-undo="' + esc(key) + '" title="Remove this change">&times;</button>' : '';
      return '<span class="' + cls + '">' + label + tail + removeBtn + '</span>';
    }).join('');
    list.querySelectorAll('[data-undo]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.pending.delete(btn.getAttribute('data-undo'));
        renderAll();
      });
    });
  }

  function renderAll() {
    renderBoard();
    renderAddColumnSelect();
    renderPendingBar();
    var optBtn = document.getElementById('btnOptimize');
    if (optBtn) optBtn.disabled = !state.walks.length || state.can.indexOf('walk.schedule') < 0;
  }

  /* ---- Drag & drop ---------------------------------------------------------
     Native HTML5 DnD, no library. Dropping a card onto a column only ever
     updates state.pending -- it never touches state.jobs and never calls the
     API. That is the whole point: nothing is committed until Submit. */
  var dragPayload = null;

  function wireDragAndDrop() {
    document.querySelectorAll('.card[draggable="true"]').forEach(function (card) {
      card.addEventListener('dragstart', function (ev) {
        dragPayload = {
          recordId: card.getAttribute('data-record'),
          walkType: card.getAttribute('data-type'),
          fromManagerId: card.getAttribute('data-current') || null
        };
        ev.dataTransfer.effectAllowed = 'move';
        try { ev.dataTransfer.setData('text/plain', JSON.stringify(dragPayload)); } catch (e) {}
      });
      card.addEventListener('dragend', function () { dragPayload = null; });
    });

    document.querySelectorAll('.col').forEach(function (col) {
      col.addEventListener('dragover', function (ev) {
        ev.preventDefault();
        ev.dataTransfer.dropEffect = 'move';
        col.classList.add('dragover');
      });
      col.addEventListener('dragleave', function () { col.classList.remove('dragover'); });
      col.addEventListener('drop', function (ev) {
        ev.preventDefault();
        col.classList.remove('dragover');
        var payload = dragPayload;
        if (!payload) {
          try { payload = JSON.parse(ev.dataTransfer.getData('text/plain')); } catch (e) { return; }
        }
        if (!payload) return;
        handleDrop(payload, col.getAttribute('data-manager') || null);
      });
    });
  }

  function handleDrop(payload, toManagerId) {
    var w = state.walks.find(function (x) {
      return x.recordId === payload.recordId && x.walkType === payload.walkType;
    });
    if (!w || w.locked) return;

    var key = pendKey(w.recordId, w.walkType);
    var effNow = effectiveManagerId(w);
    if (effNow === (toManagerId || (toManagerId === DEFERRED ? DEFERRED : null))) return; // dropped on its own column, no-op

    if (toManagerId === DEFERRED) {
      // Deferred is a local triage bucket only -- there is no Airtable
      // field for it, so any staged reassignment for this walk is dropped
      // and it just parks here (still showing its real current manager
      // underneath, see cardHtml) until it's dragged back out.
      state.pending.delete(key);
      state.deferred[key] = true;
      renderAll();
      return;
    }
    delete state.deferred[key];

    if ((w.managerId || null) === (toManagerId || null)) {
      // Dropped back onto its original manager -- cancel the staged change
      // rather than staging a same-to-same no-op.
      state.pending.delete(key);
    } else {
      state.pending.set(key, {
        recordId: w.recordId,
        walkType: w.walkType,
        jobNumber: w.jobNumber,
        fromManagerId: w.managerId || null,
        fromManagerName: managerName(w.managerId),
        toManagerId: toManagerId || null,
        toManagerName: managerName(toManagerId),
        status: 'staged',
        error: null
      });
    }
    renderAll();
  }

  /* ---- SOTV3 optimizer ------------------------------------------------------
     Direct port of the SOTV3 ruleset (algorithm.md) -- feasibility, then a
     clock-time-grouped bipartite assignment pass, then an untimed fill pass,
     then a Phase-3 sanity check. Nothing here writes to Airtable: every
     proposed change is fed through the exact same handleDrop() the drag-and-
     drop UI uses, so it lands in state.pending and waits for Submit like any
     manual reassignment.

     Reference data (manager home communities, the community drive-time
     matrix, the product-line -> core-community map, and today's time-off)
     is NOT part of /api/jobs -- it's pulled from /api/walk-config and
     /api/time-off, the same two endpoints walk-calendar.html and
     workload.html already read for the same reason. Lazy-loaded on first
     Run SOTV3 click per page load; not re-fetched on every click since it
     changes far less often than the jobs themselves. */
  var sotv3Ref = { loaded: false, roster: [], drive: {}, productMap: {}, communities: [], offToday: {} };

  function loadSOTV3Reference(dateKey) {
    return Promise.all([apiGet('/walk-config'), apiGet('/time-off')]).then(function (results) {
      var cfg = results[0] || {}, off = results[1] || {};
      sotv3Ref.roster = Array.isArray(cfg.roster) ? cfg.roster : [];
      sotv3Ref.drive = cfg.drive || {};
      sotv3Ref.productMap = cfg.productMap || {};
      // Longest-name-first so a prefix match (Ranches 50GC -> Ranches)
      // never gets shadowed by a shorter, unrelated community name.
      sotv3Ref.communities = (Array.isArray(cfg.communities) ? cfg.communities.slice() : [])
        .sort(function (a, b) { return b.length - a.length; });
      sotv3Ref.offToday = {};
      (Array.isArray(off.entries) ? off.entries : []).forEach(function (e) {
        if (e.date === dateKey) sotv3Ref.offToday[e.personId] = true;
      });
      sotv3Ref.loaded = true;
    });
  }

  function rosterEntry(managerId) {
    var name = managerName(managerId);
    return sotv3Ref.roster.find(function (r) { return r.name === name; }) || null;
  }
  function managerHome(managerId) {
    var r = rosterEntry(managerId);
    return (r && r.home) || null;
  }
  function isManagerOffToday(managerId) {
    var r = rosterEntry(managerId);
    return !!(r && sotv3Ref.offToday[r.id]);
  }
  /* Jobs' Community field holds a specific product line (e.g. "Ranches
     50GC"), not the canonical community name the drive matrix is keyed by.
     Resolve via the exact product map first, then a longest-prefix match
     against known communities, mirroring walk-calendar.html's core(). */
  function coreCommunity(rawCommunity) {
    if (!rawCommunity) return null;
    if (sotv3Ref.productMap[rawCommunity]) return sotv3Ref.productMap[rawCommunity];
    var low = rawCommunity.toLowerCase();
    for (var i = 0; i < sotv3Ref.communities.length; i++) {
      var c = sotv3Ref.communities[i];
      if (low.indexOf(c.toLowerCase()) === 0) return c;
    }
    if (/^ranches/i.test(rawCommunity)) return 'Ranches';
    if (/^sanctuary at wellness|^wellness way/i.test(rawCommunity)) return 'Wellness Ridge';
    return null;
  }
  function driveMinutes(a, b) {
    if (!a || !b) return null;
    if (a === b) return 0;
    var row = sotv3Ref.drive[a];
    var v = row && row[b];
    return typeof v === 'number' ? v : null;
  }
  function homeDistance(managerId, community) {
    var d = driveMinutes(managerHome(managerId), community);
    return d === null ? Infinity : d; // missing data sorts last for tiebreak, per algorithm.md
  }
  function lotStatusOf(recordId) {
    var job = state.jobs.find(function (j) { return j.id === recordId; });
    return job ? String((job.fields || {})['Lot Status'] || '').trim().toUpperCase() : '';
  }

  /* Runs the full three-phase pass and returns a report; never mutates
     state.walks/state.jobs itself -- computeSOTV3 works on its own scratch
     copy of each manager's day (mgrDay below), and the caller
     (applySOTV3Result) is what actually stages anything into state.pending. */
  function computeSOTV3(walks, managers) {
    var report = { deferred: [], flaggedNonSold: [], unresolved: [], proposals: [], duplicates: [], overCap: [] };

    var activeIds = managers
      .filter(function (m) { return m.active !== false && !isManagerOffToday(m.id); })
      .map(function (m) { return m.id; });

    var mgrDay = {}; // managerId -> { minutes, footprint:{community:true}, timedStops:[{time,community}] }
    function dayOf(id) {
      if (!mgrDay[id]) mgrDay[id] = { minutes: 0, footprint: {}, timedStops: [] };
      return mgrDay[id];
    }

    // ---- Phase 1: feasibility -------------------------------------------
    var eligible = [];
    walks.forEach(function (w) {
      var community = coreCommunity(w.community) || w.community;
      var lot = lotStatusOf(w.recordId);
      var isSold = lot === 'B';

      if (w.locked) {
        // Never reassigned, but still occupies the manager's capacity,
        // footprint, and (if timed) sequence position for leg math.
        if (w.managerId) {
          var d = dayOf(w.managerId);
          d.minutes += w.minutes;
          d.footprint[community] = true;
          if (WALK_FIELD[w.walkType].datetime) d.timedStops.push({ time: w.raw, community: community });
        }
        return;
      }

      if ((w.walkType === 'QAA' || w.walkType === 'ACC') && lot && !isSold) {
        report.deferred.push({ walk: w, reason: 'Non-Sold lot (' + lot + ') \u2014 QAA/ACC deferred, not scheduled' });
        return;
      }
      if (w.walkType === 'QAI' && lot && !isSold) {
        report.flaggedNonSold.push(w); // flagged, but falls through -- stays in the working set
      }
      eligible.push(Object.assign({}, w, { community: community }));
    });

    var timed = eligible.filter(function (w) { return WALK_FIELD[w.walkType].datetime; })
      .sort(function (a, b) { return a.raw < b.raw ? -1 : a.raw > b.raw ? 1 : 0; });
    var untimed = eligible.filter(function (w) { return !WALK_FIELD[w.walkType].datetime; });

    var groups = [];
    timed.forEach(function (w) {
      var g = groups.length && groups[groups.length - 1].time === w.raw ? groups[groups.length - 1] : null;
      if (!g) { g = { time: w.raw, walks: [] }; groups.push(g); }
      g.walks.push(w);
    });

    function lastStopBefore(managerId, time) {
      var best = null;
      dayOf(managerId).timedStops.forEach(function (s) {
        if (s.time < time && (!best || s.time > best.time)) best = s;
      });
      return best ? best.community : null;
    }
    function legFor(managerId, walk) {
      var prior = lastStopBefore(managerId, walk.raw);
      var from = prior || managerHome(managerId);
      return driveMinutes(from, walk.community);
    }
    function hasEarlierStop(managerId, time) {
      return dayOf(managerId).timedStops.some(function (s) { return s.time < time; });
    }

    // ---- Phase 2: timed walks, earliest clock time first, whole group at once --
    groups.forEach(function (g) {
      var pool = activeIds.slice();
      var remaining = g.walks.slice();
      while (remaining.length) {
        var pairs = [];
        remaining.forEach(function (w) {
          pool.forEach(function (mid) {
            var d = dayOf(mid);
            if (d.minutes + w.minutes > DAILY_CAP_MIN) return;
            var leg = legFor(mid, w);
            if (leg === null) return;
            if (!hasEarlierStop(mid, w.raw) && leg > INITIAL_LEG_CAP_MIN) return;
            pairs.push({ walk: w, managerId: mid, leg: leg, running: d.minutes });
          });
        });
        if (!pairs.length) {
          remaining.forEach(function (w) {
            var ranked = pool.map(function (mid) {
              var d = dayOf(mid);
              if (d.minutes + w.minutes > DAILY_CAP_MIN) return null;
              var leg = legFor(mid, w);
              return leg === null ? null : { managerId: mid, name: managerName(mid), leg: leg };
            }).filter(Boolean).sort(function (a, b) { return a.leg - b.leg; });
            report.unresolved.push({
              walk: w,
              reason: ranked.length ? 'No candidate within the ' + INITIAL_LEG_CAP_MIN + '-min initial-leg cap'
                : 'No eligible manager (daily cap, lock, or time off excludes everyone)',
              candidates: ranked
            });
          });
          remaining = [];
          break;
        }
        pairs.sort(function (a, b) {
          if (a.leg !== b.leg) return a.leg - b.leg;
          if (a.running !== b.running) return a.running - b.running;
          return homeDistance(a.managerId, a.walk.community) - homeDistance(b.managerId, b.walk.community);
        });
        var best = pairs[0];
        var bestDist = homeDistance(best.managerId, best.walk.community);
        var tied = pairs.filter(function (p) {
          return p.walk === best.walk && p.managerId !== best.managerId &&
            p.leg === best.leg && p.running === best.running &&
            homeDistance(p.managerId, p.walk.community) === bestDist;
        });
        if (tied.length) {
          report.unresolved.push({
            walk: best.walk,
            reason: 'Judgment call: genuine tie on leg minutes, running total, and home distance between ' +
              [best].concat(tied).map(function (p) { return managerName(p.managerId); }).join(', '),
            candidates: [best].concat(tied).map(function (p) { return { managerId: p.managerId, name: managerName(p.managerId), leg: p.leg }; })
          });
          remaining = remaining.filter(function (w) { return w !== best.walk; });
          continue;
        }
        var d2 = dayOf(best.managerId);
        d2.minutes += best.walk.minutes;
        d2.footprint[best.walk.community] = true;
        d2.timedStops.push({ time: best.walk.raw, community: best.walk.community });
        report.proposals.push({ walk: best.walk, toManagerId: best.managerId });
        remaining = remaining.filter(function (w) { return w !== best.walk; });
        pool = pool.filter(function (id) { return id !== best.managerId; });
      }
    });

    // ---- Untimed fill (QAI/QAA): same-community full-day footprint first --
    var byCommunity = {};
    untimed.forEach(function (w) { (byCommunity[w.community] = byCommunity[w.community] || []).push(w); });
    Object.keys(byCommunity).forEach(function (community) {
      byCommunity[community].forEach(function (w) {
        var working = activeIds.filter(function (id) {
          var d = dayOf(id);
          return !!d.footprint[community] && d.minutes + w.minutes <= DAILY_CAP_MIN;
        });
        if (working.length) {
          working.sort(function (a, b) {
            var ma = dayOf(a).minutes, mb = dayOf(b).minutes;
            if (ma !== mb) return ma - mb;
            return homeDistance(a, community) - homeDistance(b, community);
          });
          var pick = working[0];
          var dp = dayOf(pick);
          dp.minutes += w.minutes; dp.footprint[community] = true;
          report.proposals.push({ walk: w, toManagerId: pick });
          return;
        }
        var ranked = activeIds.map(function (id) {
          var d = dayOf(id);
          if (d.minutes + w.minutes > DAILY_CAP_MIN) return null;
          return { managerId: id, d: homeDistance(id, community) };
        }).filter(Boolean).sort(function (a, b) { return a.d - b.d; });
        if (!ranked.length) {
          report.unresolved.push({ walk: w, reason: 'No manager has remaining capacity today for this untimed walk' });
          return;
        }
        var chosen = ranked[0].managerId;
        var dc = dayOf(chosen);
        dc.minutes += w.minutes; dc.footprint[community] = true;
        report.proposals.push({ walk: w, toManagerId: chosen });
      });
    });

    // ---- Phase 3: sanity check ------------------------------------------
    var finalByManager = {};
    function record(managerId, walk) { (finalByManager[managerId] = finalByManager[managerId] || []).push(walk); }
    walks.forEach(function (w) { if (w.locked && w.managerId) record(w.managerId, w); });
    report.proposals.forEach(function (p) { record(p.toManagerId, p.walk); });

    Object.keys(finalByManager).forEach(function (managerId) {
      var byTime = {};
      finalByManager[managerId].forEach(function (w) {
        if (!WALK_FIELD[w.walkType].datetime) return;
        (byTime[w.raw] = byTime[w.raw] || []).push(w);
      });
      Object.keys(byTime).forEach(function (t) {
        if (byTime[t].length > 1) report.duplicates.push({ managerId: managerId, time: t, walks: byTime[t] });
      });
    });

    Object.keys(mgrDay).forEach(function (id) {
      if (mgrDay[id].minutes > DAILY_CAP_MIN) report.overCap.push({ managerId: id, minutes: mgrDay[id].minutes });
    });

    return report;
  }

  /* Stage every proposal that actually changes something (skip anything the
     optimizer would leave right where it already is) through handleDrop, so
     it behaves exactly like a manual drag -- staged, undoable, unsaved until
     Submit -- then render a plain-language summary of everything else the
     algorithm found. */
  function applySOTV3Result(report) {
    var applied = 0;
    report.proposals.forEach(function (p) {
      var w = state.walks.find(function (x) { return x.recordId === p.walk.recordId && x.walkType === p.walk.walkType; });
      if (!w) return;
      if (effectiveManagerId(w) === p.toManagerId) return;
      handleDrop({ recordId: w.recordId, walkType: w.walkType, fromManagerId: effectiveManagerId(w) }, p.toManagerId);
      applied++;
    });

    var parts = [];
    parts.push('<strong>SOTV3 finished.</strong> ' + applied + ' change' + (applied === 1 ? '' : 's') +
      ' staged below \u2014 review, then Submit. Nothing has been saved.');
    if (report.flaggedNonSold.length) {
      parts.push('<div><strong>' + report.flaggedNonSold.length + ' QAI walk' + (report.flaggedNonSold.length === 1 ? '' : 's') +
        ' flagged</strong> (non-Sold lot, still scheduled): ' +
        report.flaggedNonSold.map(function (w) { return '#' + esc(w.jobNumber); }).join(', ') + '</div>');
    }
    if (report.deferred.length) {
      parts.push('<div><strong>' + report.deferred.length + ' walk' + (report.deferred.length === 1 ? '' : 's') +
        ' deferred</strong> (non-Sold lot, not scheduled): ' +
        report.deferred.map(function (d) { return '#' + esc(d.walk.jobNumber) + ' (' + d.walk.walkType + ')'; }).join(', ') + '</div>');
    }
    if (report.unresolved.length) {
      parts.push('<div><strong>' + report.unresolved.length + ' walk' + (report.unresolved.length === 1 ? '' : 's') +
        ' unresolved</strong> \u2014 left with its current manager: ' +
        report.unresolved.map(function (u) { return '#' + esc(u.walk.jobNumber) + ': ' + esc(u.reason); }).join('; ') + '</div>');
    }
    parts.push('<div>Duplicate-booking check: ' + (report.duplicates.length
      ? '<strong>' + report.duplicates.length + ' clash' + (report.duplicates.length === 1 ? '' : 'es') + ' found</strong> \u2014 ' +
        report.duplicates.map(function (d) { return esc(managerName(d.managerId)) + ' at ' + esc(easternTimeLabel(d.time)) + ' ET'; }).join(', ')
      : 'none found') + '.</div>');
    if (report.overCap.length) {
      parts.push('<div><strong>Over the ' + DAILY_CAP_MIN + '-min cap:</strong> ' +
        report.overCap.map(function (o) { return esc(managerName(o.managerId)) + ' at ' + o.minutes + ' min'; }).join(', ') + '.</div>');
    }
    showBanner(report.unresolved.length || report.duplicates.length || report.overCap.length ? 'warn' : 'info', parts.join(''));
    renderAll();
  }

  function runSOTV3() {
    if (!state.walks.length || state.can.indexOf('walk.schedule') < 0) return;
    var btn = document.getElementById('btnOptimize');
    btn.disabled = true;
    clearBanner();
    showBanner('info', 'Running SOTV3\u2026');
    // Time off is date-specific and the roster/drive/product-map refresh is
    // cheap (server-cached 5 min), so this always re-fetches rather than
    // trusting a load from a previous date.
    loadSOTV3Reference(state.dateKey)
      .then(function () {
        var report = computeSOTV3(state.walks, state.managers);
        applySOTV3Result(report);
      })
      .catch(function (err) {
        showBanner('error', 'Could not run SOTV3: ' + esc(err && err.message ? err.message : String(err)));
      })
      .then(function () {
        btn.disabled = !state.walks.length || state.can.indexOf('walk.schedule') < 0;
      });
  }

  /* ---- Submit --------------------------------------------------------------
     Sequential, not parallel: Airtable's own 5 req/s cap plus the fact that
     /api/update-job re-reads the record's current fields for its conflict
     check means overlapping writes to nearby records could race each other's
     view of "today's load" for a manager who appears in more than one staged
     change. One at a time is slower but never wrong. */
  function submitPending() {
    var entries = Array.from(state.pending.values()).filter(function (p) {
      return !p.status || p.status === 'staged' || p.status === 'error';
    });
    if (!entries.length) return Promise.resolve();

    var btn = document.getElementById('btnSubmit');
    btn.disabled = true;

    var chain = Promise.resolve();
    entries.forEach(function (p) {
      chain = chain.then(function () {
        p.status = 'saving'; p.error = null; renderPendingBar();
        var field = WALK_FIELD[p.walkType].manager;
        var fields = {};
        fields[field] = p.toManagerId ? [p.toManagerId] : [];
        return fetch(API + '/update-job', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ recordId: p.recordId, fields: fields })
        }).then(function (res) {
          return res.json().catch(function () { return null; }).then(function (body) {
            if (!res.ok) {
              p.status = 'error';
              p.error = (body && body.error) || ('HTTP ' + res.status);
            } else {
              p.status = 'done';
              // Reflect the change locally so the board doesn't flicker back
              // to the old assignment before the post-submit refresh lands.
              var job = state.jobs.find(function (j) { return j.id === p.recordId; });
              if (job) job.fields[field] = p.toManagerId ? [p.toManagerId] : [];
            }
          });
        }).catch(function (err) {
          p.status = 'error';
          p.error = err && err.message ? err.message : 'Network error.';
        }).then(function () { renderPendingBar(); });
      });
    });

    return chain.then(function () {
      var succeeded = entries.filter(function (p) { return p.status === 'done'; });
      var failed = entries.filter(function (p) { return p.status === 'error'; });
      succeeded.forEach(function (p) { state.pending.delete(pendKey(p.recordId, p.walkType)); });

      // Optimistic local state is already updated (see above), but it can
      // only reflect what THIS browser just wrote -- another tab, another
      // person, or the server's own conflict-check side effects are not
      // visible until we re-read. Re-fetch for real rather than trusting the
      // local mutation as final. If the re-fetch itself fails, fall back to
      // the optimistic view rather than leaving the board blank.
      return loadJobs()
        .then(function () { buildWalks(); })
        .catch(function () { buildWalks(); })
        .then(function () {
          btn.disabled = state.can.indexOf('walk.schedule') < 0;
          renderAll();
          if (failed.length) {
            showBanner('error',
              '<strong>' + failed.length + ' change' + (failed.length === 1 ? '' : 's') + ' did not save.</strong> ' +
              'They are still listed below with the reason -- fix and resubmit, or remove them.' +
              (succeeded.length ? ' ' + succeeded.length + ' other change' + (succeeded.length === 1 ? '' : 's') + ' saved.' : ''));
          } else {
            showBanner('info', '<strong>Saved.</strong> ' + succeeded.length + ' walk' + (succeeded.length === 1 ? '' : 's') + ' reassigned.');
          }
        });
    });
  }

  /* ---- Init / wiring ------------------------------------------------------- */
  function setLoading(v) { state.loading = v; renderBoard(); }

  function loadForDate(dateKey) {
    if (state.pending.size) {
      var ok = confirm('You have unsaved pending changes for the current date. Loading a new date will discard them. Continue?');
      if (!ok) return Promise.resolve();
      state.pending.clear();
    }
    state.dateKey = dateKey;
    setLoading(true);
    clearBanner();
    return loadJobs().then(function () {
      buildWalks();
      setLoading(false);
      renderAll();
    }).catch(function (err) {
      setLoading(false);
      if (err && err.status === 401) {
        showBanner('error', 'Your session has expired. <a href="/">Sign in again</a>, then reload this page.');
      } else {
        showBanner('error', 'Could not load walks: ' + esc(err && err.message ? err.message : String(err)));
      }
    });
  }

  /* Unassign/Defer/Restore buttons on each card. Delegated on #board once
     (rather than re-wired every render) since it never moves in the DOM.
     Unassign and Defer reuse handleDrop() (toManagerId=null or DEFERRED)
     so a button click is IDENTICAL to dragging the card onto that column --
     same staging (or, for Defer, same local parking), same undo via the
     pending chip's x or the Restore button, nothing saved until Submit.
     Restore has no handleDrop equivalent since it isn't a column drop --
     it just clears the local deferred flag and lets effectiveManagerId()
     fall back to the walk's real current manager. */
  function wireCardActionButtons() {
    document.getElementById('board').addEventListener('click', function (ev) {
      var unassignBtn = ev.target.closest && ev.target.closest('[data-unassign-record]');
      if (unassignBtn) {
        var uRecordId = unassignBtn.getAttribute('data-unassign-record');
        var uWalkType = unassignBtn.getAttribute('data-unassign-type');
        var uw = state.walks.find(function (x) { return x.recordId === uRecordId && x.walkType === uWalkType; });
        if (!uw || uw.locked) return;
        handleDrop({ recordId: uRecordId, walkType: uWalkType }, null);
        return;
      }
      var deferBtn = ev.target.closest && ev.target.closest('[data-defer-record]');
      if (deferBtn) {
        var dRecordId = deferBtn.getAttribute('data-defer-record');
        var dWalkType = deferBtn.getAttribute('data-defer-type');
        var dw = state.walks.find(function (x) { return x.recordId === dRecordId && x.walkType === dWalkType; });
        if (!dw || dw.locked) return;
        handleDrop({ recordId: dRecordId, walkType: dWalkType }, DEFERRED);
        return;
      }
      var restoreBtn = ev.target.closest && ev.target.closest('[data-restore-record]');
      if (restoreBtn) {
        var rRecordId = restoreBtn.getAttribute('data-restore-record');
        var rWalkType = restoreBtn.getAttribute('data-restore-type');
        delete state.deferred[pendKey(rRecordId, rWalkType)];
        renderAll();
      }
    });
  }

  function init() {
    var dateInput = document.getElementById('walkDate');
    dateInput.value = todayEastern();
    wireCardActionButtons();

    var session = getSession();
    if (!session || !session.token) {
      showBanner('error', 'You are not signed in. <a href="/">Sign in at the OLH Tracker home page</a>, then reload this page.');
      document.getElementById('board').innerHTML = '';
      return;
    }

    // Fire-and-forget, independent of the session/date-load chain below: the
    // board is fully usable without it (meta2 just shows community count
    // only until this resolves), so it shouldn't block or fail page load.
    // This also means Run SOTV3 usually finds sotv3Ref already warm.
    loadSOTV3Reference(dateInput.value).then(function () { renderBoard(); }).catch(function () {});

    loadSession().then(function () {
      if (state.can.indexOf('walk.schedule') < 0) {
        showBanner('warn',
          'Your role can view this page but not reassign walks (needs the "Schedule walks" permission). ' +
          'You can still see the schedule below, but Submit will be disabled.');
      }
      document.getElementById('btnSubmit').disabled = state.can.indexOf('walk.schedule') < 0;
      return loadForDate(dateInput.value);
    }).catch(function (err) {
      if (err && err.status === 401) {
        showBanner('error', 'Your session has expired. <a href="/">Sign in again</a>, then reload this page.');
      } else {
        showBanner('error', 'Could not verify your session: ' + esc(err && err.message ? err.message : String(err)));
      }
      document.getElementById('board').innerHTML = '';
    });

    document.getElementById('btnLoad').addEventListener('click', function () {
      loadForDate(dateInput.value);
    });
    document.getElementById('btnRefresh').addEventListener('click', function () {
      loadForDate(state.dateKey || dateInput.value);
    });
    document.getElementById('btnOptimize').addEventListener('click', function () {
      runSOTV3();
    });
    document.getElementById('searchBox').addEventListener('input', applySearchHighlight);
    document.getElementById('addColSelect').addEventListener('change', function () {
      var id = this.value;
      if (id && state.extraCols.indexOf(id) < 0) state.extraCols.push(id);
      this.value = '';
      renderAll();
    });
    document.getElementById('btnClear').addEventListener('click', function () {
      if (!state.pending.size) return;
      if (!confirm('Discard all ' + state.pending.size + ' pending change(s)? Nothing has been saved yet.')) return;
      state.pending.clear();
      renderAll();
    });
    document.getElementById('btnSubmit').addEventListener('click', function () {
      var entries = Array.from(state.pending.values());
      var actionable = entries.filter(function (p) { return !p.status || p.status === 'staged' || p.status === 'error'; });
      if (!actionable.length) return;
      if (!confirm('Save ' + actionable.length + ' walk reassignment(s) to Airtable now? This cannot be undone from this screen.')) return;
      submitPending();
    });
  }

  init();
})();
</script>
</body>
</html>
