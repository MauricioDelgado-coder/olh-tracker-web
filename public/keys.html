<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keys — OLH Tracker</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#FBF6F3;color:#303030;font:400 14px/1.45 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:3px solid rgba(0,93,170,.35);outline-offset:1px}
  a{color:#005DAA;text-decoration:none}
  a:hover{color:#203F7C;text-decoration:underline}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:8px 10px;font-size:12.5px;vertical-align:top}
  th{position:sticky;top:0;background:#F6F2EA;color:#6F6963;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid #D8CFBE;white-space:nowrap}
  td{border-bottom:1px solid #F1EBE1}
  tr:nth-child(even) td{background:#FCFAF6}
  td input[type=text],td input[type=date],td select{height:28px;width:100%;min-width:110px;padding:0 8px;border:1px solid #BFB8AB;border-radius:4px;font-size:12.5px;background:#fff}
  td input:disabled,td select:disabled{background:transparent;border-color:transparent;padding:0;color:#303030}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column;background:#FBF6F3">

  <header style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 32px;background:#1B2A58">
    <h1 style="margin:0;font-size:18px;font-weight:600;letter-spacing:.005em;color:#fff;white-space:nowrap">Keys</h1>
    <span style="font-size:11.5px;color:#C7BFB2;white-space:nowrap">Job #, community, address and key handover status — admin &amp; leadership only</span>
    <span style="margin-left:auto;display:flex;align-items:center;gap:14px">
      <olh-user-chip></olh-user-chip>
    </span>
    <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border:1px solid rgba(255,255,255,.28);border-radius:4px;color:#C7BFB2;font-size:13px;font-weight:500;white-space:nowrap">← All Views</a>
  </header>

  <div id="readOnlyBar" style="display:none;align-items:center;gap:12px;padding:11px 32px;background:#FBEDED;border-bottom:1px solid #EFCFCF">
    <span style="height:19px;padding:0 9px;border-radius:999px;background:#fff;color:#AA1F23;font-size:9.5px;font-weight:700;line-height:19px;letter-spacing:.09em">READ ONLY</span>
    <span id="readOnlyNote" style="font-size:12.5px;font-weight:500;color:#AA1F23"></span>
  </div>

  <main style="flex:1 1 auto;max-width:1400px;width:100%;margin:0 auto;padding:20px 32px 40px">

    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border:1px solid #E4DED2;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(27,42,88,.05);margin-bottom:14px">
      <input id="q" type="search" placeholder="Search job, community, address…" autocomplete="off" style="height:32px;width:250px;padding:0 10px;border:1px solid #BFB8AB;border-radius:4px;font-size:12.5px">
      <select id="fComm" style="height:32px;padding:0 8px;border:1px solid #BFB8AB;border-radius:4px;font-size:12.5px;min-width:180px">
        <option value="">All communities</option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#6F6963;margin-left:8px">
        <input id="fClosed" type="checkbox"> Show closed jobs too
      </label>
      <span style="margin-left:auto;font-size:12px;color:#908A82" id="countNote"></span>
      <button id="btnRefresh" style="height:30px;padding:0 12px;border:1px solid #BFB8AB;border-radius:4px;background:#fff;color:#6F6963;font-size:12.5px;font-weight:500;cursor:pointer">Refresh</button>
    </div>

    <div style="border:1px solid #E4DED2;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(27,42,88,.05);overflow:auto;max-height:70vh">
      <table>
        <thead>
          <tr>
            <th>Job</th>
            <th>Community</th>
            <th>Street Address</th>
            <th>City</th>
            <th>Key Status</th>
            <th>Delivered To</th>
            <th>Delivery Date</th>
            <th>Sale Date</th>
            <th>Scheduled Closing</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="emptyNote" style="display:none;margin-top:14px;padding:38px 24px;border:1px dashed #D8CFBE;border-radius:12px;background:#fff;text-align:center;color:#6F6963;font-size:14px"></div>
  </main>

</div>

<div id="toasts" style="position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:400px" aria-live="polite"></div>

<script>
/* OLH shared authentication + change tracking.
 *
 * Backend contract (Airtable-backed, same {apiBase} as /jobs and /update-job):
 *   POST {apiBase}/sign-in   {email, password}  -> {user:{…}, token}
 *                            409 {error, mustSetPassword:true, inviteToken} when the
 *                            account is still pending its first password.
 *   GET  {apiBase}/session   Authorization: Bearer <token> -> {user}
 *   POST {apiBase}/sign-out
 *
 * Password lifecycle (invite-based — the backend owns every credential):
 *   POST {apiBase}/invite            {userId}                -> {ok:true}
 *        Admin re-sends the set-password email. Creating a user sends it once
 *        automatically, so this is only for expired or lost invites.
 *   GET  {apiBase}/invite/:token     -> {email, name, expiresAt}
 *        Validates a set-password link before showing the form.
 *   POST {apiBase}/set-password      {token, password}       -> {user, token}
 *        Consumes a single-use invite or reset token and signs the user in.
 *   POST {apiBase}/forgot-password   {email}                 -> {ok:true}
 *        Always 200, even for unknown emails, so the endpoint cannot be used
 *        to discover who has an account.
 *
 * The frontend never hashes, stores, or transmits a password anywhere except
 * these endpoints over TLS. The backend must: hash with bcrypt/argon2 (never
 * store plaintext or a reversible form), issue single-use tokens with a short
 * expiry (24h invite, 1h reset), invalidate a token once consumed, and enforce
 * the password policy server-side — the client-side meter below is guidance
 * for the person typing, not a security control.
 *   POST {apiBase}/audit     {recordId, job, field, label, from, to, action, page}
 *                            -> {entry, conflict?:{by,at,value}}
 *   GET  {apiBase}/audit?recordId=rec…&field=…&since=ISO -> {entries:[…]}
 *
 * Airtable tables this expects:
 *   Users     — Name, Email, Role (Admin | QA Manager | Construction Manager |
 *               Leadership | Customer Care), Division, Active
 *   Audit Log — Record Id, Job #, Field, Label, From, To, Action, Page,
 *               Changed By, Changed At   (append-only, never pruned)
 *
 * With no backend reachable the module runs in DEMO mode: the sign-in screen
 * accepts any roster name, the session lives in localStorage, and the audit log
 * is local to the browser. Demo mode is always labelled on screen so nobody
 * mistakes a local log for the shared one. */
(function () {
  // The runtime can evaluate helmet scripts more than once. The custom elements
  // close over the first instance's state, so a second evaluation must not
  // replace window.OLHAuth with a fresh, empty one.
  if (window.OLHAuth && window.OLHAudit) return;

  var SESSION_KEY = "olh.session.v1";
  var LOG_KEY = "olh.audit.v1";

  /* The permission catalog. Adding a capability means naming it here and
     checking it with Auth.can() at the point of use. */
  /* The pages a role can open. Each is a "page.*" permission so page access
     and capabilities share one grid, one save, and one Auth.can() check. */
  var PAGES = [
    { key: "page.home", label: "All Views (home)", href: "index.html", note: "The launcher. A role without this lands on the first page it can open." },
    { key: "page.tracker", label: "QA & Closing Tracker", href: "tracker.html", note: "The homesite grid \u2014 walk dates, meters, keys and notes." },
    { key: "page.completion", label: "Completion Report", href: "completion.html", note: "Homesites under construction with their projected completion and closing dates." },
    { key: "page.walks", label: "Walk Schedule", href: "walk-calendar.html", note: "The published walk calendar and its export." },
    { key: "page.qamgmt", label: "QA Management", href: "qa-management.html", note: "Today's walks by community \u2014 mark each one completed or missed." },
    { key: "page.walkstoschedule", label: "Walks To Schedule", href: "walks-to-schedule.html", note: "Homesites where QAI is complete but the CEL letter has not been sent yet." },
    { key: "page.scheduler", label: "Schedule Optimizer", href: "scheduler.html", note: "Proposed walk moves and the workload balance behind them." },
    { key: "page.workload", label: "Workload Predictor", href: "workload.html", note: "Forecast walk volume per QA Manager." },
    { key: "page.admin", label: "User Administration", href: "admin.html", note: "This console \u2014 the roster and this grid." },
    { key: "page.keys", label: "Keys", href: "keys.html", note: "Job #, community, address and key handover status, editable. Admin and Division Leadership only." }
  ];

  var PERMS = [
    { key: "suite.view", label: "View the suite", note: "Sign in and read every page. Grant only this and the role is view only \u2014 nothing on any page can be changed." },
    { key: "tracker.edit", label: "Edit tracker fields", note: "Change dates, walk managers, notes and checkboxes on the QA & Closing Tracker." },
    { key: "walk.schedule", label: "Schedule & reassign walks", note: "Book Celebration and Acceptance Walks and move them between QA Managers." },
    { key: "optimizer.apply", label: "Apply optimizer suggestions", note: "Accept the schedule optimizer's proposed moves, one at a time or all at once." },
    { key: "roster.manage", label: "Manage users & permissions", note: "Add and suspend users, change roles, and edit this grid." }
  ];

  var ALL_PAGES = PAGES.map(function (p) { return p.key; });

  // Shipped defaults. An admin can override these; ROLE_LOCKS keeps the
  // console reachable no matter what the grid is set to.
  var DEFAULT_ROLES = {
    admin: { label: "Admin", can: ["suite.view", "tracker.edit", "walk.schedule", "optimizer.apply", "roster.manage"].concat(ALL_PAGES) },
    qam: { label: "QA Manager", can: ["suite.view", "tracker.edit", "walk.schedule", "optimizer.apply", "page.home", "page.tracker", "page.completion", "page.walks", "page.qamgmt", "page.walkstoschedule", "page.scheduler", "page.workload"] },
    cm: { label: "Construction Manager", can: ["suite.view", "tracker.edit", "page.home", "page.tracker", "page.completion", "page.walks"] },
    ccr: { label: "Customer Care", can: ["suite.view", "tracker.edit", "page.home", "page.tracker", "page.walks", "page.qamgmt", "page.walkstoschedule"] },
    leadership: { label: "Division Leadership", can: ["suite.view", "page.home", "page.tracker", "page.completion", "page.walks", "page.qamgmt", "page.walkstoschedule", "page.scheduler", "page.workload", "page.keys"] },
    concierge: { label: "Concierge", can: ["suite.view", "page.home", "page.tracker", "page.scheduler"] }
  };
  var ROLE_LOCKS = { admin: ["suite.view", "roster.manage", "page.admin"] };
  /* Only admins run the console, so page.admin is never handed to anyone else. */
  var ADMIN_ONLY_PAGES = ["page.admin"];
  /* Every capability implies being able to see the thing you are changing, so
     an editing permission drags "View the suite" along with it. */
  var IMPLIES_VIEW = ["tracker.edit", "walk.schedule", "optimizer.apply", "roster.manage"].concat(ALL_PAGES);
  /* An editing capability is meaningless without the page it edits. */
  var NEEDS_PAGE = { "tracker.edit": "page.tracker", "walk.schedule": "page.walks", "optimizer.apply": "page.scheduler", "roster.manage": "page.admin" };
  var ROLES_KEY = "olh.roles.v1";

  var ROLES = {};

  /* The single owner of the matrix rules: locked permissions are always
     present, and anything that edits implies being able to view. Both the
     saved matrix and the grid's in-progress draft run through this, so what
     an admin sees is exactly what gets written. */
  function normalizeMatrix(src) {
    var out = {};
    Object.keys(DEFAULT_ROLES).forEach(function (r) {
      var can = (src && src[r]) ? src[r].slice() : DEFAULT_ROLES[r].can.slice();
      (ROLE_LOCKS[r] || []).forEach(function (p) { if (can.indexOf(p) < 0) can.push(p); });
      if (can.some(function (p) { return IMPLIES_VIEW.indexOf(p) >= 0; }) && can.indexOf("suite.view") < 0)
        can.push("suite.view");
      Object.keys(NEEDS_PAGE).forEach(function (cap) {
        if (can.indexOf(cap) >= 0 && can.indexOf(NEEDS_PAGE[cap]) < 0) can.push(NEEDS_PAGE[cap]);
      });
      if (r !== "admin") can = can.filter(function (p) { return ADMIN_ONLY_PAGES.indexOf(p) < 0; });
      out[r] = can;
    });
    return out;
  }

  function applyMatrix(src) {
    var norm = normalizeMatrix(src);
    Object.keys(DEFAULT_ROLES).forEach(function (r) {
      ROLES[r] = { label: DEFAULT_ROLES[r].label, can: norm[r] };
    });
  }
  applyMatrix(readStoreEarly(ROLES_KEY));
  function readStoreEarly(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  var DENY = {
    "suite.view": "Your account does not have access to the OLH Suite yet. Ask an admin to grant it.",
    "tracker.edit": "Your role can view the tracker but not change it.",
    "walk.schedule": "Only QA Managers and admins can schedule or reassign walks.",
    "optimizer.apply": "Only QA Managers and admins can apply optimizer suggestions.",
    "roster.manage": "Only admins can change the roster."
  };
  PAGES.forEach(function (p) { DENY[p.key] = "Your role does not have access to the " + p.label + " page."; });
  var ROLE_ALIAS = {
    "admin": "admin", "qa manager": "qam", "qam": "qam",
    "construction manager": "cm", "cm": "cm",
    "customer care": "ccr", "customer care rep": "ccr", "ccr": "ccr",
    "leadership": "leadership", "division leadership": "leadership"
  };

  var state = { user: null, token: null, demo: false, base: "/api", ready: false };
  var listeners = [];
  function emit() { listeners.slice().forEach(function (fn) { try { fn(state.user); } catch (e) {} }); }

  function matrixOf() {
    var out = {};
    Object.keys(ROLES).forEach(function (r) { out[r] = ROLES[r].can.slice(); });
    return out;
  }

  function readStore(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function writeStore(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function normRole(r) { return ROLE_ALIAS[String(r || "").toLowerCase().trim()] || "leadership"; }
  function initials(n) {
    return String(n || "?").split(/[\s,]+/).filter(Boolean).slice(0, 2)
      .map(function (p) { return p[0].toUpperCase(); }).join("");
  }

  /* Roster fallback for demo mode: the walk roster is the QA Manager list, the
     tracker's managers are the construction managers. */
  function demoDirectory() {
    var out = [];
    (window.WALK_ROSTER || []).forEach(function (p) {
      out.push({
        id: p.id, name: p.name.replace(/\s*\(OLH\)\s*$/i, ""),
        email: p.name.toLowerCase().replace(/[^a-z]+/g, ".").replace(/^\.|\.$/g, "") + "@lennar.com",
        role: p.role === "QAM" ? "qam" : "ccr", division: p.home || "Central Florida"
      });
    });
    ((window.OLH_DATA && window.OLH_DATA.managers) || []).slice(0, 40).forEach(function (m) {
      if (out.some(function (u) { return u.name === m.name; })) return;
      out.push({
        id: m.id, name: m.name,
        email: m.name.toLowerCase().replace(/[^a-z]+/g, ".").replace(/^\.|\.$/g, "") + "@lennar.com",
        role: "cm", division: "Central Florida"
      });
    });
    out.unshift({ id: "usr-admin", name: "OLH Administrator", email: "olh.admin@lennar.com", role: "admin", division: "Central Florida" });
    out.splice(1, 0, { id: "usr-lead", name: "Division Leadership", email: "division.leadership@lennar.com", role: "leadership", division: "Central Florida" });
    return out;
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = { "Content-Type": "application/json", Accept: "application/json" };
    if (state.token) {
      headers.Authorization = "Bearer " + state.token;
      headers["X-OLH-Token"] = "Bearer " + state.token;
    }
    return fetch(state.base + path, {
      method: opts.method || "GET", headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok) {
          var e = new Error((data && data.error) || "Request failed (" + res.status + ")");
          if (data) { e.mustSetPassword = data.mustSetPassword; e.inviteToken = data.inviteToken; }
          e.status = res.status;
          throw e;
        }
        return data;
      });
    });
  }

  var Auth = {
    roles: ROLES,
    configure: function (base) { if (base) state.base = String(base).replace(/\/$/, ""); return Auth; },
    user: function () { return state.user; },
    isDemo: function () { return state.demo; },
    token: function () {
      if (state.token) return state.token;
      var st = readStore(SESSION_KEY, null);
      return (st && st.token) || "";
    },
    authHeaders: function (extra) {
      var h = extra || {};
      h.Accept = "application/json";
      var tok = Auth.token();
      if (tok) {
        /* Both, deliberately. Azure Static Web Apps overwrites
           Authorization with its own bearer token before a managed
           function sees it (Azure/static-web-apps#158), so on Azure the
           only copy that survives is the one in a header its proxy does
           not recognise. bearer() in netlify/lib/olh-auth.js prefers
           X-OLH-Token and falls back to Authorization, so one build works
           on both hosts and neither header is load-bearing alone. */
        h.Authorization = "Bearer " + tok;
        h["X-OLH-Token"] = "Bearer " + tok;
      }
      return h;
    },
    ready: function () { return state.ready; },
    onChange: function (fn) { listeners.push(fn); return function () { listeners = listeners.filter(function (f) { return f !== fn; }); }; },

    roleLabel: function (r) { var x = ROLES[r || (state.user && state.user.role)]; return x ? x.label : "Viewer"; },
    can: function (perm) {
      var u = state.user; if (!u) return false;
      var r = ROLES[u.role]; return !!(r && r.can.indexOf(perm) >= 0);
    },
    denyReason: function (perm) { return DENY[perm] || "You do not have access to that."; },

    /* Resolve the session: a live backend first, the stored session second.
       Never blocks the UI on a dead endpoint for longer than a moment. */
    restore: function () {
      if (state._restoring) return state._restoring;
      var stored = readStore(SESSION_KEY, null);
      if (stored && stored.token) state.token = stored.token;
      var timeout = new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, 3500); });
      state._restoring = Promise.race([api("/session"), timeout]).then(function (data) {
        if (!data || !data.user) throw Object.assign(new Error("no session"), { status: 401 });
        state.user = Object.assign({}, data.user, { role: normRole(data.user.role) });
        state.demo = false;
      }).catch(function (err) {
        // A backend that ANSWERED -- 401 for no session, 403 for suspended --
        // is a live backend, and being signed out is not preview mode. Only a
        // network failure or the timeout above may fall back to demo.
        if (err && err.status) {
          state.demo = false; state.user = null; state.token = null;
          try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
          return;
        }
        state.demo = true;
        state.user = stored && stored.user ? stored.user : null;
      }).then(function () {
        return Auth.loadMatrix().catch(function () {});
      }).then(function () {
        state.ready = true; emit(); return state.user;
      });
      return state._restoring;
    },

    signIn: function (email, password) {
      return api("/sign-in", { method: "POST", body: { email: email, password: password } })
        .then(function (data) {
          state.user = Object.assign({}, data.user, { role: normRole(data.user.role) });
          state.token = data.token || null; state.demo = false; state.ready = true;
          writeStore(SESSION_KEY, { user: state.user, token: state.token });
          emit(); return state.user;
        })
        .catch(function (err) {
          // A real backend answering "set your password first" is not a
          // preview-mode signal — pass it through untouched.
          if (err && err.mustSetPassword) throw err;
          // The server answered and said no. Falling through to the roster
          // below would turn a wrong password into a successful sign-in.
          if (err && err.status) throw err;
          // No backend: fall back to the roster directory.
          var dir = demoDirectory();
          var q = String(email || "").toLowerCase().trim();
          var hit = dir.find(function (u) { return u.email === q || u.name.toLowerCase() === q; });
          if (!hit) throw new Error(state.demo ? "Cannot reach the OLH server, so sign-in is unavailable. Check your connection and try again." : (err.message || "Sign-in failed."));
          state.user = hit; state.token = null; state.demo = true; state.ready = true;
          writeStore(SESSION_KEY, { user: hit, token: null });
          emit(); return hit;
        });
    },

    signOut: function () {
      var done = function () {
        state.user = null; state.token = null;
        state._restoring = Promise.resolve(null);
        try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
        emit();
      };
      return api("/sign-out", { method: "POST" }).then(done, done);
    },

    directory: demoDirectory,

    /* ---- Role matrix ---------------------------------------------------
     * GET {apiBase}/roles         -> {roles:{admin:["tracker.edit",…],…}}
     * PUT {apiBase}/roles {roles} -> {roles}
     * Airtable: a Roles table with Role and Permissions (multi-select). */
    perms: function () { return PERMS.slice(); },
    pages: function () { return PAGES.slice(); },
    /* Pages this role can open, in catalog order — drives the home tiles and
       the "where do I send them" fallback after sign-in. */
    allowedPages: function (role) {
      var can = (ROLES[role || (state.user && state.user.role)] || { can: [] }).can;
      return PAGES.filter(function (p) { return can.indexOf(p.key) >= 0; });
    },
    canViewPage: function (key) { return Auth.can(key); },
    /* Call at the top of a page: returns null when allowed, or a reason plus
       somewhere the person can actually go. */
    pageGuard: function (key) {
      if (!state.user) return null;
      if (Auth.can(key)) return null;
      var page = PAGES.filter(function (p) { return p.key === key; })[0];
      var open = Auth.allowedPages();
      return {
        title: "You Do Not Have Access to This Page",
        reason: "Your role (" + Auth.roleLabel() + ") cannot open " +
          (page ? page.label : "this page") + ". An admin can grant it under Roles & Permissions \u2192 Page Access.",
        fallback: open[0] || null
      };
    },
    normalizeMatrix: normalizeMatrix,
    matrix: matrixOf,
    /* "View the suite" can't be unchecked while the role holds anything that
       requires seeing a page first. */
    lockedPerms: function (role, draft) {
      var locks = (ROLE_LOCKS[role] || []).slice();
      var can = (draft && draft[role]) || (ROLES[role] ? ROLES[role].can : []);
      if (can.some(function (p) { return IMPLIES_VIEW.indexOf(p) >= 0; }) && locks.indexOf("suite.view") < 0)
        locks.push("suite.view");
      if (role !== "admin") ADMIN_ONLY_PAGES.forEach(function (p) { if (locks.indexOf(p) < 0) locks.push(p); });
      Object.keys(NEEDS_PAGE).forEach(function (cap) {

      var pass = mkField("Password", "password", "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022", "password");
      form.appendChild(email.wrap);

      var forgot = el("button", "align-self:flex-end;margin-top:-26px;border:0;background:transparent;color:#005DAA;font-family:" + FONT + ";font-size:11.5px;font-weight:600;cursor:pointer;padding:0", "Forgot?");
      forgot.type = "button";
      form.appendChild(pass.wrap);
      pass.wrap.style.position = "relative";
      forgot.style.cssText = "position:absolute;top:0;right:0;border:0;background:transparent;color:#005DAA;font-family:" + FONT + ";font-size:11px;font-weight:600;cursor:pointer;padding:0";
      pass.wrap.appendChild(forgot);

      var err = el("span", "display:none;font-size:12px;font-weight:500;color:#AA1F23;text-wrap:pretty");
      form.appendChild(err);

      var btn = el("button", "height:44px;margin-top:2px;border:0;border-radius:4px;background:#005DAA;color:#fff;font-family:" + FONT + ";font-size:14.5px;font-weight:600;cursor:pointer;transition:background 160ms cubic-bezier(.2,.6,.2,1)", "Sign In");
      btn.type = "submit";
      btn.addEventListener("mouseenter", function () { btn.style.background = "#203F7C"; });
      btn.addEventListener("mouseleave", function () { btn.style.background = "#005DAA"; });
      form.appendChild(btn);

      var self = this;

      /* The response is identical whether or not the address exists, so this
         cannot be used to find out who has an account. */
      forgot.addEventListener("click", function () {
        var addr = email.input.value.trim();
        if (!addr) { err.textContent = "Enter your Lennar email first, then choose Forgot."; err.style.display = "block"; email.input.focus(); return; }
        forgot.disabled = true; forgot.textContent = "Sending\u2026";
        Passwords.forgot(addr).then(function () {
          err.style.display = "none";
          self.notice("Check Your Email",
            "If " + addr + " has an OLH account, a link to set a new password is on its way. It expires in an hour.");
        });
      });

      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        err.style.display = "none";
        btn.disabled = true; btn.textContent = "Signing In\u2026"; btn.style.opacity = ".6";
        Auth.signIn(email.input.value, pass.input.value).then(function () {
          self.paint();
        }).catch(function (e) {
          // A pending account is sent to set a password instead of being refused.
          if (e && e.mustSetPassword) { self.paintSetPassword(e.inviteToken); return; }
          err.textContent = e.message || "Sign-in failed.";
          err.style.display = "block";
          btn.disabled = false; btn.textContent = "Sign In"; btn.style.opacity = "1";
        });
      });
      card.appendChild(form);

      if (Auth.isDemo()) {
        var demo = el("div", "display:flex;flex-direction:column;gap:7px;padding-top:14px;border-top:1px solid #F1EBE1");
        demo.appendChild(el("span", "font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:#83553C", "Preview Mode \u00b7 No Backend"));
        demo.appendChild(el("span", "font-size:12px;line-height:1.5;color:#6F6963;text-wrap:pretty",
          "The sign-in service is not reachable from this preview. Enter any name from the OLH roster to continue \u2014 the change log will be local to this browser."));
        var row = el("div", "display:flex;flex-wrap:wrap;gap:6px;margin-top:2px");
        Auth.directory().slice(0, 4).forEach(function (u) {
          var chip = el("button", "height:26px;padding:0 10px;border:1px solid #BFB8AB;border-radius:999px;background:#fff;font-family:" + FONT + ";font-size:11.5px;font-weight:500;color:#303030;cursor:pointer", u.name + " \u00b7 " + Auth.roleLabel(u.role));
          chip.type = "button";
          chip.addEventListener("click", function () { email.input.value = u.email; pass.input.value = "preview"; });
          row.appendChild(chip);
        });
        demo.appendChild(row);
        card.appendChild(demo);
      }

      this.appendChild(card);
    }
  }

  /* ---- Header identity chip --------------------------------------------- */

  /* Renders into a shadow root: this element sits inside a React-rendered
     header, and React must never see the nodes it manages. */
  class OLHUserChip extends HTMLElement {
    connectedCallback() {
      if (!this._root) this._root = this.attachShadow({ mode: "open" });
      if (!this._off) this._off = Auth.onChange(this.paint.bind(this));
      this.paint();
      if (!Auth.ready()) Auth.restore();
    }
    disconnectedCallback() { if (this._off) { this._off(); this._off = null; } }
    paint() {
      var u = Auth.user();
      var root = this._root || this.attachShadow({ mode: "open" });
      this._root = root;
      root.innerHTML = "";
      // :host styling lives in the shadow root — React owns the style attribute
      // on this element and would clobber anything set inline here.
      var host = el("span", "display:inline-flex;align-items:center;gap:9px;font-family:" + FONT);
      var css = document.createElement("style");
      css.textContent = ":host{display:inline-flex;align-items:center}";
      root.appendChild(css);
      if (!u) return;
      var dark = this.getAttribute("tone") !== "light";
      var av = el("span", "flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:" + (dark ? "rgba(255,255,255,.16)" : "#EAF2F9") + ";color:" + (dark ? "#fff" : "#005DAA") + ";font-size:10.5px;font-weight:700;letter-spacing:.02em", initials(u.name));
      var txt = el("span", "display:flex;flex-direction:column;line-height:1.2;flex:0 0 auto");
      txt.appendChild(el("span", "font-size:12px;font-weight:600;color:" + (dark ? "#fff" : "#303030") + ";white-space:nowrap", u.name));
      txt.appendChild(el("span", "font-size:10px;font-weight:500;color:" + (dark ? "#C7BFB2" : "#908A82") + ";white-space:nowrap",
        Auth.roleLabel(u.role) + (Auth.isDemo() ? " \u00b7 preview" : "")));
      var out = el("button", "height:26px;padding:0 10px;border:1px solid " + (dark ? "rgba(255,255,255,.35)" : "#BFB8AB") + ";border-radius:4px;background:transparent;color:" + (dark ? "#fff" : "#303030") + ";font-family:" + FONT + ";font-size:11.5px;font-weight:500;cursor:pointer;white-space:nowrap;flex:0 0 auto", "Sign Out");
      out.addEventListener("click", function () { Auth.signOut().then(function () { location.reload(); }); });
      host.appendChild(av); host.appendChild(txt); host.appendChild(out);
      root.appendChild(host);
    }
  }

  if (!customElements.get("olh-signin")) customElements.define("olh-signin", OLHSignIn);

  /* Mount the gate outside any framework root. It repaints itself from the
     auth subscription, so sign-out brings it straight back. */
  function mountGate() {
    if (document.querySelector("olh-signin[data-olh-gate]")) return;
    var g = document.createElement("olh-signin");
    g.setAttribute("data-olh-gate", "");
    document.body.appendChild(g);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mountGate);
  else mountGate();
  if (!customElements.get("olh-user-chip")) customElements.define("olh-user-chip", OLHUserChip);

  window.OLHPasswords = Passwords;
  window.OLHUsers = Users;
  window.OLHAuth = Auth;
  window.OLHAudit = Audit;
})();

</script>

<script>
(function(){
  'use strict';
  var API = '/api';
  var jobs = [];
  var managers = [];

  function pd(v){ if(!v) return null;
    var s = String(v);
    var d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s+'T12:00:00') : new Date(s);
    return isNaN(d.getTime()) ? null : d; }
  function fmtD(v){ var d = pd(v); if(!d) return '\u2014';
    return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function jobLink(job){
    if(!job) return null;
    return 'homesite.html?job=' + encodeURIComponent(job);
  }

  function toast(kind, title, body){
    var el = document.createElement('div');
    el.style.cssText = 'display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:4px;background:#fff;border:1px solid #D8CFBE;border-left:3px solid ' +
      (kind === 'err' ? '#AA1F23' : '#016738') + ';box-shadow:0 6px 20px rgba(48,48,48,.12);font-size:12.5px;line-height:1.4';
    el.innerHTML = '<div><span style="font-weight:600;display:block;margin-bottom:1px;color:' +
      (kind === 'err' ? '#AA1F23' : '#303030') + '">' + esc(title) + '</span><span style="color:#6F6963">' + esc(body) + '</span></div>';
    document.getElementById('toasts').appendChild(el);
    setTimeout(function(){ el.remove(); }, kind === 'err' ? 8000 : 3200);
  }

  function authHeaders(extra){
    if(!window.OLHAuth || typeof window.OLHAuth.authHeaders !== 'function'){
      throw new Error('The sign-in module has not loaded, so this page cannot authenticate. Reload the page.');
    }
    return window.OLHAuth.authHeaders(extra);
  }

  function canEdit(){ return window.OLHAuth ? window.OLHAuth.can('tracker.edit') : false; }

  var KEY_STATUS_OPTIONS = ['Pending', 'Priority', 'Received', 'Delivered to title', 'Delivered to WHC', 'Other', 'Issue'];

  /* One row per job, not per walk -- this is a summary of identity and key
     handover status, not the full tracker grid. Only the Keys section
     (Key Status / Delivered To / Delivery Date) is editable here; Sale Date
     and Scheduled Closing are Salesforce-synced and read-only everywhere. */
  function buildRows(){
    var out = [];
    jobs.forEach(function(r){
      var f = r.fields;
      out.push({
        recordId: r.id,
        closed: f['Record Status'] === 'Closed',
        job: f['Job #'] || '',
        community: f['Community'] || 'Unassigned Community',
        address: f['Street Address'] || '',
        city: f['City'] || '',
        keyStatus: f['Key Status'] || '',
        deliveredTo: f['Delivered To'] || '',
        deliveryDate: f['Delivery Date'] || null,
        saleDate: f['Sale Date'] || null,
        closingDate: f['Scheduled Closing Date'] || null
      });
    });
    return out;
  }

  function render(){
    var q = (document.getElementById('q').value || '').trim().toLowerCase();
    var fComm = document.getElementById('fComm').value;
    var showClosed = document.getElementById('fClosed').checked;

    var all = buildRows();

    var comms = Array.from(new Set(all.map(function(r){ return r.community; }))).sort(function(a,b){ return a.localeCompare(b); });
    var commSel = document.getElementById('fComm');
    if(commSel.dataset.built !== String(comms.length)){
      var cur = commSel.value;
      commSel.innerHTML = '<option value="">All communities</option>' +
        comms.map(function(c){ return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
      commSel.value = cur;
      commSel.dataset.built = String(comms.length);
    }

    var rows = all.filter(function(r){
      if(!showClosed && r.closed) return false;
      if(fComm && r.community !== fComm) return false;
      if(q && (r.job + ' ' + r.community + ' ' + r.address + ' ' + r.city).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });

    rows.sort(function(a,b){
      return a.community.localeCompare(b.community) || a.job.localeCompare(b.job);
    });

    document.getElementById('countNote').textContent =
      rows.length + (rows.length === 1 ? ' homesite' : ' homesites') +
      (showClosed ? ' \u00b7 showing ' + rows.length + ' of ' + all.length + ' total' : '');

    var tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    document.getElementById('emptyNote').style.display = rows.length ? 'none' : 'block';
    document.getElementById('emptyNote').textContent = all.length
      ? 'No homesites match these filters.'
      : 'No homesite data on record.';

    rows.forEach(function(row){
      var tr = document.createElement('tr');
      var jobHref = jobLink(row.job);
      tr.innerHTML =
        '<td>' + (jobHref ? '<a href="' + jobHref + '">' + esc(row.job || '(no job #)') + '</a>' : esc(row.job || '\u2014')) + '</td>' +
        '<td>' + esc(row.community) + '</td>' +
        '<td>' + esc(row.address || '\u2014') + '</td>' +
        '<td>' + esc(row.city || '\u2014') + '</td>' +
        '<td data-cell="keyStatus"></td>' +
        '<td data-cell="deliveredTo"></td>' +
        '<td data-cell="deliveryDate"></td>' +
        '<td>' + fmtD(row.saleDate) + '</td>' +
        '<td>' + fmtD(row.closingDate) + '</td>';

      var editable = canEdit();

      var statusTd = tr.querySelector('[data-cell="keyStatus"]');
      var statusSel = document.createElement('select');
      statusSel.disabled = !editable;
      statusSel.innerHTML = '<option value=""></option>' +
        KEY_STATUS_OPTIONS.map(function(o){ return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('');
      statusSel.value = KEY_STATUS_OPTIONS.indexOf(row.keyStatus) >= 0 ? row.keyStatus : '';
      statusSel.addEventListener('change', function(){ saveField(row, 'Key Status', statusSel.value || null, statusSel); });
      statusTd.appendChild(statusSel);

      var deliveredTd = tr.querySelector('[data-cell="deliveredTo"]');
      var deliveredInput = document.createElement('input');
      deliveredInput.type = 'text';
      deliveredInput.disabled = !editable;
      deliveredInput.value = row.deliveredTo || '';
      deliveredInput.placeholder = editable ? '\u2014' : '';
      deliveredInput.addEventListener('change', function(){ saveField(row, 'Delivered To', deliveredInput.value.trim() || null, deliveredInput); });
      deliveredTd.appendChild(deliveredInput);

      var dateTd = tr.querySelector('[data-cell="deliveryDate"]');
      var dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.disabled = !editable;
      var dd = pd(row.deliveryDate);
      dateInput.value = dd ? (dd.getFullYear() + '-' + String(dd.getMonth() + 1).padStart(2, '0') + '-' + String(dd.getDate()).padStart(2, '0')) : '';
      dateInput.addEventListener('change', function(){ saveField(row, 'Delivery Date', dateInput.value || null, dateInput); });
      dateTd.appendChild(dateInput);

      tbody.appendChild(tr);
    });
  }

  async function saveField(row, field, value, inputEl){
    if(!canEdit()){ toast('err', 'Read-Only Access', window.OLHAuth ? window.OLHAuth.denyReason('tracker.edit') : 'You do not have access to that.'); return; }
    var prevDisabled = inputEl.disabled;
    inputEl.disabled = true;
    try{
      var res = await fetch(API + '/update-job', {
        method: 'POST', headers: authHeaders({'Content-Type':'application/json'}),
        body: JSON.stringify({recordId: row.recordId, fields: {[field]: value}})
      });
      var data = await res.json().catch(function(){ return null; });
      if(!res.ok) throw new Error((data && data.error) || ('Save failed (' + res.status + ')'));
      if(window.OLHAudit){
        window.OLHAudit.record({
          recordId: row.recordId, job: row.job, field: field, label: field,
          from: null, to: value, action: 'edit', page: 'Keys'
        }).catch(function(){});
      }
      toast('ok', 'Saved', row.job + ' \u00b7 ' + field + ' updated.');
    }catch(err){
      toast('err', 'Could Not Save', (err && err.message) || String(err));
    }finally{
      inputEl.disabled = prevDisabled;
    }
  }

  async function loadLive(){
    try{
      var res = await fetch(API + '/jobs', {headers: authHeaders()});
      var data = await res.json().catch(function(){ return null; });
      if(!res.ok || !data || !Array.isArray(data.jobs)) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
      jobs = data.jobs; managers = data.managers || [];
      render();
    }catch(err){
      toast('err', 'Could Not Load Homesite Data', (err && err.message) || String(err));
    }
  }

  function updateReadOnlyBar(){
    var user = window.OLHAuth && window.OLHAuth.user ? window.OLHAuth.user() : null;
    var bar = document.getElementById('readOnlyBar');
    // Page visibility is its own permission -- currently granted only to the
    // admin and leadership roles in Roles & Permissions -- separate from
    // tracker.edit, which controls whether the Keys fields below can be typed
    // into once someone is here.
    var canView = !window.OLHAuth || window.OLHAuth.can('page.keys');
    if(user && !canView){
      bar.style.display = 'flex';
      document.getElementById('readOnlyNote').textContent =
        'Signed in as ' + window.OLHAuth.roleLabel(user.role) + ' \u2014 your role does not have access to Keys.';
      document.getElementById('rows').innerHTML = '';
      document.querySelector('main').style.display = 'none';
      return;
    }
    document.querySelector('main').style.display = '';
    if(user && !canEdit()){
      bar.style.display = 'flex';
      document.getElementById('readOnlyNote').textContent =
        'Signed in as ' + window.OLHAuth.roleLabel(user.role) + ' \u2014 view only. ' + window.OLHAuth.denyReason('tracker.edit');
    } else {
      bar.style.display = 'none';
    }
    render();
  }

  function wireAuth(tries){
    if(!window.OLHAuth){
      if(tries < 120){ setTimeout(function(){ wireAuth(tries + 1); }, 50); return; }
      toast('err', 'Could Not Load Homesite Data', 'The sign-in module did not load. Reload the page.');
      return;
    }
    window.OLHAuth.configure(API);
    window.OLHAuth.onChange(updateReadOnlyBar);
    window.OLHAuth.restore().then(function(){ updateReadOnlyBar(); loadLive(); });
  }

  document.getElementById('q').addEventListener('input', function(){
    clearTimeout(window.__tsQt); window.__tsQt = setTimeout(render, 220);
  });
  document.getElementById('fComm').addEventListener('change', render);
  document.getElementById('fClosed').addEventListener('change', render);
  document.getElementById('btnRefresh').addEventListener('click', loadLive);

  wireAuth(0);
})();
</script>
</body>
</html>
