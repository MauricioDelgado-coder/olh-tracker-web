[build]
  # No build step. publish is an ALLOW-LIST directory, not the repo root.
  #
  # This used to be publish = ".", which uploads every file sitting in the repo
  # — and the repo root also holds the Cowork design folder ("OLH Tracker design
  # exploration") plus dev harnesses, the README and stray design-tool exports.
  # A 07/29 deploy published a 3.6 MB zip of the whole design folder that way,
  # and a later one published the folder itself, xlsx export and all. Blocking
  # each leak with a forced 404 was whack-a-mole; only files copied into public/
  # can be served now, so a new file in the repo is private by default.
  #
  # Anything the site needs must live in public/. Functions are unaffected —
  # Netlify picks them up from the functions path below, outside publish.
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---- Do not serve function source as static files ---------------------------
# publish = "." would otherwise expose netlify/functions/*.js at a public path.
# They hold no secrets, but there is no reason to publish server logic.
[[redirects]]
  from = "/netlify/*"
  to = "/blocked"
  status = 404
  force = true

# dev/ holds the local preview server and test harnesses. They contain no
# secrets, but they read the local PAT config path and must never be served.
[[redirects]]
  from = "/dev/*"
  to = "/blocked"
  status = 404
  force = true

# ---- Do not serve project documentation --------------------------------------
# publish = "." also exposes the markdown. README.md names the Airtable base id
# and describes the security posture (including that there is no login gate),
# which is a map for anyone who stumbles onto the unlisted URL. Nothing in the
# repo is a credential, but none of it needs to be public either.
# Note: /fonts/* is NOT blocked -- the woff2 files must stay servable.
[[redirects]]
  from = "/README.md"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/fonts/README.md"
  to = "/blocked"
  status = 404
  force = true

# AZURE-DEPLOY.md names the base id and the app settings, same as README.md, and
# for the same reason is not something to hand out at an unlisted URL. Blocked
# here as well as in public/staticwebapp.config.json so neither host is the one
# that serves it.
[[redirects]]
  from = "/AZURE-DEPLOY.md"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/.DS_Store"
  to = "/blocked"
  status = 404
  force = true

# ---- Never serve archives ---------------------------------------------------
# A design-tool export ("olh tracker design exploration.zip", 3.6 MB) sat in the
# repo root during the 07/29 deploys and publish = "." uploaded it, so the whole
# design folder — every homesite address, the manager roster, the data snapshots
# — was downloadable from the unlisted URL. The file is out of the working tree
# and .gitignore already covers *.zip, but `netlify deploy` uploads whatever is
# in the publish dir regardless of .gitignore, so ignoring it is not enough on
# its own. These forced rules make a stray archive unreachable even if one gets
# uploaded again. Netlify matches the decoded path, so cover both spellings of
# the known filename plus a generic suffix rule.
[[redirects]]
  from = "/olh tracker design exploration.zip"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/olh%20tracker%20design%20exploration.zip"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/*.zip"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/*.tar.gz"
  to = "/blocked"
  status = 404
  force = true

# ---- Friendly API paths -----------------------------------------------------
[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/jobs"
  status = 200
  force = true

[[redirects]]
  from = "/api/update-job"
  to = "/.netlify/functions/update-job"
  status = 200
  force = true

# ---- Keep the unlisted URL unlisted ----------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# index.html is now the landing page (hand-converted from OLH Home.dc.html);
# the editable tracker moved to /tracker and the completion report to
# /completion. Netlify serves the extensionless paths for these .html files.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/tracker.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/completion.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# tracker-new.html was the superseded "New Views" prototype. DELETED 2026-08.
#
# It was the one page never rebuilt through dev/build-live-pages.js, so it still
# carried the 994 KB / 900-record demo fixture as a manifest asset, and it
# predates the shared auth module entirely. Once the suite got a real sign-in
# gate that combination stopped being merely untidy: the page had no gate, and
# its own loadLive() fell back to the fixture, so /api/jobs answering 401 to an
# anonymous visitor would have rendered 900 invented homesites to them instead of
# stopping. Blocking the path would have left the file uploaded; removing it is
# the only version that is actually true.
#
# The /tracker-new and /tracker-new.html 301s that stood here were REMOVED in the
# 2026-08-03 (evening) release. They existed to catch links from inside the suite
# and there are none left: the 08-03 export dropped the page, and homesite.html
# now serves the job-detail role it was prototyping. What remains of the guard is
# DESIGN_LINKS in dev/build-live-pages.js, which still maps the design tool's
# "OLH Tracker - New Views.dc.html" onto tracker.html, so a re-export that
# resurrects such a link is rewritten at build time rather than shipped dead.
# An external bookmark now gets 404.html, which is the honest answer.

# homesite.html is the Homesite Detail page, new in the 08-03 (evening) export
# and the page tracker-new was a prototype for. It is reached from a job number
# rather than from the tile menu: JOB_LINK() on seven pages builds
# "homesite.html?job=<job#>", so unlike every other page here it has inbound
# links from all over the suite and a stale copy would be reached constantly.
# It is also the third page that WRITES -- commit() -> persist() PATCHes one
# field at a time through /api/update-job -- which is the same reason
# qa-management must never be cached: a stale bundle posts yesterday's field
# names. no-store.
[[headers]]
  for = "/homesite.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# scheduler / walk-calendar / workload are the QAM walk-planning pages. All
# three are bundled documents whose data comes entirely from the API at runtime:
# the build step (dev/build-live-pages.js) DELETES the olh-data demo fixture and
# the WALK_* snapshot from each one, so there is no local copy to fall back to.
# All of them read /api/walk-config for the roster, drive matrix and product map
# as well as /api/jobs. walk-calendar was originally wired for /api/jobs only,
# which is why its walk-manager list came up empty. If a fetch fails the page
# renders an explicit error instead of a stale sample -- the old fixture held 900
# synthetic homesites and must never reach a screen someone schedules from.
# no-store because the documents are rebuilt whenever the design is re-exported.
[[headers]]
  for = "/scheduler.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/walk-calendar.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# qa-management is the day-of walk console: today's walks grouped by community,
# each marked completed or missed. It is the second page after the tracker that
# WRITES, and the only one that writes in a batch, so it is also the one where a
# cached document does the most damage -- a stale bundle would post marks built
# from yesterday's field names. Same fixture-stripping as the pages above, and
# it reads WALK_ROSTER for manager names as well as /api/jobs.
[[headers]]
  for = "/qa-management.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/workload.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# workload-visualizer is a second workload view from the same design export,
# served at /workload-visualizer alongside /workload. Same deal as the pages
# above: the fixtures are stripped at build time and all data arrives from
# /api/jobs and /api/walk-config, so the document must never be cached.
[[headers]]
  for = "/workload-visualizer.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# admin.html is the user + permissions console, new in the 07/31 export. Only
# roles holding roster.manage can use it, and every endpoint behind it enforces
# that server-side -- reaching the page is not the same as being able to act on
# it. no-store like the rest; nothing here is safe to serve from a cache.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# ---- Friendly API path for the walk reference data --------------------------
[[redirects]]
  from = "/api/walk-config"
  to = "/.netlify/functions/walk-config"
  status = 200
  force = true

# ---- Accounts, permissions and the change log (added 2026-08) ---------------
# Eleven endpoints across four functions. They are grouped rather than one file
# each because they share olh-auth.js and most are a dozen lines of routing.
#
# A rewrite (status 200) leaves event.path as the ORIGINAL request path, so the
# handlers resolve their action with route(event, fnName), which accepts both
# /api/sign-in and /.netlify/functions/auth/sign-in. Do not change these to 301.
#
# Ordering matters: the /api/invite/* splat must come BEFORE the bare /api/invite
# rule, or POST /api/invite would be swallowed by the splat and arrive with an
# empty token.

# Session lifecycle -> auth.js
[[redirects]]
  from = "/api/sign-in"
  to = "/.netlify/functions/auth/sign-in"
  status = 200
  force = true

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/auth/session"
  status = 200
  force = true

[[redirects]]
  from = "/api/sign-out"
  to = "/.netlify/functions/auth/sign-out"
  status = 200
  force = true

# Password lifecycle -> password.js
[[redirects]]
  from = "/api/invite/*"
  to = "/.netlify/functions/password/invite/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/invite"
  to = "/.netlify/functions/password/invite"
  status = 200
  force = true

[[redirects]]
  from = "/api/set-password"
  to = "/.netlify/functions/password/set-password"
  status = 200
  force = true

[[redirects]]
  from = "/api/forgot-password"
  to = "/.netlify/functions/password/forgot-password"
  status = 200
  force = true

# User administration -> users.js
[[redirects]]
  from = "/api/users/*"
  to = "/.netlify/functions/users/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/users"
  to = "/.netlify/functions/users"
  status = 200
  force = true

# Permission matrix -> roles.js
[[redirects]]
  from = "/api/roles"
  to = "/.netlify/functions/roles"
  status = 200
  force = true

# Append-only change log -> audit.js
[[redirects]]
  from = "/api/audit"
  to = "/.netlify/functions/audit"
  status = 200
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Self-hosted brand fonts are immutable once deployed.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# ---- /version.json must never be cached ------------------------------------
# Written by dev/release.sh: {gitSha, exportDate, builtAt}. dev/whats-live.sh
# reads it to answer "is prod current?", and a CDN-cached copy makes it answer
# that question wrongly -- reporting a stale SHA, which is the one failure mode a
# tool whose entire job is currency must not have. The no-store rules above cover
# /*.html and /api/*; this file is neither.
#
# It exposes a short commit SHA and a build timestamp to anyone who asks. That is
# a deliberate trade for being able to check what is deployed without an
# investigation: the repo is private, the SHA reveals nothing without it, and the
# alternative was patching a build stamp into eight bundled pages on every
# re-export.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow, noarchive"
