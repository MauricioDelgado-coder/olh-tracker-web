[build]
  # No build step. publish is an ALLOW-LIST directory, not the repo root.
  #
  # This used to be publish = ".", which uploads every file sitting in the repo
  # — and the repo root also holds the Cowork design folder ("OLH Tracker design
  # exploration") plus dev harnesses, the README and stray design-tool exports.
  # A 07/29 deploy published a 3.6 MB zip of the whole design folder that way,
  # and a later one published the folder itself, xlsx export and all. Blocking
  # each leak with a forced 404 was whack-a-mole; only files copied into public/
  # can be served now, so a new file in the repo is private by default.
  #
  # Anything the site needs must live in public/. Functions are unaffected —
  # Netlify picks them up from the functions path below, outside publish.
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---- Do not serve function source as static files ---------------------------
# publish = "." would otherwise expose netlify/functions/*.js at a public path.
# They hold no secrets, but there is no reason to publish server logic.
[[redirects]]
  from = "/netlify/*"
  to = "/blocked"
  status = 404
  force = true

# dev/ holds the local preview server and test harnesses. They contain no
# secrets, but they read the local PAT config path and must never be served.
[[redirects]]
  from = "/dev/*"
  to = "/blocked"
  status = 404
  force = true

# ---- Do not serve project documentation --------------------------------------
# publish = "." also exposes the markdown. README.md names the Airtable base id
# and describes the security posture (including that there is no login gate),
# which is a map for anyone who stumbles onto the unlisted URL. Nothing in the
# repo is a credential, but none of it needs to be public either.
# Note: /fonts/* is NOT blocked -- the woff2 files must stay servable.
[[redirects]]
  from = "/README.md"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/fonts/README.md"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/.DS_Store"
  to = "/blocked"
  status = 404
  force = true

# ---- Never serve archives ---------------------------------------------------
# A design-tool export ("olh tracker design exploration.zip", 3.6 MB) sat in the
# repo root during the 07/29 deploys and publish = "." uploaded it, so the whole
# design folder — every homesite address, the manager roster, the data snapshots
# — was downloadable from the unlisted URL. The file is out of the working tree
# and .gitignore already covers *.zip, but `netlify deploy` uploads whatever is
# in the publish dir regardless of .gitignore, so ignoring it is not enough on
# its own. These forced rules make a stray archive unreachable even if one gets
# uploaded again. Netlify matches the decoded path, so cover both spellings of
# the known filename plus a generic suffix rule.
[[redirects]]
  from = "/olh tracker design exploration.zip"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/olh%20tracker%20design%20exploration.zip"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/*.zip"
  to = "/blocked"
  status = 404
  force = true

[[redirects]]
  from = "/*.tar.gz"
  to = "/blocked"
  status = 404
  force = true

# ---- Friendly API paths -----------------------------------------------------
[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/jobs"
  status = 200
  force = true

[[redirects]]
  from = "/api/update-job"
  to = "/.netlify/functions/update-job"
  status = 200
  force = true

# ---- Keep the unlisted URL unlisted ----------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# index.html is now the landing page (hand-converted from OLH Home.dc.html);
# the editable tracker moved to /tracker and the completion report to
# /completion. Netlify serves the extensionless paths for these .html files.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/tracker.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/completion.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# tracker-new.html is the "New Views" design (My Queue, Pipeline Board,
# Homesite Detail, Division Dashboard, Keys Board) reading the same live
# /api/jobs data. It is READ-ONLY -- it never calls /api/update-job -- so it
# sits alongside index.html rather than replacing it; editing still only
# happens in the tracker at /.
[[headers]]
  for = "/tracker-new.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Self-hosted brand fonts are immutable once deployed.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
