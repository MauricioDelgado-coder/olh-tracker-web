name: Deploy to Azure Static Web Apps

# Mirrors the Netlify Git-connected deploy: every push to main publishes.
#
# The one non-obvious step is staging the handlers. Static Web Apps packages
# api/ and nothing above it, so api/_netlify (gitignored, generated from
# netlify/) has to be built here or every endpoint 500s after a green deploy.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # The job name MUST stay `build_and_deploy_job`. The SWA CLI reads
  # app_location / api_location / output_location out of this file by looking for
  # exactly that key, so a friendlier name makes `swa deploy` fall back to
  # whatever flags happen to be on the command line:
  #
  #   Error reading workflow configuration: missing property
  #   "jobs.build_and_deploy_job" in the SWA workflow file ...
  #
  # It is only a warning, which is the problem — a deploy that silently used the
  # default app_location of "." would publish the repo root, and publishing the
  # repo root instead of public/ is the exact 07/29 leak netlify.toml was
  # rewritten to prevent.
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage the shared handlers into api/_netlify
        run: node dev/build-azure-api.js

      - name: Assert the staged copy matches netlify/
        run: node dev/build-azure-api.js --check

      - name: Assert server and client permission rules agree
        # check-page-perms.js only ran ad hoc before this line existed, which is
        # exactly how the server's own PAGE_LABEL fell out of sync with its
        # ALL_PAGES list (page.redflags silently rendered as "the undefined
        # page." in the refusal message) and how the shared client auth module
        # embedded in 11 pages went a full release cycle missing page.redflags
        # and page.bonus entirely. A check nobody is required to run is a check
        # that only fires when someone remembers -- this makes remembering not
        # the thing standing between a drift and a blocked deploy.
        run: node dev/check-page-perms.js

      - name: Assert no page carries a stale copy of the shared auth module
        # check-page-perms.js above only validates netlify/lib/olh-auth.js
        # against itself; it cannot see the 11 pages that each carry their own
        # embedded copy of the same rules for client-side nav/redirect. This is
        # the check that would have caught page.redflags and page.bonus missing
        # from all of them.
        run: node dev/patch-stale-auth-module.js --check

      - name: Assert no page throws on load
        # The 08/01 export shipped a bundler-mangled `var mkField` that killed a
        # whole inline script and showed as a red SyntaxError banner across the
        # live site. Cheap to check, invisible if you don't.
        #
        # This blocks the deploy. It ran with continue-on-error until 08/21,
        # which meant the one check written to catch that exact failure could
        # only annotate the run while the broken page shipped anyway. All 19
        # pages pass clean today, so making it a gate costs nothing until it
        # catches something -- which is the entire point of it.
        run: bash dev/check-export-errors.sh public

      - name: Assert every error message is reachable on screen
        # The 08/21 cap bug was refused server-side and the scheduler showed
        # nothing: the handler DID set a message, but that message was bound
        # only inside a sub-panel that was closed at the time, so a refused
        # save looked exactly like a successful one. walk-calendar.html was
        # worse -- its `msg` had six writers and no binding at all.
        #
        # Nothing about that is visible in a diff. The assignment is correct,
        # the binding exists, the page loads clean; what is wrong is the
        # relation between where a message is written and where it is drawn,
        # which is precisely what a machine can check. Blocking, because an
        # error the user cannot see is the same as no error.
        run: node dev/check-error-visibility.js public

      - name: Assert no page claims a save it did not make
        # The other half of the same failure. homesite.html reported "Saved" on
        # a branch that never called the API, because loadLive() 401'd and left
        # state.live false -- so every edit was discarded silently while the
        # page confirmed it, and the audit log recorded changes that never
        # happened. A save that lies is worse than one that fails loudly: it
        # costs trust in every other row on the page.
        #
        # Requires a success report to sit after an awaited write, or a .then()
        # on one. Preview-only paths are in the script's KNOWN_SAFE with their
        # reason.
        run: node dev/check-success-honesty.js public

      # The deploy action's own failure for a missing token is a 21-second docker
      # invocation followed by "An unknown exception has occurred", which reads
      # like the deploy broke rather than like a secret is unset. Checking first
      # turns that into one line at the top of the job.
      #
      # The token goes through `env:` rather than being interpolated into the
      # script: a secret expanded directly into a `run:` block can end up in the
      # log. Only its LENGTH is printed, which distinguishes the two cases that
      # look identical from the outside -- absent versus present-but-wrong.
      - name: Check the deployment token is set
        env:
          TOK: ${{ secrets.AZURE_STATIC_WEB_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "::error::AZURE_STATIC_WEB_TOKEN is empty. It must be a REPOSITORY secret (Settings -> Secrets and variables -> Actions -> Secrets tab). A name that does not match this one exactly, an Environment secret, or a Variable instead of a Secret all resolve to empty here."
            exit 1
          fi
          echo "Deployment token present (${#TOK} chars)."

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'public'
          api_location: 'api'
          # No front-end build. The eight pages are self-contained documents
          # produced by dev/build-live-pages.js and committed to public/, so
          # Oryx must not try to detect and build a framework here.
          output_location: ''
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close staging environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_TOKEN }}
          action: close
